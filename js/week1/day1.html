            padding: 0;
            box-sizing: border-box;

            color: #1e1b13;

            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .slide-deck {
            max-width: 1200px;
            width: 100%;
            background: #ffffff;
            border-radius: 2rem;
            padding: 2rem;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);

            overflow-y: auto;
        }

        .progress-row {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .progress-track {
            flex: 1;
            height: 6px;
            background: #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 12.5%;
            background: linear-gradient(90deg, #2563eb, #7c3aed);
            border-radius: 10px;
            transition: width 0.5s ease;
        }

        .slide-counter {
            font-size: 0.85rem;
            color: #64748b;
            font-weight: 600;
        }

        .slide-content {
            min-height: 400px;
            padding: 0.5rem 0;
        }

        .slide-tag {
            display: inline-block;
            background: #e2e8f0;
            color: #475569;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 0.2rem 1rem;
            border-radius: 40px;
            margin-bottom: 1rem;
        }

        .slide-title {
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 0.75rem;
            color: #0f172a;
        }

        .slide-title i {
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-right: 0.6rem;

        .slide-desc {
            font-size: 1.05rem;
            color: #334155;
            line-height: 1.7;
            margin-bottom: 1rem;

            width: 20px;
        }

            display: flex;

            align-items: center;
            margin-top: 2rem;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .nav-btn {
            background: transparent;
            border: 2px solid #e2e8f0;
            color: #475569;
            padding: 0.5rem 1.5rem;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .nav-btn:hover { border-color: #2563eb; color: #0f172a; background: #f8fafc; }
        .nav-btn.primary {
            background: #2563eb;
            border-color: #2563eb;
            color: #ffffff;
        }
        .nav-btn.primary:hover { background: #1d4ed8; border-color: #1d4ed8; }
        .nav-btn:disabled {
            opacity: 0.3;
            pointer-events: none;
        }

        .dot-indicators {
            display: flex;
            gap: 0.5rem;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #e2e8f0;
            cursor: pointer;
            transition: 0.3s;
        }

        .dot.active {
            background: #2563eb;
            width: 28px;
            border-radius: 20px;
        }

        .code-block {
            background: #1e293b;
            border-radius: 0.8rem;
            padding: 1rem 1.2rem;
            font-family: 'Courier New', monospace;
            font-size: 0.8rem;
            color: #e2e8f0;
            overflow-x: auto;
            margin: 0.75rem 0 0.5rem;
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.6;

        .code-block .k { color: #c084fc; }
        .code-block .s { color: #facc15; }
        .code-block .f { color: #60a5fa; }
        .code-block .n { color: #f472b6; }
        .code-block .v { color: #34d399; }
        .code-block .b { color: #a78bfa; }
        .code-block .o { color: #fbbf24; }
        .code-block .t { color: #f87171; }

            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin: 0.5rem 0;
        }

        .comparison-box {
            background: #f8fafc;
            border-radius: 1rem;
            padding: 1.2rem;
            border: 1px solid #e2e8f0;
        }

        .comparison-box h4 {
            color: #0f172a;
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .comparison-box h4 i {
            color: #2563eb;
            margin-right: 0.5rem;
        }

            background: white;
            padding: 0.8rem;
            border-radius: 0.5rem;
            border: 1px solid #e2e8f0;
            margin: 0.5rem 0;

            color: #64748b;
            margin-top: 0.3rem;

            color: #e2e8f0;
            padding: 0.5rem 0.8rem;
            border-radius: 0.5rem;
            font-family: 'Courier New', monospace;
            font-size: 0.8rem;
            margin: 0.3rem 0;
        }

        .comparison-box .what-it-does {
            background: #f1f5f9;
            padding: 0.5rem 0.8rem;
            border-radius: 0.5rem;
            font-size: 0.85rem;
            margin: 0.3rem 0;
            border-left: 3px solid #2563eb;
        }

        .two-columns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.2rem;
            margin: 0.5rem 0;
        }

        .three-columns {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 1.2rem;
            margin: 0.5rem 0;
        }

        .info-box {
            background: #f4f7fd;
            border-left: 4px solid #2563eb;
            padding: 1rem;
            margin: 0.5rem 0;
            border-radius: 0.8rem;
        }

        .info-box i {
            color: #2563eb;
        }

        .highlight-box {
            background: #fef9e7;
            border-left: 4px solid #f59e0b;
            padding: 1rem;
            margin: 0.5rem 0;
            border-radius: 0.8rem;
        }

        .highlight-box i {
            color: #f59e0b;
        }

            padding: 1rem;
            border-radius: 1rem;
            border: 1px solid #e2e8f0;
            margin: 0.5rem 0;
        }

            background: #2563eb;
            color: white;
            border: none;
            padding: 0.4rem 1.2rem;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 500;
            margin: 0.2rem;

            border: 1px solid #cbd5e1;
            width: 200px;
        }

            overflow-x: auto;
            margin: 0.5rem 0;
        }

            width: 100%;
            border-collapse: collapse;
            background: #fefaf5;
            border-radius: 1rem;

            text-align: left;
            border-bottom: 1px solid #ece3d7;
            font-size: 0.85rem;
        }

        .comparison-table th {
            background: #f0f7fe;
            color: #1e3a8a;
        }

        .keyword-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 0.5rem;
            margin: 0.5rem 0;
        }

            background: #f1f5f9;
            padding: 0.3rem 0.6rem;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 0.8rem;
            text-align: center;
            border: 1px solid #e2e8f0;
        }

        .quiz-question {
            background: #fef9f2;
            padding: 0.8rem;
            margin: 0.5rem 0;
            border-radius: 1rem;
            border: 1px solid #fce4c1;
        }

        .quiz-question label {
            display: block;
            margin: 0.2rem 0;
        }

        .exercise-box {
            background: #f0f7fe;
            border-radius: 1rem;
            padding: 1rem;
            margin: 0.5rem 0;
            border: 1px solid #dce3ef;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .output-demo {
            background: #f1f5f9;
            padding: 0.6rem 1rem;
            border-radius: 0.8rem;
            margin: 0.5rem 0;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
        }

        .light-bulb-demo {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            flex-wrap: wrap;
        }

        .light-bulb-demo img {
            width: 80px;
            border-radius: 8px;
            background: #f1f5f9;
            padding: 0.5rem;
        }

        .light-bulb-demo .bulb-buttons {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .badge {
            display: inline-block;
            background: #2563eb20;
            color: #2563eb;
            padding: 0.1rem 0.8rem;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            margin-right: 0.3rem;
        }

        .badge-warning {
            background: #f59e0b20;
            color: #b45309;
        }

        .badge-success {
            background: #10b98120;
            color: #065f46;
        }

        .answer-key {
            background: #f0f7ff;
            padding: 1rem;
            border-radius: 1rem;
            display: none;
            margin-top: 0.5rem;
        }

        .slide-footer {
            text-align: center;
            padding-top: 1rem;
            border-top: 1px solid #ece3d7;
            margin-top: 1rem;
            color: #7a6b5a;
            font-size: 0.8rem;
        }

        .demo-box {
            background: #ffffff;
            border: 2px dashed #2563eb;
            border-radius: 1rem;
            padding: 1rem;
            margin: 0.5rem 0;
            min-height: 80px;
        }

        .demo-box .label {
            font-size: 0.7rem;
            color: #64748b;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .multi-action-demo {
            background: #f0f7fe;
            border-radius: 1rem;
            padding: 1rem;
            margin: 0.5rem 0;
            border: 1px solid #dce3ef;
        }

        .multi-action-demo .action-result {
            font-size: 1.1rem;
            font-weight: 600;
            padding: 0.5rem;
            min-height: 40px;
        }

        @media (max-width: 768px) {
            .slide-deck { padding: 1.2rem; }
            .slide-title { font-size: 1.6rem; }
            .two-columns { grid-template-columns: 1fr; }
            .three-columns { grid-template-columns: 1fr; }
            .comparison-grid { grid-template-columns: 1fr; }
            .slide-desc { font-size: 0.95rem; }
        }

        @media (max-width: 450px) {
            .slide-deck { padding: 0.8rem; }
            .slide-title { font-size: 1.3rem; }
            .nav-btn { padding: 0.4rem 1rem; font-size: 0.75rem; }
        }
    </style>
</head>

        function renderSlide(index) {
            var slide = slides[index];
            var contentDiv = document.getElementById('slideContent');
            var progressFill = document.getElementById('progressFill');
            var counterSpan = document.getElementById('slideCounter');

            var html = '';

            // Tag
            html += '<div class="slide-tag">' + slide.tag + '</div>';

            // Title with icon
            var title = slide.title;
            if (slide.icon) {
                title = '<i class="fab ' + slide.icon + '"></i> ' + slide.title;
            }
            html += '<div class="slide-title">' + title + '</div>';

            // Description
            html += '<div class="slide-desc">' + slide.desc + '</div>';

            // Features list
            if (slide.features) {
                html += '<ul class="feature-list">';
                for (var f = 0; f < slide.features.length; f++) {
                    html += '<li><i class="fas fa-check-circle"></i> ' + slide.features[f] + '</li>';

                html += '</ul>';
            }

            // Extra text

                html += '<div class="info-box"><i class="fas fa-info-circle"></i> ' + slide.extra + '</div>';
            }

            // Info box

            if (currentIndex < totalSlides - 1) {

            var display = document.getElementById('counterDisplay');
            if (display) display.innerText = counter;
            console.log('🔄 Counter reset');
        };

        // Data Types
        window.showDataTypes = function() {
            var output = document.getElementById('dataTypeOutput');
            var data = [
                { name: 'name', value: 'Alice', type: typeof 'Alice' },
                { name: 'age', value: 25, type: typeof 25 },
                { name: 'isStudent', value: true, type: typeof true },
                { name: 'favoriteColor', value: undefined, type: typeof undefined },
                { name: 'car', value: null, type: typeof null }
            ];
            var html = '';
            for (var i = 0; i < data.length; i++) {
                html += data[i].name + ': "' + data[i].value + '" → ' + data[i].type + '<br>';
            }
            if (output) output.innerHTML = html;
            console.log('📊 Data types shown');
        };

        // Multi-Action Demo
        window.multiActionDemo = function() {
            var demo1 = document.getElementById('demo1');
            var demo2 = document.getElementById('demo2');
            var demo3 = document.getElementById('demo3');
            var result = document.getElementById('multiActionResult');
            var lab1 = document.getElementById('lab4demo1');
            var lab2 = document.getElementById('lab4demo2');
            var lab3 = document.getElementById('lab4demo3');

            if (demo1) demo1.innerHTML = 'Step 1: Hello!';
            if (demo2) demo2.innerHTML = 'Step 2: World!';
            if (demo3) demo3.innerHTML = 'Step 3: Done!';
            if (result) result.innerHTML = '✅ All 3 actions completed in sequence!';
            if (lab1) lab1.innerHTML = 'Action 1: Started';
            if (lab2) lab2.innerHTML = 'Action 2: Processing';
            if (lab3) lab3.innerHTML = 'Action 3: Complete!';

            console.log('⚡ Multi-action executed: Step 1, Step 2, Step 3');
        };

        window.resetMultiAction = function() {
            var demo1 = document.getElementById('demo1');
            var demo2 = document.getElementById('demo2');
            var demo3 = document.getElementById('demo3');
            var result = document.getElementById('multiActionResult');
            var lab1 = document.getElementById('lab4demo1');
            var lab2 = document.getElementById('lab4demo2');
            var lab3 = document.getElementById('lab4demo3');

            if (demo1) demo1.innerHTML = 'Waiting...';
            if (demo2) demo2.innerHTML = 'Waiting...';
            if (demo3) demo3.innerHTML = 'Waiting...';
            if (result) result.innerHTML = 'Click the button to see multiple actions in sequence.';
            if (lab1) lab1.innerHTML = 'Waiting...';
            if (lab2) lab2.innerHTML = 'Waiting...';
            if (lab3) lab3.innerHTML = 'Waiting...';

            console.log('🔄 Multi-action reset');
        };

        // innerHTML vs innerText Demo Functions
        window.updateDemos = function() {
            var input = document.getElementById('htmlInput');
            var val = input ? input.value : 'Hello <b>World</b>';
            var innerHTMLdemo = document.getElementById('demoInnerHTML');
            var innerTextdemo = document.getElementById('demoInnerText');
            if (innerHTMLdemo) innerHTMLdemo.innerHTML = val;
            if (innerTextdemo) innerTextdemo.innerText = val;
            console.log('🔄 Updated both demos with: ' + val);
        };

        window.updateInnerHTML = function() {
            var input = document.getElementById('htmlInput');
            var val = input ? input.value : 'Hello <b>World</b>';
            var demo = document.getElementById('demoInnerHTML');
            if (demo) demo.innerHTML = val;
            console.log('📝 innerHTML updated with: ' + val);
        };

        window.updateInnerText = function() {
            var input = document.getElementById('htmlInput');
            var val = input ? input.value : 'Hello <b>World</b>';
            var demo = document.getElementById('demoInnerText');
            if (demo) demo.innerText = val;
            console.log('📝 innerText updated with: ' + val);
        };

        // Reveal Answer Key
        document.addEventListener('click', function(e) {
            if (e.target && e.target.id === 'revealAnswersBtn') {
                var key = document.getElementById('answerKey');
                var btn = document.getElementById('revealAnswersBtn');
                if (key) {
                    if (key.style.display === 'none' || key.style.display === '') {
                        key.style.display = 'block';
                        if (btn) btn.innerHTML = '<i class="fas fa-eye-slash"></i> Hide Answer Key';
                    } else {
                        key.style.display = 'none';
                        if (btn) btn.innerHTML = '<i class="fas fa-key"></i> Reveal Answer Key';
                    }
                }
            }
        });

        // Initialize
        initDots();
        renderSlide(0);

        // Mark completion
        (function() {
            try {
                var completed = JSON.parse(localStorage.getItem('jsCourseCompleted') || '{}');
                if (!completed[0]) completed[0] = {};
                completed[0][0] = true;
                localStorage.setItem('jsCourseCompleted', JSON.stringify(completed));
                console.log('✅ Day 1 marked complete');
            } catch (e) {
                console.warn('⚠️ localStorage not available');
            }
        })();

        console.log('👋 Welcome to JavaScript Bootcamp — Day 1!');
        console.log('📚 Use arrow keys or click Next/Back to navigate.');
        console.log('💡 New: Multi-Action Syntax slide added!');
    </script>
</body>

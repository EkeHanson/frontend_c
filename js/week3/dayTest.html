<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📦 Array Methods · Test</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #f1ede8;
      color: #1a1612;
      min-height: 100vh;
      padding: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .test-card {
      max-width: 1000px;
      width: 100%;
      background: #ffffff;
      border-radius: 2rem;
      padding: 2rem 2.5rem;
      box-shadow: 0 20px 60px rgba(0,0,0,0.08), 0 0 0 1px rgba(0,0,0,0.03);
    }
    .test-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .test-header h1 {
      font-size: 2rem;
      font-weight: 800;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .test-header h1 i {
      color: #2563eb;
      background: none;
      -webkit-background-clip: unset;
      background-clip: unset;
    }
    .score-box {
      background: #f0ece7;
      padding: 0.4rem 1.2rem;
      border-radius: 40px;
      font-weight: 700;
      font-size: 1rem;
      color: #1e293b;
      border: 1px solid #ddd4ca;
    }
    .score-box i { color: #2563eb; margin-right: 0.4rem; }
    .question-list {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      margin: 1.5rem 0 2rem;
    }
    .question-item {
      background: #fcf9f5;
      border-radius: 1.2rem;
      padding: 1.2rem 1.5rem;
      border: 1px solid #e8e1d9;
      transition: 0.2s;
    }
    .question-item:hover { border-color: #c7bdb2; }
    .q-header {
      display: flex;
      align-items: baseline;
      gap: 0.6rem;
      flex-wrap: wrap;
      margin-bottom: 0.6rem;
    }
    .q-number {
      font-weight: 700;
      color: #2563eb;
      background: #e0edff;
      padding: 0.1rem 0.7rem;
      border-radius: 30px;
      font-size: 0.75rem;
    }
    .q-text {
      font-weight: 600;
      font-size: 1.05rem;
      color: #0f172a;
    }
    .q-code {
      background: #1a2332;
      border-radius: 0.8rem;
      padding: 0.6rem 1rem;
      font-family: 'Courier New', monospace;
      font-size: 0.78rem;
      color: #e2e8f0;
      margin: 0.4rem 0 0.6rem;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.7;
      border: 1px solid #2d3748;
    }
    .q-code .comment { color: #94a3b8; }
    .q-code .keyword { color: #c084fc; }
    .q-code .string { color: #facc15; }
    .q-code .function { color: #60a5fa; }
    .q-code .number { color: #f472b6; }
    .q-code .boolean { color: #a78bfa; }
    .options {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 0.5rem;
      margin: 0.5rem 0 0.2rem;
    }
    .options label {
      background: #ffffff;
      padding: 0.4rem 0.8rem;
      border-radius: 50px;
      border: 1px solid #ddd4ca;
      font-size: 0.9rem;
      cursor: pointer;
      transition: 0.15s;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .options label:hover { background: #edf2ff; border-color: #2563eb; }
    .options input[type="radio"] { accent-color: #2563eb; width: 16px; height: 16px; }
    .feedback {
      margin-top: 0.6rem;
      font-size: 0.9rem;
      font-weight: 500;
      padding: 0.3rem 0.8rem;
      border-radius: 40px;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
    }
    .feedback.correct { background: #dcfce7; border-color: #86efac; color: #166534; }
    .feedback.wrong { background: #fee2e2; border-color: #fca5a5; color: #991b1b; }
    .feedback i { font-size: 0.9rem; }
    .q-actions {
      display: flex;
      gap: 0.6rem;
      margin-top: 0.5rem;
      flex-wrap: wrap;
      align-items: center;
    }
    .btn-sm {
      background: transparent;
      border: 1.5px solid #d4cdc4;
      padding: 0.2rem 1rem;
      border-radius: 40px;
      font-weight: 600;
      font-size: 0.75rem;
      cursor: pointer;
      transition: 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      color: #1e293b;
    }
    .btn-sm:hover { background: #f0ece7; border-color: #a89f94; }
    .btn-sm.primary { background: #2563eb; border-color: #2563eb; color: #fff; }
    .btn-sm.primary:hover { background: #1d4ed8; border-color: #1d4ed8; }
    .btn-sm.success { background: #16a34a; border-color: #16a34a; color: #fff; }
    .btn-sm.success:hover { background: #15803d; border-color: #15803d; }
    .btn-sm.outline { background: transparent; border-color: #d4cdc4; }
    .btn-sm.outline:hover { background: #f0ece7; }
    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-top: 0.8rem;
    }
    .btn {
      background: transparent;
      border: 2px solid #e2d9d0;
      padding: 0.5rem 1.6rem;
      border-radius: 60px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: #1e293b;
    }
    .btn:hover { border-color: #2563eb; background: #f8f5f1; }
    .btn-primary { background: #2563eb; border-color: #2563eb; color: #fff; }
    .btn-primary:hover { background: #1d4ed8; border-color: #1d4ed8; }
    .btn-success { background: #16a34a; border-color: #16a34a; color: #fff; }
    .btn-success:hover { background: #15803d; border-color: #15803d; }
    .btn-outline { background: transparent; border-color: #d4cdc4; }
    .btn-outline:hover { background: #f0ece7; }
    .result-summary {
      background: #f0f7ff;
      padding: 0.8rem 1.5rem;
      border-radius: 1.5rem;
      border-left: 5px solid #2563eb;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .result-summary i { color: #2563eb; font-size: 1.2rem; }
    .footer-note {
      text-align: center;
      margin-top: 2rem;
      color: #7a6b5a;
      font-size: 0.8rem;
      border-top: 1px solid #e6dfd7;
      padding-top: 1.2rem;
    }
    @media (max-width: 640px) {
      .test-card { padding: 1.2rem; }
      .options { grid-template-columns: 1fr; }
      .test-header h1 { font-size: 1.5rem; }
      .q-text { font-size: 0.95rem; }
    }
  </style>
</head>
<body>
<div class="test-card">
  <div class="test-header">
    <h1><i class="fas fa-pencil-alt"></i> Array Methods · Test</h1>
    <div class="score-box"><i class="fas fa-star"></i> <span id="scoreDisplay">0 / 0</span></div>
  </div>

  <div id="questionContainer" class="question-list">
    <!-- dynamically rendered -->
  </div>

  <div class="actions">
    <button class="btn btn-outline" id="resetTestBtn"><i class="fas fa-undo-alt"></i> Reset</button>
    <button class="btn btn-primary" id="checkAllBtn"><i class="fas fa-check-double"></i> Check All</button>
    <button class="btn btn-success" id="showAnswersBtn"><i class="fas fa-key"></i> Show Answers</button>
  </div>

  <div id="summaryBox" class="result-summary" style="margin-top: 1.5rem; display: none;">
    <i class="fas fa-chart-simple"></i>
    <span id="summaryText">You answered 0 / 0 correctly.</span>
  </div>

  <div class="footer-note"><i class="fas fa-code"></i> JavaScript Array Methods · forEach, map, filter, reduce, sort</div>
</div>

<script>
  // ================================================================
  //  TEST DATA – 12 questions covering forEach, map, filter, reduce, sort
  // ================================================================
  const questions = [
    {
      id: 1,
      text: 'Which method executes a function once for each element, but does NOT return a new array?',
      options: ['forEach()', 'map()', 'filter()', 'reduce()'],
      correct: 0,
      hint: 'It\'s used for side effects like logging or updating the DOM.'
    },
    {
      id: 2,
      text: 'Which method creates a new array by applying a function to every element?',
      options: ['forEach()', 'map()', 'filter()', 'sort()'],
      correct: 1,
      hint: 'It transforms each item and returns a new array of the same length.'
    },
    {
      id: 3,
      text: 'Which method returns a new array containing only elements that pass a test?',
      options: ['map()', 'filter()', 'reduce()', 'forEach()'],
      correct: 1,
      hint: 'Think of a sieve — only items that return true are kept.'
    },
    {
      id: 4,
      text: 'Which method reduces an array to a single value (e.g., sum, average, grouping)?',
      options: ['forEach()', 'map()', 'filter()', 'reduce()'],
      correct: 3,
      hint: 'It accumulates values using an accumulator and current value.'
    },
    {
      id: 5,
      text: 'Which method sorts the array in place and modifies the original?',
      options: ['sort()', 'map()', 'filter()', 'reduce()'],
      correct: 0,
      hint: 'It rearranges the elements directly in the array.'
    },
    {
      id: 6,
      text: 'What will the following code output?',
      options: ['[1, 2, 3]', '[2, 4, 6]', 'undefined', 'Error'],
      correct: 1,
      hint: 'map() transforms every element.',
      code: `const nums = [1, 2, 3];\nconst doubled = nums.map(n => n * 2);\nconsole.log(doubled);`
    },
    {
      id: 7,
      text: 'What will the following code output?',
      options: ['[15, 22, 18, 30, 12]', '[22, 18, 30]', '[15, 12]', '[]'],
      correct: 1,
      hint: 'Only elements that pass the condition are kept.',
      code: `const ages = [15, 22, 18, 30, 12];\nconst adults = ages.filter(a => a >= 18);\nconsole.log(adults);`
    },
    {
      id: 8,
      text: 'What does the following code return?',
      options: ['0', '10', '30', '60'],
      correct: 3,
      hint: 'reduce() accumulates values starting from the initial value (0).',
      code: `const numbers = [10, 20, 30];\nconst total = numbers.reduce((acc, curr) => acc + curr, 0);\nconsole.log(total);`
    },
    {
      id: 9,
      text: 'Which method is best for extracting a property from an array of objects?',
      options: ['forEach()', 'map()', 'filter()', 'reduce()'],
      correct: 1,
      hint: 'You want a new array with just the property values, same length.'
    },
    {
      id: 10,
      text: 'Which method would you use to find all products with a price greater than $100?',
      options: ['map()', 'filter()', 'reduce()', 'forEach()'],
      correct: 1,
      hint: 'You need to select a subset based on a condition.'
    },
    {
      id: 11,
      text: 'Which method modifies the original array and returns a reference to it?',
      options: ['map()', 'filter()', 'sort()', 'reduce()'],
      correct: 2,
      hint: 'It changes the array in place.'
    },
    {
      id: 12,
      text: 'Which method would you use to count the occurrences of each item in an array?',
      options: ['forEach()', 'map()', 'filter()', 'reduce()'],
      correct: 3,
      hint: 'You can use reduce to build an object with counts.'
    }
  ];

  // ================================================================
  //  STATE & RENDER
  // ================================================================
  let userAnswers = new Array(questions.length).fill(null);
  let revealed = new Array(questions.length).fill(false);

  function renderQuestions() {
    const container = document.getElementById('questionContainer');
    let html = '';
    questions.forEach((q, idx) => {
      const selected = userAnswers[idx] !== null ? userAnswers[idx] : -1;
      const isRevealed = revealed[idx];
      const correct = q.correct;
      const isCorrect = selected === correct;

      // build feedback
      let feedbackHtml = '';
      if (selected !== null && isRevealed) {
        const icon = isCorrect ? '<i class="fas fa-check-circle"></i>' : '<i class="fas fa-times-circle"></i>';
        const cls = isCorrect ? 'correct' : 'wrong';
        const msg = isCorrect ? ' Correct!' : ' Incorrect.';
        const correctAnswer = !isCorrect ? ` Correct answer: ${q.options[correct]}` : '';
        feedbackHtml = `<div class="feedback ${cls}">${icon} ${msg} ${correctAnswer}</div>`;
      } else if (selected !== null && !isRevealed) {
        feedbackHtml = `<div class="feedback" style="background:#f1f5f9; border-color:#cbd5e1; color:#475569;"><i class="fas fa-hourglass-half"></i> Click "Check" to verify.</div>`;
      } else {
        feedbackHtml = `<div class="feedback" style="background:transparent; border-color:transparent; color:#94a3b8; padding-left:0;"><i class="fas fa-circle-info"></i> Select an answer, then check.</div>`;
      }

      // build options
      let optionsHtml = '';
      q.options.forEach((opt, optIdx) => {
        const checked = selected === optIdx ? 'checked' : '';
        optionsHtml += `
          <label>
            <input type="radio" name="q${idx}" value="${optIdx}" ${checked} data-q="${idx}" />
            ${opt}
          </label>
        `;
      });

      // code snippet
      let codeHtml = '';
      if (q.code) {
        // simple highlighting by replacing keywords with spans
        let codeLines = q.code.split('\n').map(line => {
          line = line.replace(/const/g, '<span class="keyword">const</span>');
          line = line.replace(/console/g, '<span class="function">console</span>');
          line = line.replace(/log/g, '<span class="function">log</span>');
          line = line.replace(/map/g, '<span class="function">map</span>');
          line = line.replace(/filter/g, '<span class="function">filter</span>');
          line = line.replace(/reduce/g, '<span class="function">reduce</span>');
          line = line.replace(/\[\d+, \d+, \d+\]/g, match => `<span class="number">${match}</span>`);
          line = line.replace(/\b\d+\b/g, match => `<span class="number">${match}</span>`);
          return line;
        });
        codeHtml = `<div class="q-code">${codeLines.join('\n')}</div>`;
      }

      html += `
        <div class="question-item" data-qidx="${idx}">
          <div class="q-header">
            <span class="q-number">Q${idx+1}</span>
            <span class="q-text">${q.text}</span>
          </div>
          ${codeHtml}
          <div class="options">${optionsHtml}</div>
          <div class="q-actions">
            <button class="btn-sm primary check-single" data-q="${idx}"><i class="fas fa-check"></i> Check</button>
            <button class="btn-sm outline reset-single" data-q="${idx}"><i class="fas fa-undo"></i> Reset</button>
            ${feedbackHtml}
          </div>
        </div>
      `;
    });
    container.innerHTML = html;

    // Attach change listeners to radio buttons
    document.querySelectorAll('input[type="radio"]').forEach(radio => {
      radio.addEventListener('change', function(e) {
        const qIdx = parseInt(this.dataset.q);
        const val = parseInt(this.value);
        userAnswers[qIdx] = val;
        // hide reveal for this question when user changes answer
        revealed[qIdx] = false;
        renderQuestions();
        updateScore();
      });
    });

    // Attach click listeners for "Check" buttons
    document.querySelectorAll('.check-single').forEach(btn => {
      btn.addEventListener('click', function(e) {
        const qIdx = parseInt(this.dataset.q);
        if (userAnswers[qIdx] === null) {
          alert('Please select an answer first.');
          return;
        }
        revealed[qIdx] = true;
        renderQuestions();
        updateScore();
      });
    });

    // Attach click listeners for "Reset" buttons (per question)
    document.querySelectorAll('.reset-single').forEach(btn => {
      btn.addEventListener('click', function(e) {
        const qIdx = parseInt(this.dataset.q);
        userAnswers[qIdx] = null;
        revealed[qIdx] = false;
        renderQuestions();
        updateScore();
      });
    });

    updateScore();
  }

  function updateScore() {
    let correctCount = 0;
    let answeredCount = 0;
    questions.forEach((q, idx) => {
      if (userAnswers[idx] !== null) {
        answeredCount++;
        if (userAnswers[idx] === q.correct) correctCount++;
      }
    });
    document.getElementById('scoreDisplay').textContent = `${correctCount} / ${questions.length}`;
    const summaryBox = document.getElementById('summaryBox');
    const summaryText = document.getElementById('summaryText');
    if (answeredCount === questions.length) {
      summaryBox.style.display = 'flex';
      summaryText.textContent = `🎯 You answered ${correctCount} out of ${questions.length} correctly. ${correctCount === questions.length ? 'Perfect score! 🎉' : 'Keep practicing!'}`;
    } else {
      summaryBox.style.display = 'none';
    }
  }

  // ================================================================
  //  BUTTON ACTIONS (global)
  // ================================================================

  // Check All: reveal all answered questions
  document.getElementById('checkAllBtn').addEventListener('click', function() {
    let anyAnswered = false;
    questions.forEach((q, idx) => {
      if (userAnswers[idx] !== null) {
        revealed[idx] = true;
        anyAnswered = true;
      }
    });
    if (!anyAnswered) {
      alert('Please answer at least one question first.');
      return;
    }
    renderQuestions();
    updateScore();
    let correctCount = 0;
    questions.forEach((q, idx) => {
      if (userAnswers[idx] === q.correct) correctCount++;
    });
    const summaryBox = document.getElementById('summaryBox');
    const summaryText = document.getElementById('summaryText');
    summaryBox.style.display = 'flex';
    summaryText.textContent = `✅ Checked! You got ${correctCount} out of ${questions.length} correct.`;
  });

  // Show Answers: reveal all answers
  document.getElementById('showAnswersBtn').addEventListener('click', function() {
    questions.forEach((q, idx) => {
      userAnswers[idx] = q.correct;
      revealed[idx] = true;
    });
    renderQuestions();
    updateScore();
    const summaryBox = document.getElementById('summaryBox');
    const summaryText = document.getElementById('summaryText');
    summaryBox.style.display = 'flex';
    summaryText.textContent = `🔑 Answers revealed. Score: ${questions.length} / ${questions.length}`;
  });

  // Reset all
  document.getElementById('resetTestBtn').addEventListener('click', function() {
    userAnswers = new Array(questions.length).fill(null);
    revealed = new Array(questions.length).fill(false);
    renderQuestions();
    updateScore();
    const summaryBox = document.getElementById('summaryBox');
    summaryBox.style.display = 'none';
  });

  // ================================================================
  //  INIT
  // ================================================================
  renderQuestions();
</script>
</body>
</html>

    <script>
        // ============================================================
        // ALL SLIDE DATA — Complete async tutorial
        // ============================================================
        var slides = [
            // Slide 0: Introduction
            {
                tag: 'Async JavaScript',
                title: 'Asynchronous JavaScript',
                desc: 'JavaScript normally runs one statement at a time. Async programming lets JavaScript start long-running tasks and continue running other code while waiting for the result.',
                icon: 'fa-clock',
                features: [
                    'Async Programming — What it is and why it matters',
                    'Callbacks — The first solution for async code',
                    'Promises — Cleaner way to handle async operations',
                    'Async/Await — Write async code like synchronous code',
                    'Parallel Tasks — Run independent operations together',
                    'Event Loop — How async works behind the scenes',
                    'Fetch API — Get data from servers',
                    'Common Mistakes — And how to avoid them',
                    'Debugging Async Code — Tools and techniques'
                ]
            },
            // Slide 1: What is Async
            {
                tag: 'Async Programming',
                title: 'What Does "Async" Mean?',
                desc: 'The word async means not at the same time. JavaScript can continue running other code while waiting for an operation to complete.',
                icon: 'fa-clock',
                features: [
                    'JavaScript executes code one line at a time (synchronous by default)',
                    'Each statement must finish before the next can begin',
                    'Long-running tasks can block the page and make it feel frozen',
                    'Async programming solves this by running tasks in the background',
                    'When the task finishes, JavaScript handles the result'
                ],
                code: '// SYNCHRONOUS — blocks until done\nconsole.log("Start");\nlet result = longRunningTask(); // Freezes here\nconsole.log(result);\nconsole.log("End");\n\n// ASYNCHRONOUS — doesn\'t block\nconsole.log("Start");\nlongRunningTask(function(result) {\n  console.log(result);\n});\nconsole.log("JavaScript continues...");'
            },
            // Slide 2: Sync vs Async Demo
            {
                tag: 'Live Demo',
                title: 'Sync vs Async — See the Difference',
                desc: 'Click the buttons below to experience blocking vs non-blocking code.',
                icon: 'fa-play-circle',
                demo_sync_async: true
            },
            // Slide 3: Callbacks
            {
                tag: 'Async Callbacks',
                title: 'Callbacks — The First Solution',
                desc: 'A callback is a function passed as an argument to another function. In async JavaScript, callbacks handle results that arrive later.',
                icon: 'fa-phone',
                features: [
                    'A callback is just a function passed to another function',
                    'The callback itself is not asynchronous',
                    'Async APIs like setTimeout(), fetch(), and events use callbacks',
                    'Callback hell: deeply nested callbacks that are hard to read'
                ],
                code: '// Callback example: Ordering food\nfunction orderPizza(name, callback) {\n  console.log("Order received: " + name);\n  setTimeout(function() {\n    callback("🍕 " + name + " is ready!");\n  }, 2000);\n}\n\nfunction servePizza(message) {\n  console.log(message);\n}\n\norderPizza("Pepperoni", servePizza);\nconsole.log("📱 Scrolling Instagram...");',
                demo_callback: true
            },
            // Slide 4: Promises
            {
                tag: 'Async Promises',
                title: 'Promises — The Modern Way',
                desc: 'A Promise represents the future result of an asynchronous operation. It acts as a placeholder for a value that is not available yet.',
                icon: 'fa-handshake',
                features: [
                    'A Promise is always in one of three states: pending, fulfilled, or rejected',
                    'then() registers a handler for fulfillment',
                    'catch() registers a handler for rejection',
                    'finally() runs when the Promise settles',
                    'Promise chaining: then() returns a new Promise'
                ],
                code: '// Creating a Promise\nconst pizzaPromise = new Promise(function(resolve, reject) {\n  const success = true;\n  if (success) {\n    resolve("🍕 Pizza is ready!");\n  } else {\n    reject("❌ Pizza delivery failed!");\n  }\n});\n\npizzaPromise\n  .then(function(value) { console.log(value); })\n  .catch(function(error) { console.log(error); });',
                demo_promise: true
            },
            // Slide 5: Async/Await
            {
                tag: 'Async Await',
                title: 'Async and Await — Clean and Modern',
                desc: 'The async and await keywords make Promise-based code easier to read. Async code looks much like ordinary synchronous code.',
                icon: 'fa-magic',
                features: [
                    'async makes a function return a Promise',
                    'await pauses only the current async function, not all of JavaScript',
                    'Use try...catch to handle errors with async/await',
                    'Async/await is built on top of Promises'
                ],
                code: '// Async function\nasync function makePizza() {\n  console.log("1. Start making pizza");\n  let dough = await prepareDough();\n  console.log("2. Dough ready");\n  let toppings = await addToppings();\n  console.log("3. Toppings added");\n  let pizza = await bakePizza();\n  console.log("4. 🍕 Pizza is ready!");\n  return pizza;\n}',
                demo_async_await: true
            },
            // Slide 6: Parallel Tasks
            {
                tag: 'Async Parallel',
                title: 'Running Tasks in Parallel',
                desc: 'If several asynchronous operations do not depend on each other, waiting for them one by one may be slower than necessary.',
                icon: 'fa-bolt',
                features: [
                    'Use multiple await statements when operations depend on each other',
                    'Use Promise.all() when operations are independent',
                    'Promise.allSettled() waits for all Promises to settle',
                    'Promise.any() returns the first fulfilled Promise',
                    'Promise.race() returns the first settled Promise'
                ],
                code: '// Sequential (slower)\nlet a = await fetch("file1.txt");\nlet b = await fetch("file2.txt");\nlet c = await fetch("file3.txt");\n\n// Parallel (faster)\nlet [a, b, c] = await Promise.all([\n  fetch("file1.txt"),\n  fetch("file2.txt"),\n  fetch("file3.txt")\n]);',
                demo_parallel: true
            },
            // Slide 7: Event Loop
            {
                tag: 'Event Loop',
                title: 'The Event Loop — How Async Works',
                desc: 'JavaScript can only execute one piece of code at a time. The Event Loop coordinates asynchronous operations and decides when to execute the next task.',
                icon: 'fa-circle-notch',
                features: [
                    'JavaScript executes one task at a time',
                    'The browser performs async work (timers, downloads, events)',
                    'Completed operations wait in queues',
                    'The Event Loop starts waiting tasks when the current task finishes',
                    'Microtask Queue (Promises) has higher priority than Task Queue (timers)'
                ],
                code: 'console.log("A");\n\nsetTimeout(function() { console.log("B"); }, 0);\n\nPromise.resolve().then(function() { console.log("C"); });\n\nconsole.log("D");\n\n// Output: A, D, C, B',
                demo_event_loop: true
            },
            // Slide 8: Fetch API
            {
                tag: 'Fetch API',
                title: 'Fetch API — Getting Data',
                desc: 'Fetch lets JavaScript download resources from a web server. It is asynchronous and returns a Promise.',
                icon: 'fa-download',
                features: [
                    'fetch() returns a Promise that resolves to a Response object',
                    'Use text() to read text responses',
                    'Use json() to read JSON responses',
                    'Check response.ok to detect HTTP errors',
                    'Use try...catch to handle errors'
                ],
                code: '// Fetching user data from a real API\nasync function getUser() {\n  try {\n    const response = await fetch("https://jsonplaceholder.typicode.com/users/1");\n    if (!response.ok) {\n      throw new Error("HTTP " + response.status);\n    }\n    const user = await response.json();\n    console.log("👤 User:", user.name);\n  } catch(err) {\n    console.log("❌ Error:", err.message);\n  }\n}',
                demo_fetch: true
            },
            // Slide 9: Common Mistakes
            {
                tag: 'Common Mistakes',
                title: 'Common Async Mistakes',
                desc: 'Many beginner mistakes happen because asynchronous code does not always execute in the order you expect.',
                icon: 'fa-exclamation-triangle',
                features: [
                    'Forgetting await — you get a Promise instead of data',
                    'Using await outside an async function',
                    'Assuming fetch() fails on HTTP errors (it doesn\'t)',
                    'Blocking the Event Loop with long-running code',
                    'Running independent tasks one after another',
                    'Using await inside forEach()'
                ],
                code: '// Mistake 1: Forgetting await\nconst data = fetch("data.txt"); // Wrong\nconst data = await fetch("data.txt"); // Correct\n\n// Mistake 2: Using await outside async\nfunction load() {\n  let data = await fetch("data.txt"); // Wrong\n}\n\n// Mistake 3: Assuming fetch fails on HTTP errors\nconst response = await fetch("missing.txt");\nif (!response.ok) { // Always check!\n  throw new Error("File not found");\n}'
            },
            // Slide 10: Debugging
            {
                tag: 'Debugging Async',
                title: 'Debugging Async Code',
                desc: 'Asynchronous code can be more difficult to debug than synchronous code. Learn practical techniques for finding and fixing common problems.',
                icon: 'fa-bug',
                features: [
                    'Use console.log() to trace execution order',
                    'Use browser dev tools breakpoints in async functions',
                    'Check the Network tab for fetch issues',
                    'Use try...catch to capture errors',
                    'Look for unhandled Promise rejections in the console',
                    'Most fetch bugs are path and response problems'

                code: '// Debugging tips\nconsole.log("Before fetch");\nconst response = await fetch("data.json");\nconsole.log("After fetch", response);\n\n// Check the Network tab in DevTools\n// Look for: status code, response body, headers'
            },
            // Slide 11: AbortController
            {
                tag: 'AbortController',
                title: 'AbortController — Cancel Async Operations',
                desc: 'The AbortController object lets you cancel asynchronous operations, commonly used to cancel fetch() requests.',
                icon: 'fa-stop-circle',
                features: [
                    'Create an AbortController: const controller = new AbortController();',

                    'Call controller.abort() to cancel the request',
                    'Cancel unnecessary operations to improve performance',
                    'Makes applications more responsive'

                code: '// AbortController example\nconst controller = new AbortController();\nconst signal = controller.signal;\n\nfetch("data.json", { signal })\n  .then(response => response.json())\n  .catch(err => {\n    if (err.name === "AbortError") {\n      console.log("Fetch aborted!");\n    }\n  });\n\n// Cancel the request\ncontroller.abort();',
                demo_abort: true

            {
                tag: 'Web Workers',
                title: 'Web Workers — Background Threads',
                desc: 'Web Workers solve the problem of long-running calculations blocking the main thread by running JavaScript in a separate thread.',
                icon: 'fa-cogs',

        // Sync vs Async Demo
        window.syncVsAsyncDemo = function() {
            var output = document.getElementById('syncAsyncOutput');
            if (!output) return;
            output.innerHTML = '⏳ Running synchronous task... (page will freeze)';
            var start = Date.now();
            var i = 0;
            while (i < 1000000000) { i++; }
            var elapsed = ((Date.now() - start) / 1000).toFixed(2);
            output.innerHTML = '✅ Synchronous task completed in ' + elapsed + 's<br>📝 The page was frozen during this task.';
        };

        window.asyncVsAsyncDemo = function() {
            var output = document.getElementById('syncAsyncOutput');
            if (!output) return;
            output.innerHTML = '⏳ Starting asynchronous task... (page stays responsive)';
            setTimeout(function() {
                output.innerHTML = '✅ Asynchronous task completed after 2 seconds!<br>📝 The page was responsive during the wait.';
            }, 2000);
        };

        window.syncAsyncReset = function() {
            var output = document.getElementById('syncAsyncOutput');
            if (output) output.innerHTML = 'Click a button to see the difference between sync and async.';
        };

        // Callback Demo
        window.callbackOrderFood = function() {
            var output = document.getElementById('callbackOutput');
            if (!output) return;
            output.innerHTML = '🍕 Ordering pizza...';
            setTimeout(function() {
                output.innerHTML = '👨‍🍳 Chef is preparing your pizza...';
                setTimeout(function() {
                    output.innerHTML = '🔥 Baking in the oven...';
                    setTimeout(function() {
                        output.innerHTML = '🍕 Pizza is ready! Enjoy your meal! (Callback called)';
                    }, 1500);
                }, 2000);
            }, 1000);
        };

        window.callbackReset = function() {
            var output = document.getElementById('callbackOutput');
            if (output) output.innerHTML = 'Click "Order Pizza" to start the callback demo.';
        };

                html += '<strong>Q2:</strong> B) A function passed as an argument to another function<br>';
                html += '<strong>Q3:</strong> B) The future result of an asynchronous operation<br>';
                html += '<strong>Q4:</strong> B) It pauses only the current async function until a Promise settles<br>';
                html += '<strong>Q5:</strong> B) Use Promise.all()<br>';
                html += '</div>';
            }

            contentDiv.innerHTML = html;

            var progress = ((index + 1) / totalSlides) * 100;
            progressFill.style.width = progress + '%';
            counterSpan.textContent = (index + 1) + ' / ' + totalSlides;

            var dots = document.querySelectorAll('.dot');
            for (var d = 0; d < dots.length; d++) {
                dots[d].className = 'dot' + (d === index ? ' active' : '');
            }

            document.getElementById('prevBtn').disabled = (index === 0);
            document.getElementById('nextBtn').disabled = (index === totalSlides - 1);
            var nextBtn = document.getElementById('nextBtn');
            if (index === totalSlides - 1) {
                nextBtn.innerHTML = 'Done <i class="fas fa-check"></i>';
            } else {
                nextBtn.innerHTML = 'Next <i class="fas fa-arrow-right"></i>';
            }

            currentIndex = index;
        }

        function goToSlide(index) {
            if (index < 0) index = 0;
            if (index >= totalSlides) index = totalSlides - 1;
            renderSlide(index);
        }

        function nextSlide() {
            if (currentIndex < totalSlides - 1) goToSlide(currentIndex + 1);
        }

        function prevSlide() {
            if (currentIndex > 0) goToSlide(currentIndex - 1);
        }

        function initDots() {
            var container = document.getElementById('dotContainer');
            container.innerHTML = '';
            for (var i = 0; i < totalSlides; i++) {
                var dot = document.createElement('span');
                dot.className = 'dot' + (i === 0 ? ' active' : '');
                dot.onclick = (function(idx) { return function() { goToSlide(idx); }; })(i);
                container.appendChild(dot);
            }
        }

        document.getElementById('prevBtn').onclick = prevSlide;
        document.getElementById('nextBtn').onclick = nextSlide;

        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); nextSlide(); }
            if (e.key === 'ArrowLeft') { e.preventDefault(); prevSlide(); }
        });

        document.addEventListener('click', function(e) {
            if (e.target && e.target.id === 'revealAnswersBtn') {
                var key = document.getElementById('answerKey');
                var btn = document.getElementById('revealAnswersBtn');
                if (key) {
                    if (key.style.display === 'none' || key.style.display === '') {
                        key.style.display = 'block';
                        if (btn) btn.innerHTML = '<i class="fas fa-eye-slash"></i> Hide Answer Key';
                    } else {
                        key.style.display = 'none';
                        if (btn) btn.innerHTML = '<i class="fas fa-key"></i> Reveal Answer Key';
                    }
                }
            }
        });

        initDots();
        renderSlide(0);

        console.log('👋 Welcome to Async JavaScript Tutorial!');
        console.log('📚 Covers: callbacks, promises, async/await, parallel, event loop, fetch, mistakes, debugging, abort, workers');
    </script>
</body>
</html>

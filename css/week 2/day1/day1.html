<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>CSS Complete Course | Colors · Backgrounds · Borders · Box Model · Quiz</title>
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Inter', system-ui, sans-serif;
            background: #0a0e1a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .presentation-wrapper {
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
        }

        .slide-container {
            background: #111827;
            border-radius: 2rem;
            border: 1px solid #2d3a5e;
            box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.6);
            overflow: hidden;
        }

        .slide-content {
            padding: 2.5rem 3rem;
            min-height: 600px;
            display: flex;
            flex-direction: column;
        }

        .slide-title {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff, #a5f3fc, #7aa9ff);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 0.6rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            border-left: 5px solid #3b82f6;
            padding-left: 1.2rem;
        }

        .slide-sub {
            color: #9ca3cf;
            margin-bottom: 1.5rem;
            border-left: 5px solid #3b82f6;
            padding-left: 1.2rem;
            font-size: 0.95rem;
        }

        .grid-2, .grid-3 {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            margin: 1rem 0;
        }

        .card {
            background: #1e293b;
            border-radius: 1.2rem;
            padding: 1.3rem;
            flex: 1;
            min-width: 220px;
            border: 1px solid #334155;
            transition: transform 0.2s;
        }

        .card h3 {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            color: #93c5fd;
            margin-bottom: 0.8rem;
            font-size: 1.2rem;
        }

        .card p, .card li {
            color: #e2e8f0;
            line-height: 1.5;
        }

        .code-block {
            background: #0a0f1c;
            padding: 1rem;
            border-radius: 1rem;
            font-family: 'Fira Code', 'Courier New', monospace;
            font-size: 0.8rem;
            overflow-x: auto;
            border-left: 4px solid #3b82f6;
            margin: 1rem 0;
            color: #d1d5db;
        }

        .highlight {
            color: #fbbf24;
            font-weight: 600;
        }

        .insight {
            background: #1e293b;
            padding: 1rem 1.2rem;
            border-radius: 1rem;
            border-left: 4px solid #fbbf24;
            margin: 1rem 0;
            color: #e2e8f0;
        }

        .color-demo {
            display: inline-block;
            padding: 0.3rem 0.8rem;
            border-radius: 0.5rem;
            margin: 0.2rem;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .border-demo {
            display: inline-block;
            padding: 0.4rem 0.8rem;
            margin: 0.3rem;
            background: #1e293b;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #1e293b;
            border-radius: 1rem;
            overflow: hidden;
            margin: 1rem 0;
        }

        th, td {
            border: 1px solid #334155;
            padding: 0.7rem;
            text-align: left;
            color: #e2e8f0;
        }

        th {
            background: #0f172a;
            color: #fbbf24;
        }

        .nav-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            background: #0f172a;
            border-top: 1px solid #2d3a5e;
        }

        .nav-btn {
            background: #2d3a5e;
            border: none;
            padding: 0.6rem 1.8rem;
            border-radius: 3rem;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 0.9rem;
        }

        .nav-btn:hover:not(:disabled) {
            background: #3b82f6;
            transform: scale(0.98);
        }

        .nav-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .slide-counter {
            background: #1e293b;
            padding: 0.4rem 1.2rem;
            border-radius: 2rem;
            font-size: 0.85rem;
            color: #cbd5e6;
        }

        .dot-indicators {
            display: flex;
            gap: 0.6rem;
            align-items: center;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: #4b5563;
            border-radius: 10px;
            transition: 0.2s;
        }

        .dot.active {
            background: #3b82f6;
            width: 24px;
        }

        .qa-list {
            margin-top: 0.5rem;
        }
        .qa-item {
            background: #1e293b;
            border-radius: 1rem;
            margin-bottom: 1rem;
            border: 1px solid #334155;
        }
        .qa-question {
            background: #0f172a;
            padding: 1rem 1.2rem;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            color: #f1f5f9;
        }
        .qa-question:hover {
            background: #2d3a5e;
        }
        .qa-answer {
            display: none;
            padding: 1.2rem;
            background: #111827;
            color: #cbd5e6;
            border-top: 1px solid #334155;
            line-height: 1.6;
        }
        .qa-answer.show {
            display: block;
        }

        .box-model-visual {
            background: #0f172a;
            padding: 1.5rem;
            text-align: center;
            border-radius: 1rem;
            margin: 1rem 0;
        }
        .margin-area { background: #fbbf24; padding: 1rem; color: #000; border-radius: 0.5rem; }
        .border-area { background: #3b82f6; padding: 1rem; margin: 0.5rem; border-radius: 0.5rem; }
        .padding-area { background: #10b981; padding: 1rem; border-radius: 0.5rem; }
        .content-area { background: #ef4444; padding: 1rem; border-radius: 0.5rem; color: white; }

        footer {
            font-size: 0.7rem;
            text-align: center;
            margin-top: 1rem;
            color: #6b7280;
        }

        @media (max-width: 700px) {
            .slide-content { padding: 1.5rem; }
            .slide-title { font-size: 1.4rem; }
        }
    </style>
</head>
<body>
<div class="presentation-wrapper">
    <div class="slide-container">
        <div class="slide-content" id="slideContent"></div>
        <div class="nav-controls">
            <div class="dot-indicators" id="dotsContainer"></div>
            <div style="display: flex; gap: 1rem;">
                <button class="nav-btn" id="prevSlideBtn"><i class="fas fa-chevron-left"></i> Previous</button>
                <span class="slide-counter" id="slideCounter"></span>
                <button class="nav-btn" id="nextSlideBtn">Next <i class="fas fa-chevron-right"></i></button>
            </div>
        </div>
    </div>
    <footer><i class="fas fa-arrow-left"></i> <i class="fas fa-arrow-right"></i> Arrow keys to navigate | 25+ slides covering CSS fundamentals + Colors + Backgrounds + Borders + Box Model + Quiz</footer>
</div>

<script>
    // ========== COMPLETE SLIDES - ADDING ALL NEW CONTENT ==========
    const slides = [
        // PART 1: Original CSS Introduction (Slides 0-9)
        { title: "<i class='fab fa-css3-alt'></i> What is CSS?", subtitle: "Cascading Style Sheets — The language that styles the web", content: `<div class="grid-2"><div class="card"><h3><i class="fas fa-palette"></i> Definition</h3><p>CSS describes how HTML elements are displayed on screen, paper, or other media. Separates content from presentation.</p></div><div class="card"><h3><i class="fas fa-tasks"></i> Saves Work</h3><p>Control layout of multiple web pages all at once. Change one external file, update entire website.</p></div><div class="card"><h3><i class="fas fa-layer-group"></i> Cascading Nature</h3><p>Styles cascade: <span class='highlight'>Inline > Internal/External > Browser defaults</span></p></div></div><div class='insight'><i class='fas fa-globe'></i> External stylesheets are stored in .css files — most maintainable method.</div>` },
        { title: "<i class='fas fa-code'></i> CSS Syntax & Rule Structure", subtitle: "Selector + Declaration Block = The heart of CSS", content: `<div class='code-block'>/* selector points to HTML element */<br>p {<br>&nbsp;&nbsp;color: red;      /* property: value */<br>&nbsp;&nbsp;text-align: center;<br>}</div><div class='grid-2'><div class='card'><h3><i class='fas fa-bullseye'></i> Selector</h3><p>Points to the element you want to style (e.g., h1, .class, #id).</p></div><div class='card'><h3><i class='fas fa-cube'></i> Declaration Block</h3><p>Curly braces containing property:value pairs separated by semicolons.</p></div></div><div class='insight'>Example: p { color: red; text-align: center; } → all paragraphs red + centered.</div>` },
        { title: "<i class='fas fa-mouse-pointer'></i> CSS Selectors", subtitle: "Element, ID, Class, Universal & Grouping", content: `</td><th>Selector</th><th>Example</th><th>Description</th></tr><tr><td>#id</td><td>#firstname</td><td>Selects unique element with id="firstname"</td></tr><tr><td>.class</td><td>.intro</td><td>Selects all elements with class="intro" (reusable)</td></tr><tr><td>*</td><td>*</td><td>Universal selector — selects ALL elements</td></tr><tr><td>element</td><td>p</td><td>Selects all &lt;p&gt; elements</td></tr><tr><td>element,element</td><td>div, p</td><td>Grouping: h1, h2, p { color: red; }</td></tr></table><div class='insight'>Class & ID names cannot start with a number!</div>` },
        { title: "<i class='fas fa-external-link-alt'></i> Method 1: EXTERNAL CSS", subtitle: "Best for multi-page websites — link a .css file", content: `<div class='code-block'>&lt;link rel="stylesheet" href="styles.css"&gt;</div><div class='grid-2'><div class='card'><h3><i class='fas fa-file'></i> styles.css example</h3><div class='code-block'>body { background: #f4f4f4; }<br>h1 { color: navy; }</div></div><div class='card'><h3><i class='fas fa-check-circle'></i> Advantages</h3><p>✅ One change affects all pages<br>✅ Cleaner HTML<br>✅ Cached → faster load</p></div></div><div class='insight'>External stylesheets contain ONLY CSS rules, no HTML tags.</div>` },
        { title: "<i class='fas fa-file-code'></i> Method 2: INTERNAL CSS", subtitle: "Embedded inside &lt;style&gt; tag", content: `<div class='code-block'>&lt;head&gt;<br>&nbsp;&nbsp;&lt;style&gt;<br>&nbsp;&nbsp;&nbsp;&nbsp;body { background: linen; }<br>&nbsp;&nbsp;&nbsp;&nbsp;h1 { color: maroon; }<br>&nbsp;&nbsp;&lt;/style&gt;<br>&lt;/head&gt;</div><div class='card'><h3>When to use</h3><p>Single page with unique style that won't be reused.</p></div>` },
        { title: "<i class='fas fa-highlighter'></i> Method 3: INLINE CSS", subtitle: "Directly on elements — highest specificity", content: `<div class='code-block'>&lt;h1 style="color:blue;text-align:center;"&gt;Heading&lt;/h1&gt;<br>&lt;p style="color:red; background:yellow;"&gt;Text&lt;/p&gt;</div><div style="background:#1e293b; padding:0.8rem; border-radius:1rem; margin-top:0.5rem;"><p style="color:#facc15; font-weight:bold;"><i class='fas fa-star-of-life'></i> Live Demo: This text uses inline CSS!</p></div><div class='insight'>Use sparingly — mixes content with presentation.</div>` },
        { title: "<i class='fas fa-water'></i> Cascading Order & Priority", subtitle: "What style wins? The cascade decides!", content: `<div class='grid-2'><div class='card'><h3>Priority (highest to lowest)</h3><ol><li><span class='highlight'>Inline style</span></li><li><span class='highlight'>External & Internal</span> (last read wins)</li><li>Browser default</li></ol></div><div class='card'><h3>Multiple Stylesheets</h3><p>If external sets navy and internal after link sets orange → orange wins.</p></div></div><div class='insight'>All styles cascade into a virtual style sheet.</div>` },
        { title: "<i class='fas fa-comment-dots'></i> CSS Comments & Common Errors", subtitle: "Write clean, bug-free CSS", content: `<div class='grid-2'><div class='card'><h3>CSS Comments</h3><div class='code-block'>/* single line */<br>p { color: red; /* inline */ }</div></div><div class='card'><h3>Common Errors</h3><ul><li>Missing semicolons</li><li>Invalid property names (colr: blue;)</li><li>No space between value & unit: correct = 20px</li><li>Unclosed braces</li></ul></div></div>` },
        { title: "<i class='fas fa-chalkboard-user'></i> All 3 Methods Comparison", subtitle: "External · Internal · Inline", content: `<table><tr><th>Method</th><th>Best for</th><th>Pros</th><th>Cons</th></tr><tr><td>External</td><td>Multi-page sites</td><td>Reusable, cacheable</td><td>Extra HTTP request</td></tr><tr><td>Internal</td><td>Single page</td><td>No extra files</td><td>Not reusable</td></tr><tr><td>Inline</td><td>One element</td><td>Highest priority</td><td>Mixes content/presentation</td></tr></table>` },
        { title: "<i class='fab fa-chrome'></i> Browser DevTools", subtitle: "Inspect & debug CSS", content: `<div class='card'><h3><i class='fas fa-tools'></i> Chrome DevTools</h3><p>Open with <span class='highlight'>F12</span> → Elements panel → inspect any element → see computed styles, toggle classes, test live CSS modifications.</p></div><div class='insight'>Network tab shows HTTP requests, timing, and loaded CSS files.</div>` },
        
        // ========== NEW: CSS COLORS (4 slides) ==========
        { title: "<i class='fas fa-palette'></i> CSS Colors Overview", subtitle: "Color Names, RGB, HEX, HSL, RGBA, HSLA", content: `<div class='grid-2'><div class='card'><h3>Color Names</h3><p>140 standard color names supported:</p><div><span class='color-demo' style='background:Tomato;'>Tomato</span> <span class='color-demo' style='background:DodgerBlue;'>DodgerBlue</span> <span class='color-demo' style='background:MediumSeaGreen;'>MediumSeaGreen</span> <span class='color-demo' style='background:SlateBlue;'>SlateBlue</span> <span class='color-demo' style='background:Violet;'>Violet</span></div></div><div class='card'><h3>Text & Background</h3><div class='code-block'>&lt;h1 style="color:Tomato;"&gt;Hello&lt;/h1&gt;<br>&lt;p style="background-color:DodgerBlue;"&gt;Text&lt;/p&gt;</div><div class='code-block'>&lt;h1 style="border:2px solid Tomato;"&gt;Border&lt;/h1&gt;</div></div></div><div class='insight'>CSS supports color names, RGB, HEX, HSL, RGBA, and HSLA values.</div>` },
        { title: "<i class='fas fa-chart-line'></i> RGB & RGBA Colors", subtitle: "Red, Green, Blue + Alpha transparency", content: `<div class='code-block'>rgb(255, 0, 0)   /* red */<br>rgb(0, 255, 0)   /* green */<br>rgb(0, 0, 255)   /* blue */<br>rgb(0, 0, 0)     /* black */<br>rgb(255, 255, 255) /* white */<br><br>rgba(255, 99, 71, 0.5) /* 50% transparent Tomato */</div><div class='grid-2'><div class='card'><h3>RGB Examples</h3><div><span class='color-demo' style='background:rgb(255,0,0);'>Red</span> <span class='color-demo' style='background:rgb(0,255,0);'>Green</span> <span class='color-demo' style='background:rgb(0,0,255);'>Blue</span> <span class='color-demo' style='background:rgb(60,179,113);'>SeaGreen</span></div><div>Shades of gray: rgb(60,60,60), rgb(120,120,120), rgb(210,210,210)</div></div><div class='card'><h3>RGBA (with opacity)</h3><div><span class='color-demo' style='background:rgba(255,99,71,0.2);'>20%</span> <span class='color-demo' style='background:rgba(255,99,71,0.4);'>40%</span> <span class='color-demo' style='background:rgba(255,99,71,0.6);'>60%</span> <span class='color-demo' style='background:rgba(255,99,71,0.8);'>80%</span> <span class='color-demo' style='background:rgba(255,99,71,1);'>100%</span></div></div></div><div class='insight'>Alpha: 0.0 = fully transparent, 1.0 = fully opaque.</div>` },
        { title: "<i class='fas fa-hashtag'></i> HEX Colors", subtitle: "#RRGGBB hexadecimal values", content: `<div class='code-block'>#ff0000  /* red */<br>#00ff00  /* green */<br>#0000ff  /* blue */<br>#ffffff  /* white */<br>#000000  /* black */<br>#ff6347  /* tomato */</div><div class='grid-2'><div class='card'><h3>HEX Examples</h3><div><span class='color-demo' style='background:#ff0000;'>#ff0000</span> <span class='color-demo' style='background:#3cb371;'>#3cb371</span> <span class='color-demo' style='background:#ee82ee;'>#ee82ee</span> <span class='color-demo' style='background:#ffa500;'>#ffa500</span></div><div>Shades of gray: #3c3c3c, #787878, #b4b4b4, #f0f0f0</div></div><div class='card'><h3>3-Digit HEX Shorthand</h3><div class='code-block'>#fc9 = #ffcc99<br>#f0f = #ff00ff<br>#b58 = #bb5588</div><p>Only when each component pair has same value (RR, GG, BB).</p></div></div><div class='insight'>HEX values range from 00 (0) to ff (255).</div>` },
        { title: "<i class='fas fa-chart-simple'></i> HSL & HSLA Colors", subtitle: "Hue (0-360°), Saturation, Lightness + Alpha", content: `<div class='code-block'>hsl(0, 100%, 50%)    /* red */<br>hsl(120, 100%, 50%)  /* green */<br>hsl(240, 100%, 50%)  /* blue */<br>hsl(0, 0%, 50%)      /* gray */</div><div class='grid-2'><div class='card'><h3>HSL Explained</h3><ul><li><span class='highlight'>Hue:</span> 0-360° on color wheel (0=red, 120=green, 240=blue)</li><li><span class='highlight'>Saturation:</span> 0% = gray, 100% = full color</li><li><span class='highlight'>Lightness:</span> 0% = black, 50% = normal, 100% = white</li></ul><div><span class='color-demo' style='background:hsl(0,100%,50%);'>0°</span> <span class='color-demo' style='background:hsl(120,100%,50%);'>120°</span> <span class='color-demo' style='background:hsl(240,100%,50%);'>240°</span></div></div><div class='card'><h3>HSLA (with opacity)</h3><div class='code-block'>hsla(9, 100%, 64%, 0.5) /* 50% transparent */</div><div><span class='color-demo' style='background:hsla(9,100%,64%,0.3);'>30%</span> <span class='color-demo' style='background:hsla(9,100%,64%,0.7);'>70%</span></div></div></div><div class='insight'>Lightness: 0% black, 50% pure color, 100% white.</div>` },
        
        // ========== NEW: CSS BACKGROUNDS (3 slides) ==========
        { title: "<i class='fas fa-image'></i> CSS Backgrounds", subtitle: "background-color, background-image, opacity", content: `<div class='grid-2'><div class='card'><h3>Background Color</h3><div class='code-block'>body { background-color: lightblue; }<br>h1 { background-color: green; }<br>div { background-color: rgba(0,128,0,0.3); }</div></div><div class='card'><h3>Background Image</h3><div class='code-block'>body {<br>  background-image: url('paper.gif');<br>}</div><p>By default, image repeats to cover entire element.</p></div></div><div class='grid-2'><div class='card'><h3>Opacity (affects everything)</h3><div class='code-block'>div {<br>  background-color: green;<br>  opacity: 0.3;<br>}</div><p>Text and children also become transparent.</p></div><div class='card'><h3>RGBA (background only)</h3><div class='code-block'>div {<br>  background: rgba(0, 128, 0, 0.3);<br>}</div><p>Only background transparent — text remains clear.</p></div></div>` },
        { title: "<i class='fas fa-repeat'></i> Background Repeat & Position", subtitle: "repeat, repeat-x, repeat-y, no-repeat, position", content: `<div class='code-block'>body {<br>  background-image: url('gradient_bg.png');<br>  background-repeat: repeat-x;   /* horizontal only */<br>  background-position: right top;<br>}</div><div class='grid-2'><div class='card'><h3>Repeat Values</h3><ul><li><span class='highlight'>repeat</span> - default (both directions)</li><li><span class='highlight'>repeat-x</span> - horizontal only</li><li><span class='highlight'>repeat-y</span> - vertical only</li><li><span class='highlight'>no-repeat</span> - image appears once</li></ul></div><div class='card'><h3>Position Values</h3><p>background-position: <span class='highlight'>right top</span> | left bottom | center | 50% 50% | 20px 30px</p></div></div><div class='insight'>Default background-position is top-left corner.</div>` },
        { title: "<i class='fas fa-paperclip'></i> Background Attachment & Shorthand", subtitle: "fixed, scroll, and the background shorthand", content: `<div class='code-block'>body {<br>  background-attachment: fixed; /* image stays in place when scrolling */<br>}<br><br>/* SHORTHAND: color image repeat position attachment */<br>body {<br>  background: #ffffff url('img_tree.png') no-repeat right top fixed;<br>}</div><div class='grid-2'><div class='card'><h3>Attachment Values</h3><ul><li><span class='highlight'>fixed</span> - background stays fixed</li><li><span class='highlight'>scroll</span> - scrolls with page (default)</li></ul></div><div class='card'><h3>Shorthand Order</h3><p>background: <span class='highlight'>color image repeat position attachment</span></p><p>Missing values use defaults.</p></div></div><div class='insight'>Shorthand reduces code and improves readability.</div>` },
        
        // ========== NEW: CSS BORDERS (3 slides) ==========
        { title: "<i class='fas fa-border-all'></i> CSS Borders", subtitle: "border-style, border-width, border-color", content: `<div class='code-block'>p {<br>  border-style: solid dotted dashed double;<br>  border-width: 5px;<br>  border-color: red green blue yellow;<br>}</div><div class='grid-2'><div class='card'><h3>Border Styles</h3><div><span class='border-demo' style='border:2px dotted white;'>dotted</span> <span class='border-demo' style='border:2px dashed white;'>dashed</span> <span class='border-demo' style='border:2px solid white;'>solid</span> <span class='border-demo' style='border:2px double white;'>double</span></div><div><span class='border-demo' style='border:2px groove white;'>groove</span> <span class='border-demo' style='border:2px ridge white;'>ridge</span> <span class='border-demo' style='border:2px inset white;'>inset</span> <span class='border-demo' style='border:2px outset white;'>outset</span></div></div><div class='card'><h3>Border Shorthand</h3><div class='code-block'>border: 5px solid red;<br>border-left: 6px solid blue;<br>border-bottom: 3px dotted green;</div></div></div><div class='insight'><span class='highlight'>border-style is REQUIRED!</span> Other border properties won't work without it.</div>` },
        { title: "<i class='fas fa-border-style'></i> Border Sides & Specific Widths", subtitle: "Individual border sides", content: `<div class='code-block'>/* Four values: top, right, bottom, left */<br>border-style: dotted solid double dashed;<br>border-width: 5px 20px 5px 20px;<br>border-color: red green blue yellow;<br><br>/* Three values: top, (right+left), bottom */<br>border-style: dotted solid double;<br><br>/* Two values: (top+bottom), (right+left) */<br>border-style: dotted solid;<br><br>/* One value: all four sides */<br>border-style: solid;</div><div class='insight'>You can also use border-top-style, border-right-width, border-bottom-color individually.</div>` },
        { title: "<i class='fas fa-circle-notch'></i> Rounded Borders (border-radius)", subtitle: "Creating smooth corners", content: `<div class='grid-2'><div class='card'><div style='border:2px solid red; border-radius:5px; padding:0.8rem; margin-bottom:0.8rem; text-align:center;'>border-radius: 5px</div><div style='border:2px solid red; border-radius:15px; padding:0.8rem; margin-bottom:0.8rem; text-align:center;'>border-radius: 15px</div><div style='border:2px solid red; border-radius:30px; padding:0.8rem; text-align:center;'>border-radius: 30px</div></div><div class='card'><div class='code-block'>/* Different corners */<br>border-radius: 10px 20px 30px 40px;<br><br>/* Circle */<br>border-radius: 50%;<br><br>/* Pill shape */<br>border-radius: 999px;</div><div style='width:80px; height:80px; background:#3b82f6; border-radius:50%; margin-top:0.5rem;'></div><p style='text-align:center'>Circle with 50%</p></div></div><div class='insight'>border-radius works on any element with a border or background.</div>` },
        
        // ========== NEW: CSS MARGINS & PADDING (2 slides) ==========
        { title: "<i class='fas fa-arrows-alt'></i> CSS Margins", subtitle: "Space outside borders — creates distance between elements", content: `<div class='code-block'>p {<br>  margin-top: 100px;<br>  margin-right: 150px;<br>  margin-bottom: 100px;<br>  margin-left: 80px;<br>  margin: 25px 50px 75px 100px; /* shorthand */<br>  margin: 25px 50px; /* top/bottom 25, left/right 50 */<br>  margin: auto; /* centers element horizontally */<br>}</div><div class='grid-2'><div class='card'><h3>Margin Values</h3><ul><li><span class='highlight'>auto</span> - browser calculates (centers block elements)</li><li><span class='highlight'>length</span> - px, pt, cm, em</li><li><span class='highlight'>%</span> - percentage of containing element</li><li>Negative values allowed</li></ul></div><div class='card'><h3>Margin Collapse</h3><p>When two vertical margins touch, they collapse into the <span class='highlight'>larger value</span>.</p><div class='code-block'>h1 { margin-bottom: 50px; }<br>h2 { margin-top: 20px; }<br>/* Actual gap = 50px, not 70px */</div></div></div><div class='insight'>Margin collapse only happens with top/bottom margins, not left/right.</div>` },
        { title: "<i class='fas fa-expand-alt'></i> CSS Padding", subtitle: "Space inside borders — around content", content: `<div class='code-block'>div {<br>  padding-top: 50px;<br>  padding-right: 30px;<br>  padding-bottom: 50px;<br>  padding-left: 80px;<br>  padding: 25px 50px 75px 100px; /* shorthand */<br>  padding: 20px; /* all sides */<br>}</div><div class='grid-2'><div class='card'><h3>Padding vs Margin</h3><ul><li><span class='highlight'>Padding</span> = space INSIDE the border</li><li><span class='highlight'>Margin</span> = space OUTSIDE the border</li><li>Padding increases element size unless box-sizing used</li></ul></div><div class='card'><div style='background:#1e293b; padding:1rem; border:2px solid #3b82f6;'><div style='background:#10b981; padding:1rem;'>Content with padding inside</div></div><p style='margin-top:0.5rem;'>Padding creates breathing room around content.</p></div></div><div class='insight'>Negative padding values are NOT allowed.</div>` },
        
        // ========== NEW: CSS HEIGHT, WIDTH, BOX MODEL (3 slides) ==========
        { title: "<i class='fas fa-vector-square'></i> Height & Width Properties", subtitle: "Setting element dimensions", content: `<div class='code-block'>div {<br>  height: 200px;<br>  width: 50%;<br>  max-width: 600px;<br>  min-height: 100px;<br>  background-color: powderblue;<br>}</div><div class='grid-2'><div class='card'><h3>Values</h3><ul><li><span class='highlight'>auto</span> - browser calculates (default)</li><li><span class='highlight'>length</span> - px, cm, em</li><li><span class='highlight'>%</span> - percentage of containing block</li><li><span class='highlight'>initial/inherit</span></li></ul></div><div class='card'><h3>min-width & max-width</h3><div class='code-block'>.container {<br>  max-width: 900px;<br>  min-width: 300px;<br>}</div><p>max-width prevents elements from becoming too wide — essential for responsive design.</p></div></div><div class='insight'>height/width set the CONTENT area — does NOT include padding, border, or margin!</div>` },
        { title: "<i class='fas fa-cube'></i> CSS Box Model", subtitle: "Every element is a box: Content → Padding → Border → Margin", content: `<div class='box-model-visual'><div class='margin-area'>MARGIN (transparent)<div class='border-area'>BORDER<div class='padding-area'>PADDING<div class='content-area'>CONTENT</div></div></div></div></div><div class='code-block'>Total width = width + padding-left + padding-right + border-left + border-right<br>Total height = height + padding-top + padding-bottom + border-top + border-bottom</div><div class='grid-2'><div class='card'><h3>Example Calculation</h3><div class='code-block'>div {<br>  width: 320px;<br>  padding: 10px;<br>  border: 5px solid gray;<br>}<br>/* Total width = 320 + 20 + 10 = 350px */</div></div><div class='card'><h3>box-sizing: border-box</h3><div class='code-block'>div {<br>  width: 300px;<br>  padding: 25px;<br>  box-sizing: border-box;<br>}<br>/* Width stays 300px including padding! */</div></div></div><div class='insight'>box-sizing: border-box makes layout much easier to predict.</div>` },
        { title: "<i class='fas fa-sliders-h'></i> Min/Max Dimensions & Responsive Design", subtitle: "Creating flexible layouts", content: `<div class='code-block'>.responsive-box {<br>  width: 100%;<br>  max-width: 800px;<br>  min-width: 250px;<br>  height: auto;<br>  min-height: 150px;<br>  background: #1e293b;<br>  padding: 1rem;<br>}</div><div class='grid-2'><div class='card'><h3>Why Use max-width?</h3><p>Prevents elements from becoming too wide on large screens. Browser window smaller than max-width? Element adapts.</p><div style='background:#2d3a5e; max-width:400px; padding:0.5rem; margin-top:0.5rem; text-align:center;'>max-width: 400px — try resizing window!</div></div><div class='card'><h3>Common Pattern</h3><div class='code-block'>.container {<br>  width: 100%;<br>  max-width: 1200px;<br>  margin: 0 auto;<br>}</div><p>Centers content with max width — perfect for responsive layouts.</p></div></div><div class='insight'>Always use max-width instead of width for responsive containers.</div>` },
        
        // ========== FINAL: QUIZ SLIDE ==========
        { title: "<i class='fas fa-question-circle'></i> CSS Knowledge Quiz", subtitle: "Test everything you've learned — click to reveal answers", content: `<div id="quizContainer" class="qa-list"></div><div class='insight'><i class='fas fa-graduation-cap'></i> 20+ questions covering CSS syntax, colors, backgrounds, borders, margins, padding, and the box model.</div>` }
    ];

    // Comprehensive quiz data
    const quizData = [
        { q: "What are the three ways to add CSS to a web page?", a: "1. EXTERNAL: <link> to .css file. 2. INTERNAL: <style> tag in head. 3. INLINE: style attribute on elements." },
        { q: "What is the cascade order (highest to lowest priority)?", a: "Inline styles > Internal/External (last read wins) > Browser defaults." },
        { q: "What does RGB stand for? Give an example of red.", a: "Red, Green, Blue. Example: rgb(255,0,0) or #ff0000 represents red." },
        { q: "What is the difference between RGBA and RGB?", a: "RGBA adds an Alpha channel for opacity (0.0 transparent to 1.0 opaque). Example: rgba(255,0,0,0.5) is 50% transparent red." },
        { q: "What does HEX color #ffffff represent?", a: "#ffffff represents white. #000000 is black. #ff0000 is red." },
        { q: "What does HSL stand for? What are the ranges?", a: "Hue (0-360° on color wheel), Saturation (0-100%), Lightness (0-100%)." },
        { q: "How do you set a background image to not repeat?", a: "background-repeat: no-repeat;" },
        { q: "What is the difference between opacity and rgba() for backgrounds?", a: "opacity affects the ENTIRE element including text and children. rgba() only affects the background color." },
        { q: "What is the background shorthand property order?", a: "background: color image repeat position attachment; Example: background: #fff url('img.jpg') no-repeat right top fixed;" },
        { q: "Which border property is REQUIRED for borders to appear?", a: "border-style is required. Without it, border-width and border-color have no effect." },
        { q: "Name at least 5 border-style values.", a: "dotted, dashed, solid, double, groove, ridge, inset, outset, none, hidden." },
        { q: "What does border-radius do? Give an example.", a: "Creates rounded corners. Example: border-radius: 10px; border-radius: 50% makes a circle." },
        { q: "What is the difference between margin and padding?", a: "Margin creates space OUTSIDE the border (between elements). Padding creates space INSIDE the border (around content)." },
        { q: "What is margin collapse?", a: "When two vertical margins (top and bottom) touch, they collapse into a single margin equal to the larger value." },
        { q: "How do you horizontally center a block element?", a: "Set margin: auto; and a specified width." },
        { q: "What does box-sizing: border-box do?", a: "Makes width and height include padding and border, so total size stays as specified. Example: width: 200px; padding: 20px; → total is still 200px." },
        { q: "How is total element width calculated in the box model?", a: "Total width = width + padding-left + padding-right + border-left + border-right." },
        { q: "What is the difference between width and max-width?", a: "width sets a fixed width. max-width sets an upper limit but allows element to shrink on smaller screens." },
        { q: "What are the possible values for background-repeat?", a: "repeat (default), repeat-x (horizontal only), repeat-y (vertical only), no-repeat (once)." },
        { q: "How do you set a fixed background that doesn't scroll?", a: "background-attachment: fixed;" },
        { q: "What does the universal selector (*) do?", a: "Selects EVERY HTML element on the page. Useful for CSS resets." },
        { q: "What is the grouping selector and why use it?", a: "h1, h2, p { color: red; } — applies same styles to multiple selectors, reducing code repetition." }
    ];

    let currentIndex = 0;
    const totalSlides = slides.length;

    const slideContentDiv = document.getElementById('slideContent');
    const prevBtn = document.getElementById('prevSlideBtn');
    const nextBtn = document.getElementById('nextSlideBtn');
    const counterSpan = document.getElementById('slideCounter');
    const dotsContainer = document.getElementById('dotsContainer');

    function renderQuiz() {
        const quizContainer = document.getElementById('quizContainer');
        if (!quizContainer) return;
        quizContainer.innerHTML = '';
        quizData.forEach((item, idx) => {
            const qaDiv = document.createElement('div');
            qaDiv.className = 'qa-item';
            qaDiv.innerHTML = `
                <div class="qa-question" data-idx="${idx}">
                    <span><strong>${idx+1}. </strong> ${item.q}</span>
                    <i class="fas fa-chevron-down"></i>
                </div>
                <div class="qa-answer" id="quizAns-${idx}">
                    <p><i class="fas fa-comment-dots"></i> <strong>Answer:</strong><br>${item.a}</p>
                </div>
            `;
            quizContainer.appendChild(qaDiv);
        });
        document.querySelectorAll('.qa-question').forEach(qElem => {
            qElem.addEventListener('click', () => {
                const idx = qElem.getAttribute('data-idx');
                const ansDiv = document.getElementById(`quizAns-${idx}`);
                const icon = qElem.querySelector('i');
                if (ansDiv) {
                    ansDiv.classList.toggle('show');
                    icon.style.transform = ansDiv.classList.contains('show') ? 'rotate(180deg)' : 'rotate(0deg)';
                }
            });
        });
    }

    function renderSlide(index) {
        const slide = slides[index];
        let contentHtml = `
            <div class="slide-title">${slide.title}</div>
            <div class="slide-sub"><i class="fas fa-angle-right"></i> ${slide.subtitle}</div>
            <div>${slide.content}</div>
        `;
        slideContentDiv.innerHTML = contentHtml;
        if (index === slides.length - 1) renderQuiz();
        updateDots(index);
        prevBtn.disabled = (index === 0);
        nextBtn.disabled = (index === totalSlides - 1);
        counterSpan.innerHTML = `<i class="far fa-file-alt"></i> ${index+1} / ${totalSlides}`;
    }

    function updateDots(activeIdx) {
        dotsContainer.innerHTML = '';
        for (let i = 0; i < totalSlides; i++) {
            const dot = document.createElement('div');
            dot.classList.add('dot');
            if (i === activeIdx) dot.classList.add('active');
            dotsContainer.appendChild(dot);
        }
    }

    function nextSlide() { if (currentIndex < totalSlides - 1) { currentIndex++; renderSlide(currentIndex); } }
    function prevSlide() { if (currentIndex > 0) { currentIndex--; renderSlide(currentIndex); } }

    prevBtn.addEventListener('click', prevSlide);
    nextBtn.addEventListener('click', nextSlide);
    window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight') { e.preventDefault(); nextSlide(); }
        else if (e.key === 'ArrowLeft') { e.preventDefault(); prevSlide(); }
    });

    renderSlide(0);
</script>
</body>
</html>

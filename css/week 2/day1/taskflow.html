<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="taskflow.css"
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Flow Sign In page</title>
</head>
<body>
    <div>
        <h1 class="company_name">Taskflow</h1>
        <p class="cto">Sign in into your account</p>
        <form class="login_form">
            <label class="email_label">Email or Username</label> <br>
            <input class="email_input" type="text" placeholder="support@appBrew.com"><br>
            <label class="pass_label">Password</label> <br>
            <input class="password_input" type="password"><br>

            <input class="remeber_me_check" type="checkbox">Remember me

            <label class="otp_method_label">OTP Method:</label>
            <select>
                <option>Email</option>
                <option>Phone</option>
            </select><br> 

            <button class="submit_btn">Sign In</button>

            <p class="demo_text">
                Demo credentials: support@appbrew.com or username /qwerty
            </p>



        </form>
    </div>
</body>
</html>

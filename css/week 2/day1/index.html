        .qa-item.completed .qa-question .q-number { background: #22c55e; }
        .qa-footer { margin-top: 1.2rem; text-align: center; font-size: 0.85rem; color: #94a3b8; }
        .qa-footer i { color: #fcd34d; }

    const slides = [
        {
            title: "<i class='fas fa-code'></i> CSS Syntax",
            subtitle: "CSS rule structure and declarations",
            content: `
                <div class="two-column-split">
                    <div class="col"><h4><i class="fas fa-cog"></i> CSS Rule Structure</h4>
                        <p>A CSS rule consists of a <span class="highlight">selector</span> and a <span class="highlight">declaration block</span>.</p>
                        <pre><code>selector {
  property: value;
  property: value;
}</code></pre>
                        <p><strong>Example:</strong></p>
                        <pre><code>p {
  color: red;
  text-align: center;
}</code></pre>
                        <p><strong>Example Explained:</strong></p>
                        <ul style="margin-left:1.2rem; color:#e2e8f0;">
                            <li><span class="highlight">p</span> is a selector (it points to the HTML element: &lt;p&gt;)</li>
                            <li><span class="highlight">color</span> is a property, <span class="highlight">red</span> is the property value</li>
                            <li><span class="highlight">text-align</span> is a property, <span class="highlight">center</span> is the property value</li>
                        </ul>
                    </div>
                    <div class="col"><h4><i class="fas fa-notes-medical"></i> CSS Comments</h4>
                        <p>Comments are used to explain the CSS code, and may help when you edit the source code at a later date.</p>
                        <p>Comments are also used to temporarily disable sections of CSS code within a stylesheet.</p>
                        <p>Comments are <span class="highlight">ignored by browsers</span>!</p>
                        <pre><code>/* This is a single-line comment */
p {
  color: red;
}

p {
  color: red;  /* Set text color to red */
}

/* This is
a multi-line
comment */

p {
  color: /*red*/blue; 
}</code></pre>
                        <p><span class="highlight">💡</span> You can also use HTML comments: <code>&lt;!-- This is an HTML comment --&gt;</code></p>
                    </div>
                </div>
                <div class="insight-card"><i class="fas fa-lightbulb"></i> <strong>Key takeaway:</strong> CSS rules are made of selectors and declarations. Comments help keep code maintainable and explain your logic.</div>
            `

            content: `
                <div class="content-grid">
                    <div class="concept-box"><h3><i class="fas fa-tag"></i> The CSS element Selector</h3>
                        <p>The element selector selects HTML elements based on the element name.</p>
                        <p><strong>Example:</strong> Here, all &lt;p&gt; elements on the page will be center-aligned, with a red text color:</p>
                        <pre><code>p {
  text-align: center;
  color: red;
}</code></pre>
                    </div>
                    <div class="concept-box"><h3><i class="fas fa-hashtag"></i> The CSS id Selector</h3>
                        <p>The id selector uses the <span class="highlight">id</span> attribute of an HTML element to select a specific element.</p>
                        <p>The id of an element is <span class="highlight">unique within a page</span>, so the id selector is used to select one unique element!</p>
                        <p>To select an element with a specific id, write a hash <span class="highlight">(#)</span> character, followed by the id of the element.</p>
                        <pre><code>#para1 {
  text-align: center;
  color: red;
}</code></pre>
                        <p><span class="highlight">⚠️</span> An id name cannot start with a number!</p>
                    </div>
                </div>
                <div class="content-grid">
                    <div class="concept-box"><h3><i class="fas fa-circle"></i> The CSS class Selector</h3>
                        <p>The class selector selects HTML elements with a specific <span class="highlight">class</span> attribute.</p>
                        <p>To select elements with a specific class, write a period <span class="highlight">(.)</span> character, followed by the class name.</p>
                        <pre><code>.center {
  text-align: center;
  color: red;
}</code></pre>
                        <p>You can also specify that only specific HTML elements should be affected by a class.</p>
                        <pre><code>p.center {
  text-align: center;
  color: red;
}</code></pre>
                        <p>HTML elements can also refer to <span class="highlight">more than one class</span>.</p>
                        <pre><code>&lt;p class="center large"&gt;This paragraph refers to two classes.&lt;/p&gt;</code></pre>
                        <p><span class="highlight">⚠️</span> A class name cannot start with a number!</p>
                    </div>
                    <div class="concept-box"><h3><i class="fas fa-asterisk"></i> Universal & Grouping</h3>
                        <p><strong>The CSS Universal Selector:</strong> The universal selector <span class="highlight">(*)</span> selects all HTML elements on the page.</p>
                        <pre><code>* {
  text-align: center;
  color: blue;
}</code></pre>
                        <p><strong>The CSS Grouping Selector:</strong> The grouping selector selects all the HTML elements with the same style definitions.</p>
                        <pre><code>h1, h2, p {
  text-align: center;
  color: red;
}</code></pre>
                        <p>To group selectors, <span class="highlight">separate each selector with a comma</span>.</p>
                    </div>
                </div>
                <div class="insight-card"><i class="fas fa-table"></i> <strong>Selector reference:</strong> #id, .class, element, *, element,element</div>

            `

    let currentIndex = 0;
    const totalSlides = slides.length;
    const slideArea = document.getElementById('slideArea');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const counterText = document.getElementById('counterText');
    const dotsContainer = document.getElementById('dotsContainer');

    function renderQA() {
        const container = document.getElementById('qa-container');
        if (!container) return;
        container.innerHTML = '';
        qaData.forEach((item, idx) => {
            const qaDiv = document.createElement('div');
            qaDiv.className = 'qa-item';
            qaDiv.innerHTML = `
                <div class="qa-question" data-idx="${idx}">
                    <span class="q-number">${idx+1}</span>
                    <span class="q-text">${item.q}</span>
                    <i class="fas fa-chevron-down"></i>
                </div>
                <div class="qa-answer" id="answer-${idx}">
                    <div class="answer-label"><i class="fas fa-check-circle"></i> Answer:</div>
                    <p>${item.a}</p>
                </div>
            `;
            container.appendChild(qaDiv);
        });

        document.querySelectorAll('.qa-question').forEach(question => {
            question.addEventListener('click', function() {
                const idx = this.getAttribute('data-idx');
                const answerDiv = document.getElementById(`answer-${idx}`);
                const icon = this.querySelector('i');
                const item = this.closest('.qa-item');

                const isShowing = answerDiv.classList.contains('show');
                
                document.querySelectorAll('.qa-answer').forEach(ans => {
                    ans.classList.remove('show');
                    ans.style.maxHeight = '0';
                    ans.style.padding = '0 1.2rem';
                    ans.style.opacity = '0';
                });
                document.querySelectorAll('.qa-question i').forEach(ic => {
                    ic.style.transform = 'rotate(0deg)';
                });
                document.querySelectorAll('.qa-item').forEach(it => {
                    it.classList.remove('completed');
                });

                if (!isShowing) {
                    answerDiv.classList.add('show');
                    answerDiv.style.maxHeight = '400px';
                    answerDiv.style.padding = '1.2rem 1.2rem';
                    answerDiv.style.opacity = '1';
                    icon.style.transform = 'rotate(180deg)';
                    item.classList.add('completed');
                }
            });
        });
    }

    function renderSlide(index) {
        const slide = slides[index];
        const html = `
            <div class="slide-card">
                <div class="slide-title">${slide.title}</div>
                <div class="slide-sub"><i class="fas fa-angle-right"></i> ${slide.subtitle}</div>
                <div class="slide-content">${slide.content}</div>
            </div>
        `;
        slideArea.innerHTML = html;
        if (index === totalSlides - 1) {
            renderQA();
        }
        counterText.innerHTML = `<i class="far fa-file-alt"></i> ${index+1} / ${totalSlides}`;
        prevBtn.disabled = (index === 0);
        nextBtn.disabled = (index === totalSlides-1);
        updateDots(index);
    }

    function updateDots(activeIndex) {
        dotsContainer.innerHTML = '';
        for (let i = 0; i < totalSlides; i++) {
            const dot = document.createElement('div');
            dot.classList.add('dot');
            if (i === activeIndex) dot.classList.add('active');
            dotsContainer.appendChild(dot);
        }
    }

    function nextSlide() { if (currentIndex < totalSlides - 1) { currentIndex++; renderSlide(currentIndex); } }
    function prevSlide() { if (currentIndex > 0) { currentIndex--; renderSlide(currentIndex); } }
    function handleKeyDown(e) {
        if (e.key === 'ArrowRight') { e.preventDefault(); nextSlide(); }
        else if (e.key === 'ArrowLeft') { e.preventDefault(); prevSlide(); }
    }

    prevBtn.addEventListener('click', prevSlide);
    nextBtn.addEventListener('click', nextSlide);
    window.addEventListener('keydown', handleKeyDown);
    renderSlide(0);
</script>

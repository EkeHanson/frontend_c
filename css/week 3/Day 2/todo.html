<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Today's tasks · a human page</title>
    <!-- Font Awesome 6 (free) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="todo.css" />
</head>
<body>
    <div class="task-panel">
        <!-- header with human warmth -->
        <div class="panel-header">
            <div class="header-left">
                <i class="fas fa-smile-wink"></i>
                <h1>Today <span>· tasks</span></h1>
            </div>
            <div class="date-badge">
                <i class="fas fa-calendar-alt"></i>
                <span id="currentDate"></span>
            </div>
        </div>

        <!-- progress — gentle & human -->
        <div class="progress-summary">
            <div class="progress-stats">
                <span class="stat-item">
                    <i class="fas fa-list-ul"></i>
                    <span class="stat-number" id="totalTasks">4</span> total
                </span>
                <span class="stat-item">
                    <i class="fas fa-check-circle"></i>
                    <span class="stat-number" id="doneTasks">2</span> done
                </span>
                <span class="stat-item">
                    <i class="fas fa-hourglass-half"></i>
                    <span class="stat-number" id="pendingTasks">2</span> left
                </span>
            </div>
            <div class="progress-label">
                <i class="fas fa-heart" style="color:#b2836a;"></i>
                <span id="progressPercent">48%</span>
                <div class="progress-bar-wrap">
                    <div class="progress-fill" id="progressFill" style="width:48%"></div>
                </div>
            </div>
        </div>

        <!-- task list — human-friendly cards -->
        <div class="task-list" id="taskList">
            <!-- sample tasks (with human touch) -->
            <div class="task-item" data-id="1">
                <div class="task-check">
                    <input type="checkbox" checked />
                </div>
                <div class="task-content">
                    <div class="task-title">
                        Review design mockups
                        <span class="task-tag high">high</span>
                    </div>
                    <div class="task-meta">
                        <span><i class="far fa-clock"></i> 10:30 AM</span>
                        <span><i class="far fa-calendar-alt"></i> today</span>
                    </div>
                </div>
                <div class="task-actions">
                    <button class="btn-edit" title="Edit"><i class="fas fa-pen"></i></button>
                    <button class="btn-delete" title="Delete"><i class="fas fa-trash-can"></i></button>
                </div>
            </div>

            <div class="task-item" data-id="2">
                <div class="task-check">
                    <input type="checkbox" />
                </div>
                <div class="task-content">
                    <div class="task-title">
                        Draft weekly report
                        <span class="task-tag medium">medium</span>
                    </div>
                    <div class="task-meta">
                        <span><i class="far fa-clock"></i> 1:00 PM</span>
                        <span><i class="far fa-calendar-alt"></i> today</span>
                    </div>
                </div>
                <div class="task-actions">
                    <button class="btn-edit" title="Edit"><i class="fas fa-pen"></i></button>
                    <button class="btn-delete" title="Delete"><i class="fas fa-trash-can"></i></button>
                </div>
            </div>

            <div class="task-item" data-id="3">
                <div class="task-check">
                    <input type="checkbox" checked />
                </div>
                <div class="task-content">
                    <div class="task-title">
                        Sync with product team
                        <span class="task-tag low">low</span>
                    </div>
                    <div class="task-meta">
                        <span><i class="far fa-clock"></i> 9:00 AM</span>
                        <span><i class="far fa-calendar-alt"></i> today</span>
                    </div>
                </div>
                <div class="task-actions">
                    <button class="btn-edit" title="Edit"><i class="fas fa-pen"></i></button>
                    <button class="btn-delete" title="Delete"><i class="fas fa-trash-can"></i></button>
                </div>
            </div>

            <div class="task-item" data-id="4">
                <div class="task-check">
                    <input type="checkbox" />
                </div>
                <div class="task-content">
                    <div class="task-title">
                        Prepare client presentation
                        <span class="task-tag high">high</span>
                    </div>
                    <div class="task-meta">
                        <span><i class="far fa-clock"></i> 3:30 PM</span>
                        <span><i class="far fa-calendar-alt"></i> today</span>
                    </div>
                </div>
                <div class="task-actions">
                    <button class="btn-edit" title="Edit"><i class="fas fa-pen"></i></button>
                    <button class="btn-delete" title="Delete"><i class="fas fa-trash-can"></i></button>
                </div>
            </div>
        </div>

        <!-- add task — friendly & inviting -->
        <div class="add-task-row">
            <input type="text" id="newTaskInput" placeholder="Add a task… like 'Call mom' ✨" />
            <button id="addTaskBtn"><i class="fas fa-plus-circle"></i> Add</button>
        </div>

        <!-- footer — human message -->
        <div class="panel-footer">
            <span><i class="fas fa-mug-hot"></i> you've got this</span>
            <div class="footer-actions">
                <span><i class="far fa-star"></i> focus</span>
            </div>
        </div>
    </div>

    <script src="todo.js"></script>
</body>
</html>

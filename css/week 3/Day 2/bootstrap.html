<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Bootstrap 5 · step‑by‑step lesson · grid · components · utilities</title>
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Bootstrap 5 CSS (CDN) - we use it for demonstration, but we also teach how to add it -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'Inter', system-ui, sans-serif;
            background: #0a0e1a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .presentation-wrapper {
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
        }
        .slide-container {
            background: #111827;
            border-radius: 2rem;
            border: 1px solid #2d3a5e;
            box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.6);
            overflow: hidden;
        }
        .slide-content {
            padding: 2.5rem 3rem;
            min-height: 600px;
            display: flex;
            flex-direction: column;
        }
        .slide-title {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff, #a5f3fc, #7aa9ff);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 0.6rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            border-left: 5px solid #7952b3;
            padding-left: 1.2rem;
        }
        .slide-sub {
            color: #9ca3cf;
            margin-bottom: 1.5rem;
            border-left: 5px solid #7952b3;
            padding-left: 1.2rem;
            font-size: 0.95rem;
        }
        .grid-2, .grid-3 {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            margin: 1rem 0;
        }
        .card {
            background: #1e293b;
            border-radius: 1.2rem;
            padding: 1.3rem;
            flex: 1;
            min-width: 220px;
            border: 1px solid #334155;
            transition: transform 0.2s;
        }
        .card h3 {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            color: #93c5fd;
            margin-bottom: 0.8rem;
            font-size: 1.2rem;
        }
        .card p, .card li {
            color: #e2e8f0;
            line-height: 1.5;
        }
        .code-block {
            background: #0a0f1c;
            padding: 1rem;
            border-radius: 1rem;
            font-family: 'Fira Code', 'Courier New', monospace;
            font-size: 0.8rem;
            overflow-x: auto;
            border-left: 4px solid #7952b3;
            margin: 1rem 0;
            color: #d1d5db;
        }
        .highlight {
            color: #fbbf24;
            font-weight: 600;
        }
        .insight {
            background: #1e293b;
            padding: 1rem 1.2rem;
            border-radius: 1rem;
            border-left: 4px solid #fbbf24;
            margin: 1rem 0;
            color: #e2e8f0;
        }
        .bootstrap-badge {
            background: #7952b3;
            color: white;
            padding: 0.2rem 0.8rem;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.3px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: #1e293b;
            border-radius: 1rem;
            overflow: hidden;
            margin: 1rem 0;
        }
        th, td {
            border: 1px solid #334155;
            padding: 0.7rem;
            text-align: left;
            color: #e2e8f0;
        }
        th {
            background: #0f172a;
            color: #fbbf24;
        }
        .nav-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            background: #0f172a;
            border-top: 1px solid #2d3a5e;
        }
        .nav-btn {
            background: #2d3a5e;
            border: none;
            padding: 0.6rem 1.8rem;
            border-radius: 3rem;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 0.9rem;
        }
        .nav-btn:hover:not(:disabled) {
            background: #7952b3;
            transform: scale(0.98);
        }
        .nav-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .slide-counter {
            background: #1e293b;
            padding: 0.4rem 1.2rem;
            border-radius: 2rem;
            font-size: 0.85rem;
            color: #cbd5e6;
        }
        .dot-indicators {
            display: flex;
            gap: 0.6rem;
            align-items: center;
        }
        .dot {
            width: 8px;
            height: 8px;
            background: #4b5563;
            border-radius: 10px;
            transition: 0.2s;
        }
        .dot.active {
            background: #7952b3;
            width: 24px;
        }
        .bs-component-demo {
            background: #1e293b;
            border-radius: 1rem;
            padding: 1rem;
            border: 1px solid #334155;
        }
        .bs-component-demo .btn {
            margin: 0.2rem;
        }
        footer {
            font-size: 0.7rem;
            text-align: center;
            margin-top: 1rem;
            color: #6b7280;
        }
        @media (max-width: 700px) {
            .slide-content { padding: 1.5rem; }
            .slide-title { font-size: 1.4rem; }
        }
    </style>
</head>
<body>
<div class="presentation-wrapper">
    <div class="slide-container">
        <div class="slide-content" id="slideContent"></div>
        <div class="nav-controls">
            <div class="dot-indicators" id="dotsContainer"></div>
            <div style="display: flex; gap: 1rem;">
                <button class="nav-btn" id="prevSlideBtn"><i class="fas fa-chevron-left"></i> Previous</button>
                <span class="slide-counter" id="slideCounter"></span>
                <button class="nav-btn" id="nextSlideBtn">Next <i class="fas fa-chevron-right"></i></button>
            </div>
        </div>
    </div>
    <footer><i class="fas fa-arrow-left"></i> <i class="fas fa-arrow-right"></i> Arrow keys · 14 slides · Bootstrap 5 step‑by‑step</footer>
</div>

<script>
    // ================================================================
    //  BOOTSTRAP 5 LESSON – step‑by‑step slides
    // ================================================================
    const slides = [
        // 0: Intro
        { title: "<i class='fab fa-bootstrap'></i> What is Bootstrap?", subtitle: "The world's most popular front‑end component library", content: `
            <div class="grid-2">
                <div class="card"><h3><i class="fas fa-rocket"></i> Why Bootstrap?</h3><p>Responsive, mobile‑first CSS framework. Pre‑built components, grid system, utilities. Speeds up development.</p></div>
                <div class="card"><h3><i class="fas fa-users"></i> Used by</h3><p>Millions of sites. Big names: NASA, Spotify, Twitter (before). Strong community.</p></div>
                <div class="card"><h3><i class="fas fa-boxes"></i> What's inside?</h3><p>CSS & JS. Grid, buttons, forms, navbars, cards, modals, tooltips, and more.</p></div>
            </div>
            <div class='insight'><span class='bootstrap-badge'>v5.3</span> Bootstrap 5 dropped jQuery, uses vanilla JS, and adds utility classes.</div>
        `},
        // 1: Step 1 – include CSS
        { title: "<i class='fas fa-link'></i> Step 1: Add Bootstrap CSS", subtitle: "CDN link – the easiest way to start", content: `
            <div class="code-block">&lt;!-- CSS only – add inside &lt;head&gt; --&gt;<br>&lt;link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"&gt;</div>
            <div class="grid-2">
                <div class="card"><h3><i class="fas fa-cloud-upload-alt"></i> CDN advantage</h3><p>No download. Always up‑to‑date. Cached globally → fast.</p></div>
                <div class="card"><h3><i class="fas fa-download"></i> Alternative</h3><p>Download Bootstrap from getbootstrap.com and link local file.</p></div>
            </div>
            <div class='insight'>Always place CSS link before your custom stylesheet to allow overrides.</div>
        `},
        // 2: Step 2 – JS (optional)
        { title: "<i class='fas fa-code'></i> Step 2: Add Bootstrap JavaScript", subtitle: "For interactive components (modals, dropdowns, etc.)", content: `
            <div class="code-block">&lt;!-- JavaScript – place before closing &lt;/body&gt; --&gt;<br>&lt;script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"&gt;&lt;/script&gt;</div>
            <div class="grid-2">
                <div class="card"><h3><i class="fas fa-cubes"></i> bundle vs separate</h3><p><span class='highlight'>bundle</span> includes Popper (needed for tooltips/popovers). Separate files also available.</p></div>
                <div class="card"><h3><i class="fas fa-mouse-pointer"></i> What it enables</h3><p>Dropdowns, modals, offcanvas, carousels, collapse, tooltips, popovers, toast, scrollspy, tab toggles.</p></div>
            </div>
            <div class='insight'>If you don't need interactive components, you can skip JS.</div>
        `},
        // 3: Step 3 – container & grid
        { title: "<i class='fas fa-th'></i> Step 3: Bootstrap Grid & Container", subtitle: "The foundation of responsive layouts", content: `
            <div class="code-block">&lt;div class="container"&gt;  &lt;!-- or container-fluid --&gt;<br>  &lt;div class="row"&gt;<br>    &lt;div class="col-sm-6"&gt;Left column&lt;/div&gt;<br>    &lt;div class="col-sm-6"&gt;Right column&lt;/div&gt;<br>  &lt;/div&gt;<br>&lt;/div&gt;</div>
            <div class="grid-2">
                <div class="card"><h3><i class="fas fa-arrows-alt-h"></i> container vs container-fluid</h3><p><span class='highlight'>container</span> = fixed max-width (responsive). <span class='highlight'>container-fluid</span> = full width.</p></div>
                <div class="card"><h3><i class="fas fa-columns"></i> Grid rules</h3><p>12 columns per row. Use col-*, col-sm-*, col-md-*, col-lg-*, col-xl-* to define breakpoints.</p></div>
            </div>
            <div class='insight'>Grid is mobile‑first: col-* applies to all sizes, col-sm-* kicks in at ≥576px.</div>
        `},
        // 4: Grid demo – live example
        { title: "<i class='fas fa-table'></i> Grid in action", subtitle: "Responsive columns adapt to screen size", content: `
            <div class="bs-component-demo">
                <div class="container-fluid p-0">
                    <div class="row g-2">
                        <div class="col-12 col-md-4"><div class="bg-primary text-white p-2 text-center rounded">col-12 col-md-4</div></div>
                        <div class="col-6 col-md-4"><div class="bg-success text-white p-2 text-center rounded">col-6 col-md-4</div></div>
                        <div class="col-6 col-md-4"><div class="bg-warning text-dark p-2 text-center rounded">col-6 col-md-4</div></div>
                    </div>
                    <div class="row g-2 mt-2">
                        <div class="col-6 col-lg-3"><div class="bg-info text-dark p-2 text-center rounded">col-6 col-lg-3</div></div>
                        <div class="col-6 col-lg-3"><div class="bg-info text-dark p-2 text-center rounded">col-6 col-lg-3</div></div>
                        <div class="col-6 col-lg-3"><div class="bg-info text-dark p-2 text-center rounded">col-6 col-lg-3</div></div>
                        <div class="col-6 col-lg-3"><div class="bg-info text-dark p-2 text-center rounded">col-6 col-lg-3</div></div>
                    </div>
                </div>
            </div>
            <div class='insight'>Resize your browser to see columns stack and reflow.</div>
        `},
        // 5: Typography & utilities
        { title: "<i class='fas fa-typography'></i> Bootstrap Typography & Utilities", subtitle: "Headings, display, text helpers", content: `
            <div class="grid-2">
                <div class="card"><h3>Headings</h3><div class="code-block">&lt;h1&gt;h1&lt;/h1&gt;<br>&lt;h1 class="display-1"&gt;Display 1&lt;/h1&gt;</div><p class="text-white">.display-* for larger, bolder headings.</p></div>
                <div class="card"><h3>Text utilities</h3><div><span class="text-primary">.text-primary</span> <span class="text-success">.text-success</span> <span class="text-warning">.text-warning</span> <span class="text-danger">.text-danger</span></div><div><span class="bg-dark p-1 text-white">.text-center</span> <span class="bg-dark p-1 text-white">.text-uppercase</span></div></div>
            </div>
            <div class="code-block">&lt;p class="text-center text-md-start text-lg-end"&gt;Responsive text alignment&lt;/p&gt;</div>
            <div class='insight'>Use .text-{breakpoint}-{align} for responsive text alignment.</div>
        `},
        // 6: Buttons & button groups
        { title: "<i class='fas fa-hand-pointer'></i> Buttons & Button Groups", subtitle: "Pre‑styled buttons with multiple variants", content: `
            <div class="bs-component-demo">
                <div>
                    <button class="btn btn-primary">Primary</button>
                    <button class="btn btn-secondary">Secondary</button>
                    <button class="btn btn-success">Success</button>
                    <button class="btn btn-danger">Danger</button>
                    <button class="btn btn-warning">Warning</button>
                    <button class="btn btn-info">Info</button>
                    <button class="btn btn-light">Light</button>
                    <button class="btn btn-dark">Dark</button>
                    <button class="btn btn-link">Link</button>
                </div>
                <div class="mt-2">
                    <button class="btn btn-outline-primary">Outline</button>
                    <button class="btn btn-outline-success">Outline</button>
                    <button class="btn btn-outline-danger">Outline</button>
                </div>
                <div class="mt-2">
                    <div class="btn-group" role="group">
                        <button class="btn btn-secondary">Left</button>
                        <button class="btn btn-secondary">Middle</button>
                        <button class="btn btn-secondary">Right</button>
                    </div>
                </div>
            </div>
            <div class='insight'>Use .btn-{variant} and .btn-outline-{variant}. Sizes: .btn-lg, .btn-sm.</div>
        `},
        // 7: Forms
        { title: "<i class='fas fa-edit'></i> Form controls", subtitle: "Styled inputs, selects, checks", content: `
            <div class="bs-component-demo">
                <div class="mb-2"><input type="text" class="form-control" placeholder=".form-control" value=""></div>
                <div class="mb-2"><select class="form-select"><option>Select option</option><option>2</option></select></div>
                <div class="mb-2"><div class="form-check"><input class="form-check-input" type="checkbox"><label class="form-check-label">Check me</label></div></div>
                <div><button class="btn btn-primary">Submit</button></div>
            </div>
            <div class="code-block">&lt;input class="form-control"&gt;<br>&lt;select class="form-select"&gt;<br>&lt;div class="form-check"&gt; ...</div>
            <div class='insight'>All form elements get consistent styling. Use .form‑control, .form‑select, .form‑check.</div>
        `},
        // 8: Cards
        { title: "<i class='fas fa-id-card'></i> Cards – flexible content containers", subtitle: "Bootstrap's versatile card component", content: `
            <div class="grid-2">
                <div class="card bg-dark text-white border-secondary" style="min-width: 200px;">
                    <div class="card-header">Header</div>
                    <div class="card-body"><h5 class="card-title">Card title</h5><p class="card-text">Some quick example text.</p><a href="#" class="btn btn-primary">Go somewhere</a></div>
                    <div class="card-footer">Footer</div>
                </div>
                <div class="card bg-dark text-white border-secondary" style="min-width: 200px;">
                    <div class="card-body"><h5 class="card-title">Image card</h5><p class="card-text">With image top, list groups, etc.</p></div>
                </div>
            </div>
            <div class="code-block">&lt;div class="card"&gt;<br>  &lt;div class="card-body"&gt;...&lt;/div&gt;<br>&lt;/div&gt;</div>
            <div class='insight'>Cards replace old panels, wells, thumbnails. Very flexible.</div>
        `},
        // 9: Navbar
        { title: "<i class='fas fa-bars'></i> Navbar – responsive navigation", subtitle: "Collapsible, responsive, with branding", content: `
            <div class="bs-component-demo">
                <nav class="navbar navbar-expand-lg navbar-dark bg-dark rounded">
                    <div class="container-fluid">
                        <a class="navbar-brand" href="#">Brand</a>
                        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarDemo">
                            <span class="navbar-toggler-icon"></span>
                        </button>
                        <div class="collapse navbar-collapse" id="navbarDemo">
                            <ul class="navbar-nav me-auto">
                                <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
                                <li class="nav-item"><a class="nav-link" href="#">Link</a></li>
                                <li class="nav-item dropdown">
                                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">Dropdown</a>
                                    <ul class="dropdown-menu"><li><a class="dropdown-item" href="#">Action</a></li></ul>
                                </li>
                            </ul>
                        </div>
                    </div>
                </nav>
            </div>
            <div class='insight'>Navbar collapses on smaller screens. .navbar-expand-{sm|md|lg|xl} sets breakpoint.</div>
        `},
        // 10: Components overview
        { title: "<i class='fas fa-cubes'></i> More components", subtitle: "Alerts, badges, progress, breadcrumb, pagination", content: `
            <div class="grid-2">
                <div class="card"><h3><i class="fas fa-exclamation-triangle"></i> Alerts</h3><div class="alert alert-success alert-dismissible fade show">Success alert <button type="button" class="btn-close" data-bs-dismiss="alert"></button></div></div>
                <div class="card"><h3><i class="fas fa-tag"></i> Badges</h3><span class="badge bg-primary">New</span> <span class="badge rounded-pill bg-danger">99+</span></div>
                <div class="card"><h3><i class="fas fa-chart-bar"></i> Progress</h3><div class="progress"><div class="progress-bar progress-bar-striped progress-bar-animated" style="width:70%">70%</div></div></div>
                <div class="card"><h3><i class="fas fa-chevron-right"></i> Breadcrumb</h3><nav><ol class="breadcrumb"><li class="breadcrumb-item"><a href="#">Home</a></li><li class="breadcrumb-item active">Library</li></ol></nav></div>
            </div>
            <div class='insight'>Dozens of ready‑to‑use components. Check Bootstrap docs for details.</div>
        `},
        // 11: Utilities – spacing, display, flex
        { title: "<i class='fas fa-tools'></i> Utility classes (spacing, flex, display)", subtitle: "Rapid layout without custom CSS", content: `
            <div class="code-block">/* margin & padding: {property}{sides}-{size} */<br>mt-3 = margin-top: 1rem<br>p-2 = padding: 0.5rem<br>mx-auto = margin-left/right: auto</div>
            <div class="grid-2">
                <div class="card"><h3><i class="fas fa-arrows-alt"></i> Spacing</h3><p>m = margin, p = padding. t,b,s,e,x,y. sizes: 0–5 (and auto). Example: <span class='highlight'>mb-4</span> = margin-bottom: 1.5rem.</p></div>
                <div class="card"><h3><i class="fas fa-arrows-alt-h"></i> Flex & display</h3><p>.d-flex, .d-none, .d-md-block. Flex: .justify-content-center, .align-items-center.</p></div>
            </div>
            <div class='insight'>Utility classes reduce the need for custom CSS. They are responsive: .mt-md-3 works.</div>
        `},
        // 12: Responsive breakpoints
        { title: "<i class='fas fa-mobile-alt'></i> Responsive breakpoints", subtitle: "Mobile‑first: sm, md, lg, xl, xxl", content: `
            <table><tr><th>Breakpoint</th><th>Class infix</th><th>Min width</th></tr>
            <tr><td>Small</td><td>sm</td><td>≥576px</td></tr>
            <tr><td>Medium</td><td>md</td><td>≥768px</td></tr>
            <tr><td>Large</td><td>lg</td><td>≥992px</td></tr>
            <tr><td>Extra large</td><td>xl</td><td>≥1200px</td></tr>
            <tr><td>XXL</td><td>xxl</td><td>≥1400px</td></tr>
            </table>
            <div class="code-block">&lt;div class="col-12 col-md-6 col-lg-4"&gt; ... &lt;/div&gt;</div>
            <div class='insight'>Use infix in utilities: .d-none .d-md-block .d-lg-flex etc.</div>
        `},
        // 13: Final – Summary & next steps
        { title: "<i class='fas fa-flag-checkered'></i> Bootstrap – next steps", subtitle: "You're ready to build responsive sites faster", content: `
            <div class="grid-2">
                <div class="card"><h3><i class="fas fa-graduation-cap"></i> Recap</h3><ul><li>Link CSS + JS (CDN or local)</li><li>Use container/row/col grid</li><li>Components: buttons, cards, navbar, forms</li><li>Utilities: spacing, flex, display, text</li></ul></div>
                <div class="card"><h3><i class="fas fa-book-open"></i> Learn more</h3><p>Official docs: <span class='highlight'>getbootstrap.com</span><br>Customize with Sass, use themes, explore JS plugins.</p></div>
            </div>
            <div class='insight'><i class="fas fa-heart" style="color:#d63384;"></i> Bootstrap makes front‑end development faster and more consistent. Practice building a real page!</div>
        `}
    ];

    // ---- navigation ----
    let currentIndex = 0;
    const totalSlides = slides.length;
    const slideContentDiv = document.getElementById('slideContent');
    const prevBtn = document.getElementById('prevSlideBtn');
    const nextBtn = document.getElementById('nextSlideBtn');
    const counterSpan = document.getElementById('slideCounter');
    const dotsContainer = document.getElementById('dotsContainer');

    function renderSlide(index) {
        const slide = slides[index];
        let contentHtml = `
            <div class="slide-title">${slide.title}</div>
            <div class="slide-sub"><i class="fas fa-angle-right"></i> ${slide.subtitle}</div>
            <div>${slide.content}</div>
        `;
        slideContentDiv.innerHTML = contentHtml;
        updateDots(index);
        prevBtn.disabled = (index === 0);
        nextBtn.disabled = (index === totalSlides - 1);
        counterSpan.innerHTML = `<i class="far fa-file-alt"></i> ${index+1} / ${totalSlides}`;
    }

    function updateDots(activeIdx) {
        dotsContainer.innerHTML = '';
        for (let i = 0; i < totalSlides; i++) {
            const dot = document.createElement('div');
            dot.classList.add('dot');
            if (i === activeIdx) dot.classList.add('active');
            dotsContainer.appendChild(dot);
        }
    }

    function nextSlide() { if (currentIndex < totalSlides - 1) { currentIndex++; renderSlide(currentIndex); } }
    function prevSlide() { if (currentIndex > 0) { currentIndex--; renderSlide(currentIndex); } }

    prevBtn.addEventListener('click', prevSlide);
    nextBtn.addEventListener('click', nextSlide);
    window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight') { e.preventDefault(); nextSlide(); }
        else if (e.key === 'ArrowLeft') { e.preventDefault(); prevSlide(); }
    });

    renderSlide(0);
</script>
</body>
</html>

        { q: "How to make a link open in a new browser tab?", a: "Add target='_blank' to the &lt;a&gt; tag: &lt;a href='url' target='_blank'&gt;" },
        { q: "Which CSS property sets the background color of an element?", a: "background-color (or background shorthand). Example: style='background-color:Tomato;'" },
        { q: "What is the difference between HEX #ff0000 and rgb(255,0,0)?", a: "They represent the same pure red color. HEX is base-16, RGB is decimal." },
        { q: "What does the &lt;abbr&gt; element do?", a: "Defines abbreviation; title attribute provides full expansion on hover." },
        { q: "Write an HSLA value with 50% opacity and pure red.", a: "hsla(0, 100%, 50%, 0.5) — hue 0 is red, saturation 100%, lightness 50%, alpha 0.5." },
        { q: "What is a relative URL vs absolute URL?", a: "Absolute = full path (https://example.com/page). Relative = path within same site (images/logo.png)." },
        { q: "How can you create a bookmark inside a webpage?", a: "Assign an id to an element (e.g., &lt;h2 id='tips'&gt;) and link using &lt;a href='#tips'&gt;." },
        { q: "Which HTML entity would you use to display the ampersand (&) in text?", a: "&amp;amp; — because bare & could break HTML parsing." }
    ];

    let currentIndex = 0;
    const totalSlides = slides.length;
    const slideArea = document.getElementById('slideArea');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const counterText = document.getElementById('counterText');
    const dotsContainer = document.getElementById('dotsContainer');

    function renderKnowledgeCheck() {
        const container = document.getElementById('checkContainer');
        if (!container) return;
        container.innerHTML = '';
        qaChecklist.forEach((item, idx) => {
            const qaDiv = document.createElement('div');
            qaDiv.className = 'qa-item';
            qaDiv.style.marginBottom = '0.8rem';
            qaDiv.style.background = '#131b2e';
            qaDiv.style.borderRadius = '1rem';
            qaDiv.style.overflow = 'hidden';
            qaDiv.innerHTML = `
                <div class="qa-question" data-idx="${idx}" style="background:#1a2338; cursor:pointer; padding:0.8rem 1rem; display:flex; justify-content:space-between;">
                    <span><strong>${idx+1}.</strong> ${item.q}</span>
                    <i class="fas fa-chevron-down"></i>
                </div>
                <div class="qa-answer" id="knowledge-ans-${idx}" style="max-height:0; overflow:hidden; transition:0.3s; padding:0 1rem; background:#0f172a;">
                    <p style="padding:0.6rem 0;">✅ <span class="highlight">Answer:</span> ${item.a}</p>
                </div>
            `;
            container.appendChild(qaDiv);
        });
        document.querySelectorAll('#checkContainer .qa-question').forEach(q => {
            q.addEventListener('click', (e) => {
                const idx = q.getAttribute('data-idx');
                const ansDiv = document.getElementById(`knowledge-ans-${idx}`);
                const icon = q.querySelector('i');
                if (ansDiv.classList.contains('show')) {
                    ansDiv.classList.remove('show');
                    ansDiv.style.maxHeight = '0';
                    ansDiv.style.padding = '0 1rem';
                    icon.style.transform = 'rotate(0deg)';
                } else {
                    ansDiv.classList.add('show');
                    ansDiv.style.maxHeight = '300px';
                    ansDiv.style.padding = '0.5rem 1rem';
                    icon.style.transform = 'rotate(180deg)';
                }
            });
        });
    }

    function renderSlide(index) {
        const slide = slides[index];
        const html = `<div class="slide-card"><div class="slide-title">${slide.title}</div><div class="slide-sub"><i class="fas fa-angle-right"></i> ${slide.subtitle}</div><div class="slide-content">${slide.content}</div></div>`;
        slideArea.innerHTML = html;
        if (index === 10) renderKnowledgeCheck();
        if (index === 8) {
            // ensure bookmark section visible but no extra action needed
            const special = document.getElementById('special-section');
            if(special) special.scrollIntoView({behavior: 'smooth', block: 'center'});
        }
        counterText.innerHTML = `<i class="far fa-file-alt"></i> ${index+1} / ${totalSlides}`;
        prevBtn.disabled = (index === 0);
        nextBtn.disabled = (index === totalSlides-1);
        updateDots(index);
    }

    function updateDots(activeIndex) {
        dotsContainer.innerHTML = '';
        for (let i = 0; i < totalSlides; i++) {
            const dot = document.createElement('div');
            dot.classList.add('dot');
            if (i === activeIndex) dot.classList.add('active');
            dotsContainer.appendChild(dot);
        }
    }
    function nextSlide() { if (currentIndex < totalSlides - 1) { currentIndex++; renderSlide(currentIndex); } }
    function prevSlide() { if (currentIndex > 0) { currentIndex--; renderSlide(currentIndex); } }
    window.addEventListener('keydown', (e) => { if(e.key === 'ArrowRight') nextSlide(); if(e.key === 'ArrowLeft') prevSlide(); });
    prevBtn.addEventListener('click', prevSlide);
    nextBtn.addEventListener('click', nextSlide);
    renderSlide(0);
</script>
</body>
</html>

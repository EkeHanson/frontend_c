<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Class 6: Semantic HTML5 & SEO Basics | Month 1 · Week 2</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;

        }
        .class-nav {
            max-width: 1300px;
            margin: 0 auto 1rem auto;
            background: #0f172a;
            border-radius: 1.5rem;
            padding: 0.8rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            border: 1px solid #334155;
            box-shadow: 0 10px 20px -5px rgba(0,0,0,0.3);
        }
        .nav-buttons-class {
            display: flex;
            gap: 0.8rem;
        }
        .nav-btn {
            background: #1e2a3a;
            border: none;
            padding: 0.5rem 1.2rem;
            border-radius: 2rem;
            color: #e2e8f0;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: 0.2s;
            text-decoration: none;
            border: 1px solid #334155;
        }
        .nav-btn.active {
            background: #3b82f6;
            border-color: #60a5fa;
        }
        .nav-btn:hover:not(.active) {
            background: #2d3a4e;
            transform: translateY(-2px);
        }
        .class-badge {
            background: #3b82f6;
            padding: 0.3rem 1rem;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: bold;
            color: white;
        }
        .presentation-container {
            max-width: 1300px;
            margin: 0 auto;
            background: rgba(255,255,255,0.03);
            border-radius: 2rem;
            backdrop-filter: blur(2px);
            box-shadow: 0 25px 45px rgba(0,0,0,0.4);
            overflow: hidden;
        }
        .slide-area {
            min-height: 580px;
            background: #0f1119;
            padding: 2rem;
        }
        .slide-card {
            background: rgba(22, 26, 38, 0.95);
            backdrop-filter: blur(4px);
            border-radius: 2rem;
            padding: 2rem 2.2rem;
            border: 1px solid rgba(72, 187, 255, 0.25);
        }
        .slide-title {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #E0F2FE, #7AA9FF);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 0.5rem;
            border-left: 5px solid #3b82f6;
            padding-left: 1.2rem;
        }
        .slide-sub {
            color: #8e9bb5;
            margin-bottom: 1.5rem;
            border-left: 5px solid #3b82f6;
            padding-left: 1.2rem;
            font-size: 0.9rem;
        }
        .content-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            margin-top: 1rem;
        }
        .concept-box {
            flex: 1;
            min-width: 240px;
            background: #1a1f2b;
            border-radius: 1.5rem;
            padding: 1.3rem;
            border: 1px solid #2d3748;
        }
        .concept-box h3 {
            color: #60a5fa;
            font-size: 1.25rem;
            margin-bottom: 0.8rem;
            display: flex;
            gap: 0.6rem;
            align-items: center;
        }
        pre {
            background: #0a0e17;
            padding: 1rem;
            border-radius: 1rem;
            overflow-x: auto;
            font-size: 0.75rem;
            color: #cbd5e1;
            margin-top: 0.8rem;
            border: 1px solid #2d3748;
        }
        .highlight {
            color: #facc15;
            font-weight: 500;
        }
        .tag {
            background: #2d3748;
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
            font-size: 0.7rem;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }
        .insight-card {
            margin-top: 1.2rem;
            background: #11161f;
            padding: 0.8rem 1.2rem;
            border-radius: 1rem;
            border-left: 3px solid #3b82f6;
            color: #b9d0ff;
        }
        .nav-bar {
            background: #0b0e16;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #2a2f3f;
        }
        .nav-buttons {
            display: flex;
            gap: 1rem;
        }
        button {
            background: #1e2a3a;
            border: none;
            padding: 0.5rem 1.5rem;
            border-radius: 2rem;
            color: #e2e8f0;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border: 1px solid #334155;
        }
        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .indicator-dots {
            display: flex;
            gap: 0.5rem;
        }
        .dot {
            width: 8px;
            height: 8px;
            background: #334155;
            border-radius: 10px;
        }
        .dot.active {
            background: #3b82f6;
            width: 22px;
        }
        footer {
            font-size: 0.7rem;
            text-align: center;
            padding: 0.7rem;
            background: #07090f;
            color: #5b6e8c;
        }
        .quiz-question {
            background: #0f172a;
            border-radius: 1rem;
            padding: 1rem;
            margin-bottom: 1rem;
        }
        @media (max-width: 700px) {
            .slide-area { padding: 1rem; }
            .slide-title { font-size: 1.4rem; }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

<div class="class-nav">
    <div><span class="class-badge"><i class="fas fa-calendar-week"></i> MONTH 1 · WEEK 2</span></div>
    <div class="nav-buttons-class">
        <a href="class-4-html-elements.htm" class="nav-btn"><i class="fas fa-code"></i> Class 4</a>
        <a href="class5.html" class="nav-btn"><i class="fas fa-file-alt"></i> Class 5</a>
        <a href="class6.html" class="nav-btn active"><i class="fas fa-globe"></i> Class 6</a>
    </div>
    <div><i class="fas fa-clock"></i> 3 Hours · Semantic HTML5 & SEO Basics</div>
</div>

<div class="presentation-container">
    <div class="slide-area" id="slideArea"></div>
    <div class="nav-bar">
        <div class="indicator-dots" id="dotsContainer"></div>
        <div class="nav-buttons">
            <button id="prevBtn"><i class="fas fa-chevron-left"></i> Prev</button>
            <span class="slide-counter" id="counterText">1 / 7</span>
            <button id="nextBtn">Next <i class="fas fa-chevron-right"></i></button>
        </div>
    </div>
    <footer><i class="fas fa-tasks"></i> Assignment: Build semantic company website + Week 2 Assessment Quiz</footer>
</div>

<script>
    const slides = [
        {
            title: "🏗️ What is Semantic HTML?",
            subtitle: "Elements that describe meaning, not just appearance",
            content: `<div class="content-grid"><div class="concept-box"><h3><i class="fas fa-tag"></i> Semantic vs Non-semantic</h3><p><span class="highlight">Semantic:</span> &lt;header&gt;, &lt;nav&gt;, &lt;article&gt;, &lt;section&gt;, &lt;footer&gt; — tells browser AND screen readers what content means.</p><p><span class="highlight">Non-semantic:</span> &lt;div&gt;, &lt;span&gt; — only for styling/layout, no meaning.</p></div><div class="concept-box"><h3><i class="fas fa-chart-line"></i> Why It Matters</h3><p>✓ SEO: Google understands page structure better<br>✓ Accessibility: Screen readers navigate by landmarks<br>✓ Maintainability: Code is self-documenting</p></div></div>`
        },
        {
            title: "📐 Structural Semantic Elements",
            subtitle: "header · nav · main · section · article · aside · footer",
            content: `<pre><code>&lt;header&gt; — Logo, navigation, intro content
&lt;nav&gt; — Primary navigation links
&lt;main&gt; — Main content (only ONE per page)
&lt;section&gt; — Thematic grouping of content
&lt;article&gt; — Self-contained, reusable content (blog post, card)
&lt;aside&gt; — Sidebar, related info, ads
&lt;footer&gt; — Copyright, links, legal info</code></pre><div class="insight-card"><i class="fas fa-info-circle"></i> A page can have multiple &lt;header&gt; or &lt;footer&gt; elements (one for page, one per section/article).</div>`
        },
        {
            title: "🎮 Interactive Elements & SEO Fundamentals",
            subtitle: "details · summary · dialog · How Google reads HTML",
            content: `<div class="content-grid"><div class="concept-box"><h3><i class="fas fa-chevron-circle-down"></i> details & summary</h3><pre><code>&lt;details&gt;
  &lt;summary&gt;Click to expand&lt;/summary&gt;
  &lt;p&gt;Hidden content revealed!&lt;/p&gt;
&lt;/details&gt;</code></pre></div><div class="concept-box"><h3><i class="fas fa-robot"></i> SEO Basics</h3><p>Google crawls HTML → looks for &lt;title&gt;, meta description, heading hierarchy (h1-h6), semantic structure, alt text, internal links.</p></div></div>`
        },
        {
            title: "♿ Accessibility & ARIA",
            subtitle: "Screen readers · alt text importance · ARIA roles",
            content: `<div class="insight-card"><i class="fas fa-universal-access"></i> <strong>Accessibility Core Principles:</strong><ul style="margin-top:0.5rem; margin-left:1.5rem;"><li>Every image MUST have descriptive alt text</li><li>Proper heading order (h1 → h2 → h3, never skip)</li><li>All forms need labels</li><li>Use semantic HTML before ARIA</li><li>ARIA roles: <code>aria-label</code>, <code>aria-hidden</code>, <code>role="navigation"</code></li></ul></div><div class="tag"><i class="fas fa-eye"></i> Screen readers announce semantic elements: "Navigation region", "Main content", "Footer"</div>`
        },
        {
            title: "📱 Open Graph & Social Sharing",
            subtitle: "Meta tags for Facebook, Twitter, LinkedIn",
            content: `<pre><code>&lt;meta property="og:title" content="TechCorp Nigeria"&gt;
&lt;meta property="og:description" content="We build world-class software"&gt;
&lt;meta property="og:image" content="https://techcorp.ng/og-image.jpg"&gt;
&lt;meta property="og:url" content="https://techcorp.ng"&gt;
&lt;meta name="twitter:card" content="summary_large_image"&gt;</code></pre><div class="insight-card"><i class="fab fa-facebook"></i> Open Graph tags control how your page appears when shared on social media — essential for marketing.</div>`
        },
        {
            title: "🏢 Complete Semantic Layout Example",
            subtitle: "TechCorp Nigeria — Company Website",
            content: `<pre style="font-size:0.7rem;"><code>&lt;body&gt;
  &lt;header&gt;
    &lt;nav&gt;&lt;a href="/"&gt;&lt;img src="logo.png" alt="TechCorp"&gt;&lt;/a&gt;
      &lt;ul&gt;&lt;li&gt;&lt;a href="/services"&gt;Services&lt;/a&gt;&lt;/li&gt;&lt;/ul&gt;
    &lt;/nav&gt;
  &lt;/header&gt;
  &lt;main&gt;
    &lt;section id="hero"&gt;&lt;h1&gt;Building Software That Scales&lt;/h1&gt;&lt;/section&gt;
    &lt;section id="services"&gt;
      &lt;h2&gt;Our Services&lt;/h2&gt;
      &lt;article&gt;&lt;h3&gt;Web Development&lt;/h3&gt;&lt;p&gt;Custom websites&lt;/p&gt;&lt;/article&gt;
    &lt;/section&gt;
    &lt;aside&gt;&lt;h2&gt;News&lt;/h2&gt;&lt;p&gt;Award Winner&lt;/p&gt;&lt;/aside&gt;
  &lt;/main&gt;
  &lt;footer&gt;&lt;p&gt;&copy; 2025 TechCorp&lt;/p&gt;&lt;/footer&gt;
&lt;/body&gt;</code></pre>`
        },
        {
            title: "📝 ASSIGNMENT + WEEK 2 QUIZ",
            subtitle: "Company Website Layout + 10-Question Assessment",
            content: `<div class="insight-card"><i class="fas fa-building"></i> <strong>Company Website Assignment:</strong><ul><li>Build semantic layout for Nigerian company</li><li>Include: header, nav, main, 3+ sections, aside, footer</li><li>All Open Graph meta tags + meta description</li><li>Every image has descriptive alt text</li><li>Navigation links using anchor IDs (href="#services")</li><li>BONUS: &lt;details&gt;/&lt;summary&gt; FAQ section</li></ul></div>
            <div class="quiz-question"><strong>Q1:</strong> What does the alt attribute do?<br>✓ Provides text description for screen readers and when image fails to load</div>
            <div class="quiz-question"><strong>Q2:</strong> Correct input for email? → &lt;input type="email"&gt;</div>
            <div class="quiz-question"><strong>Q3:</strong> Semantic HTML means → Elements that carry meaning about content</div>
            <div class="quiz-question"><strong>Q4:</strong> &lt;strong&gt; vs &lt;b&gt; → &lt;strong&gt; has semantic importance</div>
            <div class="quiz-question"><strong>Q5:</strong> Every input must have → A matching &lt;label&gt;</div>
            <div class="quiz-question"><strong>Q6:</strong> target="_blank" → Opens link in new tab</div>
            <div class="quiz-question"><strong>Q7:</strong> Top navigation/branding element → &lt;header&gt;</div>
            <div class="quiz-question"><strong>Q8:</strong> &lt;section&gt; vs &lt;article&gt; → article is self-contained independent content</div>
            <div class="quiz-question"><strong>Q9:</strong> required attribute → Prevents form submission if empty</div>
            <div class="quiz-question"><strong>Q10:</strong> &lt;fieldset&gt; → Groups related form controls with legend</div>
            <div class="tag" style="margin-top:0.8rem;"><i class="fas fa-check-double"></i> Submit all assignments before next class!</div>`
        }
    ];
    let currentIndex = 0;
    const total = slides.length;
    const slideArea = document.getElementById('slideArea');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const counter = document.getElementById('counterText');
    const dots = document.getElementById('dotsContainer');

    function render(idx) {
        const s = slides[idx];
        slideArea.innerHTML = `<div class="slide-card"><div class="slide-title">${s.title}</div><div class="slide-sub"><i class="fas fa-angle-right"></i> ${s.subtitle}</div>${s.content}</div>`;
        counter.innerText = `${idx+1}/${total}`;
        prevBtn.disabled = idx === 0;
        nextBtn.disabled = idx === total-1;
        dots.innerHTML = '';
        for(let i=0;i<total;i++){ let d = document.createElement('div'); d.classList.add('dot'); if(i===idx) d.classList.add('active'); dots.appendChild(d); }
    }
    prevBtn.onclick = () => { if(currentIndex>0) render(--currentIndex); };
    nextBtn.onclick = () => { if(currentIndex<total-1) render(++currentIndex); };
    render(0);
</script>
</body>
</html>

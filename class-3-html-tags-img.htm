 const fixedKnowledgeCheck = [
    { q: "What does the acronym HTML stand for?",

    { q: "Which meta tag is essential for proper mobile responsiveness and scaling?",

    { q: "Where is the best practice location to place &lt;script&gt; tags for better performance?", 
      a: "<strong>Just before the closing &lt;/body&gt; tag</strong> — This ensures HTML/CSS loads first, preventing render-blocking and 'element not found' errors." },
    
    { q: "What is the role of DNS in web browsing?", 
      a: "<strong>Domain Name System</strong> — Translates human-friendly domain names (like google.com) into IP addresses (like 142.250.190.46) that computers use to communicate." },
    
    { q: "What does the Live Server extension do in VS Code?",

    { q: "Explain block-level vs inline elements with an example.", 
      a: "<strong>Block elements</strong> take full width and start on new lines (e.g., &lt;div&gt;, &lt;p&gt;, &lt;h1&gt;). <strong>Inline elements</strong> take only needed width and flow with text (e.g., &lt;span&gt;, &lt;a&gt;, &lt;strong&gt;). Inline elements cannot contain block elements." },
    
    { q: "What HTML entity should you use to display the Nigerian Naira symbol (₦) reliably?",

    { q: "What HTTP status code indicates a successful request?",

    { q: "What is the DOM and why do developers care about it?", 
      a: "<strong>Document Object Model</strong> — An in-memory tree representation of the HTML document. JavaScript interacts with the DOM (not the HTML file) to dynamically change content, styles, and structure." }
];

        { q: "HTML is considered a programming language.", a: "False. HTML is a markup language — it structures content, but lacks logic and control flow of programming languages." },

        {

            content: `
                <ul class="mistake-list">
                    <li><strong>❌ Missing or wrong DOCTYPE</strong> — ✅ Always <code>&lt;!DOCTYPE html&gt;</code> as the very first line</li>
                    <li><strong>❌ Missing viewport meta tag</strong> — ✅ Add <code>&lt;meta name="viewport" content="width=device-width, initial-scale=1.0"&gt;</code></li>
                    <li><strong>❌ Images without alt text</strong> — ✅ Every <code>&lt;img&gt;</code> must have descriptive <code>alt</code> attribute</li>
                    <li><strong>❌ Unclosed tags</strong> — ✅ Validate at validator.w3.org</li>
                    <li><strong>❌ Using &lt;br&gt; for spacing</strong> — ✅ Use CSS margin/padding instead</li>
                    <li><strong>❌ Skipping heading levels</strong> — ✅ Use <code>&lt;h1&gt;</code> → <code>&lt;h2&gt;</code> → <code>&lt;h3&gt;</code> in order</li>
                    <li><strong>❌ Using bare & in text</strong> — ✅ Write <code>&amp;amp;</code> for ampersand</li>
                    <li><strong>❌ Nesting block inside inline</strong> — ✅ Never put <code>&lt;div&gt;</code> inside <code>&lt;span&gt;</code></li>
                    <li><strong>❌ Missing labels on form inputs</strong> — ✅ Every input needs associated <code>&lt;label&gt;</code></li>
                    <li><strong>❌ JS in &lt;head&gt; without defer</strong> — ✅ Place script before closing <code>&lt;/body&gt;</code> or add <code>defer</code></li>
                </ul>
                <div class="insight-card"><i class="fas fa-check-circle" style="color:#22c55e;"></i> <strong>Pro tip:</strong> Use the W3C validator (validator.w3.org) to catch these mistakes automatically!</div>
            `
        },
        {
            title: "<i class='fas fa-eye'></i> Complete Example: Personal Portfolio",
            subtitle: "Every concept from Class 3 in one page",
            content: `<pre><code>&lt;!DOCTYPE html&gt;... (full portfolio example with semantic HTML and meta tags)...&lt;/code&gt;</pre><div class="insight-card"><i class="fas fa-code"></i> Full example includes proper headings, alt attributes, semantic structure.</div>`
        },
        {
            title: "<i class='fas fa-tasks'></i> Assignment: Build Your First Webpage",
            subtitle: "Hands-on tasks to complete this class",
            content: `<div class="concept-box"><h3>📝 Assignment Tasks</h3><ul><li>✓ Create index.html with full boilerplate</li><li>✓ Add meta description, viewport, charset</li><li>✓ Validate with W3C validator</li></ul></div>`
        },
        {
            title: "<i class='fas fa-question-circle'></i> Knowledge Check",
            subtitle: "10 complete questions — click to toggle verified answers",
            content: `<div class="qa-section"><div class="qa-title"><i class="fas fa-question-circle"></i> 10 Essential HTML Questions (Click each to reveal correct answer)</div><div id="qa-container"></div></div>`
        },
        {
            title: "<i class='fas fa-clipboard-list'></i> Week 1 Assessment Quiz",
            subtitle: "10 questions covering Classes 1-3 — accurate & verified",
            content: `<div class="qa-section"><div class="qa-title"><i class="fas fa-pen"></i> Assessment Quiz (click to check answers)</div><div id="quiz-container"></div></div>`
        }
    ];

    let currentIndex = 0;
    const totalSlides = slides.length;
    const slideArea = document.getElementById('slideArea');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const counterText = document.getElementById('counterText');
    const dotsContainer = document.getElementById('dotsContainer');

    function renderKnowledgeCheck() {
        const container = document.getElementById('qa-container');
        if (!container) return;
        container.innerHTML = '';
        fixedKnowledgeCheck.forEach((item, idx) => {
            const div = document.createElement('div');
            div.className = 'qa-item';
            div.innerHTML = `
                <div class="qa-question" data-idx="${idx}">
                    <span><strong>${idx+1}.</strong> ${item.q}</span>
                    <i class="fas fa-chevron-down"></i>
                </div>
                <div class="qa-answer" id="knowledge-answer-${idx}">
                    <p>✅ <span class="highlight">Correct answer:</span> ${item.a}</p>
                </div>
            `;
            container.appendChild(div);
        });
        document.querySelectorAll('#qa-container .qa-question').forEach(q => {
            q.addEventListener('click', (e) => {
                const idx = q.getAttribute('data-idx');
                const ansDiv = document.getElementById(`knowledge-answer-${idx}`);
                const icon = q.querySelector('i');
                ansDiv.classList.toggle('show');
                icon.style.transform = ansDiv.classList.contains('show') ? 'rotate(180deg)' : 'rotate(0deg)';
            });
        });
    }

    function renderQuizAssessment() {
        const container = document.getElementById('quiz-container');
        if (!container) return;
        container.innerHTML = '';
        fixedQuizData.forEach((item, idx) => {
            const div = document.createElement('div');
            div.className = 'qa-item';
            div.innerHTML = `
                <div class="qa-question" data-idx="${idx}">
                    <span><strong>${idx+1}.</strong> ${item.q}</span>
                    <i class="fas fa-chevron-down"></i>
                </div>
                <div class="qa-answer" id="quiz-ans-${idx}">
                    <p>📘 <span class="highlight">Answer:</span> ${item.a}</p>
                </div>
            `;
            container.appendChild(div);
        });
        document.querySelectorAll('#quiz-container .qa-question').forEach(q => {
            q.addEventListener('click', () => {
                const idx = q.getAttribute('data-idx');
                const ansDiv = document.getElementById(`quiz-ans-${idx}`);
                const icon = q.querySelector('i');
                ansDiv.classList.toggle('show');
                icon.style.transform = ansDiv.classList.contains('show') ? 'rotate(180deg)' : 'rotate(0deg)';
            });
        });
    }

    function renderSlide(index) {
        const slide = slides[index];
        const html = `<div class="slide-card"><div class="slide-title">${slide.title}</div><div class="slide-sub"><i class="fas fa-angle-right"></i> ${slide.subtitle}</div><div class="slide-content">${slide.content}</div></div>`;
        slideArea.innerHTML = html;
        if (index === 8) renderKnowledgeCheck();
        if (index === 9) renderQuizAssessment();
        counterText.innerHTML = `<i class="far fa-file-alt"></i> ${index+1} / ${totalSlides}`;
        prevBtn.disabled = (index === 0);
        nextBtn.disabled = (index === totalSlides-1);
        updateDots(index);
    }

    function updateDots(activeIndex) {
        dotsContainer.innerHTML = '';
        for (let i = 0; i < totalSlides; i++) {
            const dot = document.createElement('div');
            dot.classList.add('dot');
            if (i === activeIndex) dot.classList.add('active');
            dotsContainer.appendChild(dot);
        }
    }
    function nextSlide() { if (currentIndex < totalSlides-1) { currentIndex++; renderSlide(currentIndex); } }
    function prevSlide() { if (currentIndex > 0) { currentIndex--; renderSlide(currentIndex); } }
    window.addEventListener('keydown', (e) => { if(e.key === 'ArrowRight') nextSlide(); if(e.key === 'ArrowLeft') prevSlide(); });
    prevBtn.addEventListener('click', prevSlide);
    nextBtn.addEventListener('click', nextSlide);
    renderSlide(0);
</script>
</body>
</html>

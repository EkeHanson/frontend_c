<!-- React for the useEffect demo slide -->
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
  // --- GitHub fetch function (async/await) ---
  const fetchGitHubUsers = async (since = 0) => {
    const res = await fetch(`https://api.github.com/users?since=${since}&per_page=24`);
    if (!res.ok) throw new Error(`GitHub API error: ${res.status}`);
    return res.json();
  };

  // --- useEffect Demo component (for slide 6) ---
  function UseEffectDemo() {
    const [users, setUsers] = React.useState([]);
    const [loading, setLoading] = React.useState(true);
    const [error, setError] = React.useState(null);
    const [since, setSince] = React.useState(0);

    React.useEffect(() => {
      let mounted = true;
      const loadUsers = async () => {
        setLoading(true);
        setError(null);
        try {
          const data = await fetchGitHubUsers(since);
          if (mounted) setUsers(data);
        } catch (err) {
          if (mounted) setError(err.message);
        } finally {
          if (mounted) setLoading(false);
        }
      };
      loadUsers();
      return () => { mounted = false; };
    }, [since]);

    let body;
    if (loading) {
      body = (
        <div className="loading-spinner">
          <i className="fas fa-spinner fa-pulse"></i>
          <span>Loading GitHub users...</span>
        </div>
      );
    } else if (error) {
      body = (
        <div className="error-box">
          <i className="fas fa-exclamation-circle"></i>
          <div><strong>Error:</strong> {error}</div>
        </div>
      );
    } else {
      body = (
        <div className="card-grid">
          {users.map(u => (
            <div key={u.id} className="user-card">
              <img src={u.avatar_url} alt={u.login} loading="lazy" />
              <div className="login">{u.login}</div>
              <div className="id">ID: {u.id}</div>
              <span className="type"><i className="fas fa-user"></i> {u.type}</span>
              <br />
              <a href={u.html_url} target="_blank" rel="noopener noreferrer">
                <i className="fab fa-github"></i> profile
              </a>
            </div>
          ))}
        </div>
      );
    }

    return (
      <div>
        <div className="status-bar">
          <span className="status-badge"><i className="fas fa-users"></i> {users.length} users</span>
          <span className="status-badge"><i className="fas fa-arrow-right"></i> since={since}</span>
          <button className="btn" onClick={() => setSince(s => s + 24)} disabled={loading}>
            <i className="fas fa-forward"></i> next page
          </button>
        </div>
        {body}
        <div style={{ marginTop: '1.2rem', background: '#0f172a', borderRadius: '1rem', padding: '0.8rem 1.2rem', border: '1px solid #2d3a5e' }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: '0.6rem', color: '#fbbf24', marginBottom: '0.3rem' }}>
            <i className="fas fa-code"></i> <span style={{ fontWeight: 600 }}>useEffect with async/await</span>
          </div>
          <div className="code-block">
            <code>{`useEffect(() => {
  let mounted = true;
  const load = async () => {
    try {
      const data = await fetch(\`https://api.github.com/users?since=\${since}\`);
      if (mounted) setUsers(data);
    } catch (e) { if (mounted) setError(e.message); }
  };
  load();
  return () => { mounted = false; };
}, [since]);`}</code>
          </div>
          <div style={{ fontSize: '0.75rem', color: '#94a3b8', marginTop: '0.3rem' }}>
            <i className="fas fa-check-circle" style={{ color: '#4ade80' }}></i> cleanup prevents memory leaks &nbsp;|&nbsp;
            <i className="fas fa-arrows-rotate" style={{ color: '#61dafb' }}></i> re‑runs when <code style={{ background: '#1a1f2e', padding: '0.1rem 0.4rem', borderRadius: '0.3rem' }}>since</code> changes
          </div>
        </div>
      </div>
    );
  }

  // --- Slides data ---
  const slides = [
    {
      title: "<i class='fas fa-water'></i> useEffect: the side‑effect hook",
      subtitle: "Sync your component with the outside world",
      content: `
        <div class="content-grid">
          <div class="concept-box"><h3><i class="fas fa-question-circle"></i> What is useEffect?</h3>
            <p>useEffect lets you perform <span class="highlight">side effects</span> in function components: fetching data, timers, DOM updates, subscriptions.</p>
            <p>It runs <span class="highlight">after</span> the component renders. You control when it re‑runs with the <strong>dependencies array</strong>.</p>
          </div>
          <div class="concept-box"><h3><i class="fas fa-cog"></i> Syntax</h3>
            <pre><code>useEffect(() => {
  // side effect code
  return () => { /* cleanup */ };
}, [dependencies]);</code></pre>
            <p>Empty deps <code>[]</code> = run only once (mount). No deps = run after every render.</p>
          </div>
        </div>
        <div class="insight-card"><i class="fas fa-bolt"></i> <span class="tag">key insight</span> useEffect is the place for <strong>imperative</strong> code inside declarative React.</div>
      `
    },
    {
      title: "<i class='fas fa-cloud-download-alt'></i> Real‑world: Fetch data (API)",
      subtitle: "Get posts from a public API on mount",
      content: `
        <div class="two-column-split">
          <div class="col"><h4><i class="fas fa-code"></i> Example: fetch posts</h4>
            <pre><code>useEffect(() => {
  fetch('https://jsonplaceholder.typicode.com/posts')
    .then(res => res.json())
    .then(data => setPosts(data));
}, []); // empty deps → once</code></pre>
            <p>✅ <span class="highlight">Loading</span> state + <span class="highlight">error</span> handling make it production‑ready.</p>
          </div>
          <div class="col"><h4><i class="fas fa-exclamation-triangle"></i> Common pitfalls</h4>
            <ul style="margin-left:1.2rem; color:#e2e8f0;">
              <li>❌ Forgetting dependencies → stale closure</li>
              <li>❌ No cleanup → memory leaks</li>
              <li>✅ Use <span class="highlight">AbortController</span> to cancel fetch</li>
            </ul>
          </div>
        </div>
        <div class="insight-card"><i class="fas fa-globe"></i> <strong>Real‑world use:</strong> dashboard widgets, user profiles, product lists — every data‑driven app uses useEffect for fetching.</div>
      `
    },
    {
      title: "<i class='fas fa-search'></i> Search with debounce",
      subtitle: "User typing → API call after delay (real‑world search)",
      content: `
        <div class="two-column-split">
          <div class="col"><h4><i class="fas fa-clock"></i> Debounce pattern</h4>
            <pre><code>useEffect(() => {
  const timer = setTimeout(() => {
    if (query) fetchResults(query);
  }, 500); // wait 500ms
  return () => clearTimeout(timer);
}, [query]); // re-run when query changes</code></pre>
            <p>🚀 Prevents API spam while user types. Used in search bars, autocomplete, live filters.</p>
          </div>
          <div class="col"><h4><i class="fas fa-play"></i> Live example</h4>
            <p>Every keystroke clears the previous timer. Only the final value triggers the fetch.</p>
            <p><span class="highlight">Cleanup</span> is crucial here — without it, stale requests would flood the network.</p>
          </div>
        </div>
      `
    },
    {
      title: "<i class='fas fa-plug'></i> Subscriptions & event listeners",
      subtitle: "Window resize, scroll, WebSocket, keyboard events",
      content: `
        <div class="two-column-split">
          <div class="col"><h4><i class="fas fa-arrows-alt-h"></i> Window resize</h4>
            <pre><code>useEffect(() => {
  const handleResize = () => setWidth(window.innerWidth);
  window.addEventListener('resize', handleResize);
  return () => window.removeEventListener('resize', handleResize);
}, []); // one-time setup</code></pre>
            <p>Cleanup prevents listeners piling up on re‑renders.</p>
          </div>
          <div class="col"><h4><i class="fas fa-satellite-dish"></i> WebSocket / real‑time</h4>
            <pre><code>useEffect(() => {
  const ws = new WebSocket('wss://api.example.com');
  ws.onmessage = (e) => setMessages(prev => [...prev, e.data]);
  return () => ws.close();
}, []);</code></pre>
          </div>
        </div>
        <div class="insight-card"><i class="fas fa-headset"></i> <strong>Real apps:</strong> chat, live sports, stock tickers, collaborative editors all use subscriptions inside useEffect.</div>
      `
    },
    {
      title: "<i class='fas fa-code'></i> The Display Code: Rendering Users",
      subtitle: "How we show the GitHub users in the UI",
      content: `
        <div class="two-column-split">
          <div class="col"><h4><i class="fas fa-desktop"></i> JSX Display Logic</h4>
            <pre><code>// Display the users as cards
{users.map(u => (
  &lt;div key={u.id} className="user-card"&gt;
    &lt;img src={u.avatar_url} alt={u.login} /&gt;
    &lt;div className="login"&gt;{u.login}&lt;/div&gt;
    &lt;div className="id"&gt;ID: {u.id}&lt;/div&gt;
    &lt;span className="type"&gt;
      &lt;i className="fas fa-user"&gt;&lt;/i&gt; {u.type}
    &lt;/span&gt;
    &lt;a href={u.html_url} target="_blank"&gt;
      &lt;i className="fab fa-github"&gt;&lt;/i&gt; profile
    &lt;/a&gt;
  &lt;/div&gt;
))}</code></pre>
          </div>
          <div class="col"><h4><i class="fas fa-file-alt"></i> Complete Component</h4>
            <pre><code>function UseEffectDemo() {
  const [users, setUsers] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [since, setSince] = useState(0);

  useEffect(() => {
    let mounted = true;
    const loadUsers = async () => {
      setLoading(true);
      try {
        const data = await fetchGitHubUsers(since);
        if (mounted) setUsers(data);
      } catch (err) {
        if (mounted) setError(err.message);
      } finally {
        if (mounted) setLoading(false);
      }
    };
    loadUsers();
    return () => { mounted = false; };
  }, [since]);

  // Loading, Error, or User Cards
  if (loading) return &lt;LoadingSpinner /&gt;;
  if (error) return &lt;ErrorBox error={error} /&gt;;
  return &lt;UserGrid users={users} /&gt;;
}</code></pre>
          </div>
        </div>
        <div class="insight-card"><i class="fas fa-lightbulb"></i> <strong>Key takeaway:</strong> The display logic handles three states — <span class="highlight">loading</span>, <span class="highlight">error</span>, and <span class="highlight">success</span> — providing a smooth user experience.</div>
      `
    },
    {

}, [theme]); // runs on every theme change</code></pre>

}, []);</code></pre>

    fetchStatus(); // refresh data
  }, 5000); // every 5s
  return () => clearInterval(interval);
}, []);</code></pre>
            <p>📈 Used in dashboards, live scores, order tracking, crypto prices.</p>
          </div>
          <div class="col"><h4><i class="fas fa-stop"></i> Conditional polling</h4>
            <pre><code>useEffect(() => {
  if (!isActive) return;
  const id = setInterval(poll, 3000);
  return () => clearInterval(id);
}, [isActive]); // stop when inactive</code></pre>

    },
    {
      title: "<i class='fas fa-camera'></i> Cleanup: why it matters",
      subtitle: "Avoid memory leaks and stale data",
      content: `
        <div class="extensions-grid">
          <div class="ext-card"><i class="fas fa-broom"></i> <strong>Cleanup runs:</strong> before the effect runs again, and on unmount.</div>
          <div class="ext-card"><i class="fas fa-skull"></i> <strong>Without cleanup:</strong> multiple timers, listeners, sockets = performance disaster.</div>
          <div class="ext-card"><i class="fas fa-check-circle"></i> <strong>Always cleanup:</strong> intervals, subscriptions, fetch abort, event listeners.</div>
        </div>
        <div class="concept-box"><h3><i class="fas fa-code"></i> AbortController for fetch</h3>
          <pre><code>useEffect(() => {
  const controller = new AbortController();
  fetch(url, { signal: controller.signal })
    .then(res => res.json())
    .then(setData)
    .catch(e => if (e.name !== 'AbortError') setError(e));
  return () => controller.abort();
}, [url]);</code></pre>
          <p>⚡ Cancels pending request when dependency changes or component unmounts.</p>
        </div>
      `
    },
    {
      title: "<i class='fas fa-cubes'></i> useEffect vs useLayoutEffect",
      subtitle: "When to use which (real‑world difference)",
      content: `
        <div class="two-column-split">
          <div class="col"><h4><i class="fas fa-paint-brush"></i> useEffect</h4>
            <p>Runs <span class="highlight">after</span> the browser paints. Use for most side effects: data fetching, subscriptions, timers.</p>
            <p>✅ Does <strong>not</strong> block painting → better performance.</p>
          </div>
          <div class="col"><h4><i class="fas fa-ruler-combined"></i> useLayoutEffect</h4>
            <p>Runs <span class="highlight">before</span> the browser paints. Use for DOM measurements or mutations that need to be synchronous.</p>
            <p>🔧 Examples: tooltip position, scroll position, animation measurements.</p>
          </div>
        </div>
        <div class="insight-card"><i class="fas fa-lightbulb"></i> <strong>Rule of thumb:</strong> start with useEffect. Only switch to useLayoutEffect if you see visual flicker.</div>
      `

        <div class="insight-card"><i class="fas fa-rocket"></i> <strong>Pro tip:</strong> always think about the cleanup — your future self will thank you.</div>

  const qaData = [
    { q: "You're building a search bar. How would you avoid making an API call on every keystroke?", a: "Use useEffect with a debounce timer (setTimeout). Cleanup clears the timer on each keystroke, so the API call only happens after the user stops typing for a set delay (e.g., 300ms)." },
    { q: "How do you fetch data from an API when a component mounts, and handle loading/error states?", a: "Use useEffect with empty dependencies []. Inside, set loading=true, fetch the data, then set data and loading=false. Use try/catch for errors. Optionally use AbortController for cleanup." },
    { q: "What is the purpose of the cleanup function in useEffect? Give an example.", a: "Cleanup runs before the effect re-runs and on unmount. It prevents memory leaks. Example: clearing a timer, removing an event listener, closing a WebSocket, or aborting a fetch request." },
    { q: "How would you persist a user's theme preference in localStorage using useEffect?", a: "Use useEffect with [theme] as dependency. Inside, call localStorage.setItem('theme', theme). This saves the theme every time it changes. To load on mount, use another useEffect with [] that reads from localStorage and sets the state." },
    { q: "When would you use useLayoutEffect instead of useEffect?", a: "useLayoutEffect runs before painting. Use it when you need to measure DOM elements or make synchronous updates to avoid visual flicker — e.g., positioning a tooltip or measuring an element's size for animation." },
    { q: "How do you implement polling (e.g., live updates) with useEffect?", a: "Use setInterval inside useEffect. Return a cleanup that clears the interval. Optionally, conditionally start/stop based on a state (e.g., isPolling) by adding it to the dependencies array." },
    { q: "What happens if you omit the dependencies array in useEffect?", a: "The effect runs after every render. This can cause performance issues and infinite loops if you update state inside the effect without conditions." },
    { q: "How can you cancel a fetch request in useEffect?", a: "Use AbortController. Create a controller, pass its signal to fetch. In the cleanup function, call controller.abort(). This cancels the request if the component unmounts or dependencies change." },
    { q: "You have a component that subscribes to a WebSocket. How do you manage the connection lifecycle with useEffect?", a: "Inside useEffect, create the WebSocket instance. Set up event listeners (onmessage, onopen). Return a cleanup that closes the WebSocket (ws.close()). Use empty deps [] to connect once on mount." }
  ];

  let currentIndex = 0;
  const totalSlides = slides.length;
  const slideArea = document.getElementById('slideArea');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const counterText = document.getElementById('counterText');
  const dotsContainer = document.getElementById('dotsContainer');

  function renderQA() {
    const container = document.getElementById('qa-container');
    if (!container) return;
    container.innerHTML = '';
    qaData.forEach((item, idx) => {
      const qaDiv = document.createElement('div');
      qaDiv.className = 'qa-item';
      qaDiv.innerHTML = `
        <div class="qa-question" data-idx="${idx}">
          <span><strong>${idx+1}.</strong> ${item.q}</span>
          <i class="fas fa-chevron-down"></i>
        </div>
        <div class="qa-answer" id="answer-${idx}">
          <p>${item.a}</p>
        </div>
      `;
      container.appendChild(qaDiv);
    });
    document.querySelectorAll('.qa-question').forEach(question => {
      question.addEventListener('click', function() {
        const idx = this.getAttribute('data-idx');
        const answerDiv = document.getElementById(`answer-${idx}`);
        const icon = this.querySelector('i');
        answerDiv.classList.toggle('show');
        icon.style.transform = answerDiv.classList.contains('show') ? 'rotate(180deg)' : 'rotate(0deg)';
      });
    });
  }

  function renderSlide(index) {
    const slide = slides[index];
    let html = `
      <div class="slide-card">
        <div class="slide-title">${slide.title}</div>
        <div class="slide-sub"><i class="fas fa-angle-right"></i> ${slide.subtitle}</div>
        <div class="slide-content">${slide.content}</div>
      </div>
    `;
    slideArea.innerHTML = html;

    // If it's the useEffect demo slide, mount React component
    if (index === 5) {
      const demoRoot = document.getElementById('useEffectDemoRoot');
      if (demoRoot) {
        const root = ReactDOM.createRoot(demoRoot);
        root.render(<UseEffectDemo />);
      }
    }

    if (index === 11) renderQA();
    counterText.innerHTML = `<i class="far fa-file-alt"></i> ${index+1} / ${totalSlides}`;
    prevBtn.disabled = (index === 0);
    nextBtn.disabled = (index === totalSlides-1);
    updateDots(index);
  }

  function updateDots(activeIndex) {
    dotsContainer.innerHTML = '';
    for (let i = 0; i < totalSlides; i++) {
      const dot = document.createElement('div');
      dot.classList.add('dot');
      if (i === activeIndex) dot.classList.add('active');
      dotsContainer.appendChild(dot);
    }
  }

  function nextSlide() { if (currentIndex < totalSlides - 1) { currentIndex++; renderSlide(currentIndex); } }
  function prevSlide() { if (currentIndex > 0) { currentIndex--; renderSlide(currentIndex); } }
  function handleKeyDown(e) {
    if (e.key === 'ArrowRight') { e.preventDefault(); nextSlide(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); prevSlide(); }
  }

  prevBtn.addEventListener('click', prevSlide);
  nextBtn.addEventListener('click', nextSlide);
  window.addEventListener('keydown', handleKeyDown);
  renderSlide(0);
</script>

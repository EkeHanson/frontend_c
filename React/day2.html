        .qa-title {
            font-size: 1.3rem;

            color: #fcd34d;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;

        }
        .qa-item {
            background: #131b2e;
            border-radius: 1rem;
            margin-bottom: 0.8rem;
            overflow: hidden;
            border: 1px solid #2d3a5e;

        .qa-question {
            padding: 1rem 1.2rem;
            background: #1a2338;

            display: flex;
            justify-content: space-between;

        .qa-answer.show {

        .qa-answer p {

        .nav-bar {
            background: #0b0e16;

            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #2a2f3f;
            flex-wrap: wrap;
            gap: 0.8rem;
        }

        .nav-buttons {
            display: flex;
            gap: 1rem;
        }

        button {

            font-size: 1rem;

            padding: 0.5rem 1.5rem;

        button:disabled {

        .slide-counter {

        .indicator-dots {
            display: flex;

            background: #334155;

        .dot.active {

        footer {

        footer a:hover {

        @media (max-width: 700px) {
            .slide-area { padding: 1rem; }

    </style>
</head>

<div class="presentation-container">
    <div class="slide-area" id="slideArea"></div>
    <div class="nav-bar">
        <div class="indicator-dots" id="dotsContainer"></div>
        <div class="nav-buttons">

        </div>

        <i class="fab fa-react"></i> React · Lifecycle · Forms · Thinking in React · Advanced Hooks
        <span style="margin-left: 1rem;">| <a href="#"><i class="fas fa-arrow-left"></i> Day 1</a> | <a href="#">Day 3 <i class="fas fa-arrow-right"></i></a></span>

</div>

<script>
    const slides = [
        {
            title: "<i class='fas fa-sync-alt'></i> Component Lifecycle (Functional)",
            subtitle: "useEffect as the lifecycle manager",
            content: `
                <div class="two-column-split">
                    <div class="col"><h4><i class="fas fa-play"></i> Mounting</h4>
                        <pre><code>useEffect(() => {
  console.log('Component mounted');
  // fetch data, subscriptions
}, []);</code></pre>
                        <p>Runs <span class="highlight">once</span> after the component is inserted into the DOM.</p>
                    </div>
                    <div class="col"><h4><i class="fas fa-edit"></i> Updating</h4>
                        <pre><code>useEffect(() => {
  console.log('Count changed:', count);
}, [count]);</code></pre>
                        <p>Runs when <span class="highlight">dependencies</span> change (re-render).</p>
                    </div>
                </div>
                <div class="two-column-split">
                    <div class="col"><h4><i class="fas fa-times"></i> Unmounting</h4>
                        <pre><code>useEffect(() => {
  const timer = setInterval(...);
  return () => {
    clearInterval(timer);
    console.log('Cleanup');
  };
}, []);</code></pre>
                        <p>Return function runs <span class="highlight">before</span> component is removed.</p>
                    </div>
                    <div class="col"><h4><i class="fas fa-sync"></i> All together</h4>
                        <p>useEffect combines <span class="highlight">componentDidMount, componentDidUpdate, componentWillUnmount</span> in one API.</p>
                    </div>
                </div>
                <div class="insight-card"><i class="fas fa-lightbulb"></i> <span class="tag">key insight</span> The dependency array controls when useEffect runs. An empty array = run once (mount).</div>
            `
        },
        {
            title: "<i class='fas fa-check-double'></i> Conditional Rendering",
            subtitle: "Show different UI based on state/props",
            content: `
                <div class="content-grid">
                    <div class="concept-box"><h3><i class="fas fa-code-branch"></i> if / else</h3>
                        <pre><code>function Greeting({ isLoggedIn }) {
  if (isLoggedIn) {
    return &lt;h1&gt;Welcome back!&lt;/h1&gt;;
  }
  return &lt;h1&gt;Please sign in.&lt;/h1&gt;;
}</code></pre>
                    </div>
                    <div class="concept-box"><h3><i class="fas fa-question-circle"></i> Ternary operator</h3>
                        <pre><code>&lt;div&gt;
  {isLoggedIn ? &lt;Logout /&gt; : &lt;Login /&gt;}
&lt;/div&gt;</code></pre>
                    </div>
                </div>
                <div class="two-column-split">
                    <div class="col"><h4><i class="fas fa-and"></i> Logical &&</h4>
                        <pre><code>&lt;div&gt;
  {unreadMessages.length > 0 && &lt;Alert /&gt;}
&lt;/div&gt;</code></pre>
                    </div>
                    <div class="col"><h4><i class="fas fa-ban"></i> Prevent rendering</h4>
                        <pre><code>function Warning({ show }) {
  if (!show) return null; // component hides
  return &lt;div&gt;Warning!&lt;/div&gt;;
}</code></pre>
                    </div>
                </div>
            `
        },
        {
            title: "<i class='fas fa-list'></i> Rendering Lists",
            subtitle: "map, filter, keys and best practices",
            content: `
                <div class="two-column-split">
                    <div class="col"><h4><i class="fas fa-map"></i> .map()</h4>
                        <pre><code>const todos = ['Learn React', 'Build App'];
return (
  &lt;ul&gt;
    {todos.map((todo, index) => (
      &lt;li key={index}&gt;{todo}&lt;/li&gt;
    ))}
  &lt;/ul&gt;
);</code></pre>
                    </div>
                    <div class="col"><h4><i class="fas fa-key"></i> Keys</h4>
                        <ul style="margin-left:1.2rem;">
                            <li>Keys help React identify <span class="highlight">which items changed</span></li>
                            <li>Use <span class="highlight">unique, stable</span> IDs (not index if possible)</li>
                            <li>Keys only need to be unique among <span class="highlight">siblings</span></li>
                        </ul>
                        <pre><code>// good
{todos.map(todo => &lt;Todo key={todo.id} {...todo} /&gt;)}</code></pre>
                    </div>
                </div>
                <div class="insight-card"><i class="fas fa-exclamation-triangle"></i> <strong>Avoid</strong> using index as key if items can reorder — it causes bugs with state.</div>
            `
        },
        {
            title: "<i class='fas fa-edit'></i> Forms in React",
            subtitle: "Controlled vs uncontrolled components",
            content: `
                <div class="two-column-split">
                    <div class="col"><h4><i class="fas fa-sliders-h"></i> Controlled</h4>
                        <pre><code>function Form() {
  const [name, setName] = useState('');
  return (
    &lt;input
      value={name}
      onChange={e => setName(e.target.value)}
    /&gt;
  );
}</code></pre>
                        <p>React state is the <span class="highlight">single source of truth</span>.</p>
                    </div>
                    <div class="col"><h4><i class="fas fa-unlink"></i> Uncontrolled</h4>
                        <pre><code>function Form() {
  const inputRef = useRef(null);
  const handleSubmit = () => {
    alert(inputRef.current.value);
  };
  return &lt;input ref={inputRef} /&gt;;
}</code></pre>
                        <p>DOM handles value, use ref to read it.</p>
                    </div>
                </div>
                <div class="content-grid">
                    <div class="concept-box"><h3><i class="fas fa-check"></i> Best Practice</h3>
                        <p>Most React apps use <span class="highlight">controlled</span> components for better control, validation, and consistency.</p>
                    </div>
                    <div class="concept-box"><h3><i class="fas fa-shield-alt"></i> Validation</h3>
                        <p>Validate on <span class="highlight">onChange</span> or <span class="highlight">onSubmit</span> — show errors conditionally.</p>
                    </div>
                </div>
            `
        },
        {
            title: "<i class='fas fa-arrow-up'></i> Lifting State Up",
            subtitle: "Share state between components",
            content: `
                <div class="two-column-split">
                    <div class="col"><h4><i class="fas fa-arrow-up"></i> The Pattern</h4>
                        <p>When multiple components need to share state, <span class="highlight">lift the state</span> to their closest common ancestor.</p>
                        <pre><code>function Parent() {
  const [value, setValue] = useState('');
  return (
    &lt;&gt;
      &lt;ChildA value={value} /&gt;
      &lt;ChildB onChange={setValue} /&gt;
    &lt;/&gt;
  );
}</code></pre>
                    </div>
                    <div class="col"><h4><i class="fas fa-handshake"></i> Example: Temperature</h4>
                        <p>Two inputs (Celsius, Fahrenheit) share a single temperature state in parent.</p>
                        <pre><code>function TemperatureConverter() {
  const [temp, setTemp] = useState(0);
  // ... render two inputs that call setTemp
}</code></pre>
                    </div>
                </div>
                <div class="insight-card"><i class="fas fa-lightbulb"></i> <strong>Think:</strong> If two components depend on the same data, that data should live in their closest common parent.</div>
            `
        },
        {
            title: "<i class='fas fa-concierge-bell'></i> Context API",
            subtitle: "Avoid prop drilling with React Context",
            content: `
                <div class="content-grid">
                    <div class="concept-box"><h3><i class="fas fa-share-alt"></i> Create Context</h3>
                        <pre><code>const ThemeContext = React.createContext('light');</code></pre>
                    </div>
                    <div class="concept-box"><h3><i class="fas fa-provider"></i> Provider</h3>
                        <pre><code>&lt;ThemeContext.Provider value="dark"&gt;
  &lt;App /&gt;
&lt;/ThemeContext.Provider&gt;</code></pre>
                    </div>
                </div>
                <div class="two-column-split">
                    <div class="col"><h4><i class="fas fa-user"></i> useContext Hook</h4>
                        <pre><code>function Button() {
  const theme = useContext(ThemeContext);
  return &lt;button className={theme}&gt;Click&lt;/button&gt;;
}</code></pre>
                    </div>
                    <div class="col"><h4><i class="fas fa-warning"></i> When to use</h4>
                        <p>Context is great for <span class="highlight">global</span> data: theme, user, locale. Not for every prop — keep it focused.</p>
                    </div>
                </div>
            `
        },
        {
            title: "<i class='fas fa-fetch'></i> Data Fetching & Side Effects",
            subtitle: "useEffect + async/await",
            content: `
                <div class="two-column-split">
                    <div class="col"><h4><i class="fas fa-cloud-download-alt"></i> Fetch example</h4>
                        <pre><code>useEffect(() => {
  async function fetchData() {
    const res = await fetch('https://api.example.com/data');
    const data = await res.json();
    setData(data);
  }
  fetchData();
}, []);</code></pre>
                        <p>Use <span class="highlight">async</span> inside, not directly in useEffect.</p>
                    </div>
                    <div class="col"><h4><i class="fas fa-spinner"></i> Loading / Error</h4>
                        <pre><code>if (loading) return &lt;Loading /&gt;;
if (error) return &lt;Error message={error} /&gt;;
return &lt;DataDisplay data={data} /&gt;;</code></pre>
                    </div>
                </div>
                <div class="insight-card"><i class="fas fa-stopwatch"></i> <strong>Cleanup:</strong> AbortController or cancel flag to avoid memory leaks on unmount.</div>
            `
        },
        {
            title: "<i class='fas fa-hammer'></i> Custom Hooks",
            subtitle: "Extract and reuse logic",
            content: `
                <div class="content-grid">
                    <div class="concept-box"><h3><i class="fas fa-tools"></i> What is a custom hook?</h3>
                        <p>A function that starts with <span class="highlight">use</span> and can call other hooks. Allows you to share stateful logic between components.</p>
                    </div>
                    <div class="concept-box"><h3><i class="fas fa-code"></i> Example: useFetch</h3>
                        <pre><code>function useFetch(url) {
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  useEffect(() => {
    fetch(url).then(res => res.json()).then(setData);
  }, [url]);
  return { data, loading };
}</code></pre>
                    </div>
                </div>
                <div class="extensions-grid">
                    <div class="ext-card"><i class="fas fa-arrow-right"></i> <strong>useLocalStorage</strong> — sync state with localStorage</div>
                    <div class="ext-card"><i class="fas fa-arrow-right"></i> <strong>useWindowSize</strong> — react to window resize</div>
                </div>
            `
        },
        {
            title: "<i class='fas fa-puzzle-piece'></i> Thinking in React",
            subtitle: "Step-by-step guide to building UIs",
            content: `
                <div class="extensions-grid">
                    <div class="ext-card"><i class="fas fa-1"></i> <strong>Step 1:</strong> Break the UI into a component hierarchy</div>

            content: `

                    <div class="qa-title"><i class="fas fa-question-circle"></i> Toggle Questions (click to show/hide answer)</div>
                    <div id="qa-container"></div>
                </div>
                <div class="insight-card"><i class="fas fa-lightbulb"></i> <strong>Tip:</strong> Try answering before clicking to test your React knowledge!</div>

    const qaData = [
        { q: "What is the difference between controlled and uncontrolled components in React forms?", a: "Controlled: React state controls the input value (value + onChange). Uncontrolled: DOM handles value, ref is used to read it. Controlled is recommended for most cases." },
        { q: "What is lifting state up and why is it useful?", a: "Lifting state up means moving shared state to the closest common ancestor. It allows multiple components to share and sync data, avoiding duplication." },
        { q: "How does the useEffect hook replace lifecycle methods in class components?", a: "useEffect with empty array = componentDidMount. With dependencies = componentDidUpdate. Return function = componentWillUnmount." },
        { q: "What is React Context and when should you use it?", a: "Context provides a way to pass data through the component tree without prop drilling. Use for global data like theme, user, locale. Avoid for frequent updates." },
        { q: "How do you handle data fetching in functional components?", a: "Use useEffect with async/await inside (or .then). Manage loading/error states. Use cleanup (AbortController) to avoid memory leaks." },
        { q: "What are custom hooks and why are they useful?", a: "Custom hooks are functions that start with 'use' and encapsulate reusable stateful logic. They let you share logic across components without code duplication." },
        { q: "What is the role of keys in React lists?", a: "Keys help React identify which items have changed, added, or removed. They should be unique, stable, and used on the topmost element in the list." },
        { q: "Explain the 'Thinking in React' process.", a: "1. Component hierarchy. 2. Static version. 3. Identify minimal state. 4. Identify where state lives. 5. Add inverse data flow (callbacks)." },
        { q: "What is the difference between props and state? Give an example.", a: "Props are read-only data passed from parent. State is mutable data owned by the component. Example: props.userName vs state.isLoggedIn." },
        { q: "What is the purpose of the dependency array in useEffect?", a: "The dependency array tells React when to re-run the effect. Empty = run once. With values = re-run when values change. No array = run after every render." }
    ];

    let currentIndex = 0;
    const totalSlides = slides.length;

    const slideArea = document.getElementById('slideArea');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const counterText = document.getElementById('counterText');
    const dotsContainer = document.getElementById('dotsContainer');

    function renderQA() {
        const container = document.getElementById('qa-container');
        if (!container) return;
        container.innerHTML = '';
        qaData.forEach((item, idx) => {
            const qaDiv = document.createElement('div');
            qaDiv.className = 'qa-item';
            qaDiv.innerHTML = `
                <div class="qa-question" data-idx="${idx}">
                    <span><strong>${idx+1}.</strong> ${item.q}</span>
                    <i class="fas fa-chevron-down"></i>
                </div>
                <div class="qa-answer" id="answer-${idx}">
                    <p>${item.a}</p>
                </div>
            `;
            container.appendChild(qaDiv);
        });
        document.querySelectorAll('.qa-question').forEach(question => {
            question.addEventListener('click', function() {
                const idx = this.getAttribute('data-idx');
                const answerDiv = document.getElementById(`answer-${idx}`);
                const icon = this.querySelector('i');
                answerDiv.classList.toggle('show');
                icon.style.transform = answerDiv.classList.contains('show') ? 'rotate(180deg)' : 'rotate(0deg)';
            });
        });
    }

    function renderSlide(index) {
        const slide = slides[index];
        const html = `
            <div class="slide-card">
                <div class="slide-title">
                    ${slide.title}
                </div>
                <div class="slide-sub"><i class="fas fa-angle-right"></i> ${slide.subtitle}</div>
                <div class="slide-content">
                    ${slide.content}
                </div>
            </div>
        `;
        slideArea.innerHTML = html;
        if (index === 11) renderQA();
        counterText.innerHTML = `<i class="far fa-file-alt"></i> ${index+1} / ${totalSlides}`;
        prevBtn.disabled = (index === 0);
        nextBtn.disabled = (index === totalSlides-1);
        updateDots(index);
    }

    function updateDots(activeIndex) {
        dotsContainer.innerHTML = '';
        for (let i = 0; i < totalSlides; i++) {
            const dot = document.createElement('div');
            dot.classList.add('dot');
            if (i === activeIndex) dot.classList.add('active');
            dotsContainer.appendChild(dot);
        }
    }

    function nextSlide() { if (currentIndex < totalSlides - 1) { currentIndex++; renderSlide(currentIndex); } }
    function prevSlide() { if (currentIndex > 0) { currentIndex--; renderSlide(currentIndex); } }
    function handleKeyDown(e) {
        if (e.key === 'ArrowRight') { e.preventDefault(); nextSlide(); }
        else if (e.key === 'ArrowLeft') { e.preventDefault(); prevSlide(); }
    }

    prevBtn.addEventListener('click', prevSlide);
    nextBtn.addEventListener('click', nextSlide);
    window.addEventListener('keydown', handleKeyDown);
    renderSlide(0);
</script>

<script>
    const slides = [
        {
            title: "<i class='fab fa-react'></i> React: Declarative UI",
            subtitle: "Components, JSX, and the React philosophy",
            content: `
                <div class="content-grid">
                    <div class="concept-box"><h3><i class="fas fa-cubes"></i> What is React?</h3><p>React is a <span class="highlight">component-based</span> library for building user interfaces. It's declarative: you describe the UI state, React updates the DOM efficiently.</p><p>Created by Facebook (Meta) in 2013, powers Instagram, Airbnb, Netflix, and thousands of apps.</p></div>
                    <div class="concept-box"><h3><i class="fas fa-brain"></i> Why React?</h3><p><span class="highlight">Reusability</span> — build once, use everywhere.<br><span class="highlight">Virtual DOM</span> — fast updates.<br><span class="highlight">Ecosystem</span> — hooks, router, state management.<br><span class="highlight">Job market</span> — most demanded frontend skill.</p></div>
                </div>
                <div class="insight-card"><i class="fas fa-lightbulb"></i> <span class="tag">core idea</span> <span>React is not a framework — it's a library for building component trees that render efficiently.</span></div>
            `
        },
        {
            title: "<i class='fas fa-code'></i> JSX: JavaScript + XML",
            subtitle: "HTML-like syntax inside JavaScript",
            content: `
                <div class="two-column-split">
                    <div class="col"><h4><i class="fas fa-magic"></i> What is JSX?</h4>
                        <p>JSX is a syntax extension that lets you write HTML-like markup inside JavaScript.</p>
                        <pre><code>const element = &lt;h1&gt;Hello, world!&lt;/h1&gt;;</code></pre>
                        <p>JSX is <span class="highlight">not HTML</span> — it's JavaScript with syntactic sugar. Babel compiles it to React.createElement calls.</p>
                    </div>
                    <div class="col"><h4><i class="fas fa-rules"></i> JSX Rules</h4>
                        <ul style="margin-left:1.2rem; color:#e2e8f0;">
                            <li>Use <span class="highlight">className</span> instead of class</li>
                            <li>Wrap multiple elements in a parent (Fragment <>&lt;&gt;...&lt;/&gt;)</li>
                            <li>JavaScript expressions go in <span class="highlight">{ }</span></li>
                            <li>Self-closing tags: &lt;img /&gt;, &lt;input /&gt;</li>
                            <li>All attributes are camelCase: onClick, onChange</li>
                        </ul>
                    </div>
                </div>
                <div class="insight-card"><i class="fas fa-star"></i> <strong>JSX is optional</strong> — but it makes React code much more readable and expressive.</div>
            `
        },
        {
            title: "<i class='fas fa-balance-scale'></i> Library vs Framework",
            subtitle: "Why React is a library — and what that means for you",
            content: `
                <div class="two-column-split">
                    <div class="col"><h4><i class="fas fa-book-open"></i> Library</h4>
                        <p>A library is a collection of functions you <span class="highlight">call</span> when you need them. You are in control — you decide when and where to use it.</p>
                        <ul style="margin-left:1.2rem; color:#e2e8f0; margin-top:0.5rem;">
                            <li>✅ Lightweight, focused</li>
                            <li>✅ You control the flow</li>
                            <li>✅ Easy to swap out</li>
                            <li>✅ React, jQuery, Lodash</li>
                        </ul>
                    </div>
                    <div class="col"><h4><i class="fas fa-building"></i> Framework</h4>
                        <p>A framework is a <span class="highlight">complete structure</span> that calls your code. The framework is in control — you fill in the blanks according to its rules.</p>
                        <ul style="margin-left:1.2rem; color:#e2e8f0; margin-top:0.5rem;">
                            <li>🔒 Opinionated, full-featured</li>
                            <li>🔒 Framework controls the flow</li>
                            <li>🔒 Harder to replace parts</li>
                            <li>🔒 Angular, Vue (sometimes), Django</li>
                        </ul>
                    </div>
                </div>
                <div class="insight-card"><i class="fab fa-react"></i> <strong>React is a library</strong> because it focuses solely on the View layer. You can use it with any routing, state management, or build system — giving you freedom to choose. <span class="highlight">You call React, React doesn't call you.</span></div>
            `

        {
            title: "<i class='fas fa-cube'></i> Components: The Building Blocks",
            subtitle: "Functional and Class components",
            content: `
                <div class="extensions-grid">
                    <div class="ext-card"><i class="fas fa-arrow-right"></i> <strong>Functional Component</strong><br>function Greeting() { return &lt;h1&gt;Hi&lt;/h1&gt;; }<br>Modern, with Hooks</div>
                    <div class="ext-card"><i class="fas fa-arrow-right"></i> <strong>Class Component</strong><br>class Greeting extends React.Component { render() { return &lt;h1&gt;Hi&lt;/h1&gt;; } }<br>Legacy, but still used</div>
                    <div class="ext-card"><i class="fas fa-arrow-right"></i> <strong>Pure Component</strong><br>Optimized re-rendering, shallow props compare</div>

                <div class="content-grid">
                    <div class="concept-box"><h3><i class="fas fa-folder-tree"></i> Component Naming</h3><p>Components must start with <span class="highlight">capital letter</span> (PascalCase): MyButton, UserProfile, TodoList.<br>Lowercase elements are treated as HTML tags.</p></div>
                    <div class="concept-box"><h3><i class="fas fa-export"></i> Export/Import</h3><p>export default MyComponent; <br>import MyComponent from './MyComponent';</p></div>
                </div>
            `
        },
        {
            title: "<i class='fas fa-arrow-right'></i> Props: Passing Data",
            subtitle: "Read-only data from parent to child",
            content: `
                <div class="two-column-split">
                    <div class="col"><h4><i class="fas fa-inbox"></i> Props are read-only</h4>
                        <pre><code>function Welcome(props) {
  return &lt;h1&gt;Hello, {props.name}&lt;/h1&gt;;
}
// usage: &lt;Welcome name="Alice" /&gt;</code></pre>
                        <p>Props are like HTML attributes — they flow <span class="highlight">down</span> the component tree.</p>
                    </div>
                    <div class="col"><h4><i class="fas fa-puzzle-piece"></i> Destructuring</h4>
                        <pre><code>function Welcome({ name, age }) {
  return &lt;h1&gt;{name} is {age}&lt;/h1&gt;;
}</code></pre>
                        <p>Default props: <span class="highlight">Welcome.defaultProps = { name: 'Guest' }</span></p>
                    </div>
                </div>
                <div class="insight-card"><i class="fas fa-arrow-down"></i> <strong>One-way data flow:</strong> props are immutable — children cannot modify their props.</div>
            `
        },
        {
            title: "<i class='fas fa-database'></i> State: Component Memory",
            subtitle: "State makes components interactive",
            content: `
                <div class="content-grid">
                    <div class="concept-box"><h3><i class="fas fa-sync-alt"></i> useState Hook</h3>
                        <pre><code>import { useState } from 'react';
function Counter() {
  const [count, setCount] = useState(0);
  return (
    &lt;button onClick={() => setCount(count + 1)}&gt;
      Clicks: {count}
    &lt;/button&gt;
  );
}</code></pre>
                    </div>
                    <div class="concept-box"><h3><i class="fas fa-info-circle"></i> State Rules</h3>
                        <ul style="margin-left:1.2rem;">
                            <li><span class="highlight">State</span> is private to the component</li>
                            <li>Use <span class="highlight">setState</span> (or setCount) to update — never mutate directly</li>

                        </ul>
                    </div>
                </div>
                <div class="insight-card"><i class="fas fa-exclamation-triangle"></i> <strong>Never</strong> do: this.state.count = 1; — always use the updater function.</div>
            `

        {
            title: "<i class='fas fa-tree'></i> Component Composition",

                <div class="two-column-split">

    &lt;div&gt;
      &lt;Header /&gt;

      &lt;Footer /&gt;
    &lt;/div&gt;

&lt;Card&gt;&lt;h1&gt;Hello&lt;/h1&gt;&lt;/Card&gt;</code></pre>

                </div>

                    </div>
                </div>
                <div class="insight-card"><i class="fas fa-camera"></i> <strong>Submit:</strong> Code sandbox link or GitHub repo with your todo app.</div>
            `
        },
        {
            title: "<i class='fas fa-challenge'></i> Extended Challenge",
            subtitle: "Professional React patterns",
            content: `
                <div class="two-column-split">
                    <div class="col"><h4><i class="fas fa-puzzle-piece"></i> Task 1: Component Tree</h4>
                        <p>Build a <span class="highlight">comment section</span> with nested components: CommentList, CommentItem, ReplyForm.</p>
                    </div>
                    <div class="col"><h4><i class="fas fa-arrow-up"></i> Task 2: Lifting State</h4>
                        <p>Two sibling components share state via parent — implement a <span class="highlight">temperature converter</span>.</p>
                    </div>
                </div>
                <div class="two-column-split">
                    <div class="col"><h4><i class="fas fa-shield-alt"></i> Task 3: Prop Types</h4>
                        <p>Install <code>prop-types</code> and add type checking to your components.</p>
                    </div>
                    <div class="col"><h4><i class="fas fa-mobile-alt"></i> Task 4: Conditional Rendering</h4>
                        <p>Show a loading spinner while data is being fetched (use useEffect + fetch).</p>
                    </div>
                </div>
            `
        },
        {
            title: "<i class='fas fa-question-circle'></i> Knowledge Check",
            subtitle: "React fundamentals — click to reveal answers",
            content: `
                <div class="qa-section">
                    <div class="qa-title"><i class="fas fa-question-circle"></i> Toggle Questions (click to show/hide answer)</div>
                    <div id="qa-container"></div>
                </div>
                <div class="insight-card"><i class="fas fa-lightbulb"></i> <strong>Tip:</strong> Try answering before clicking to test your React knowledge!</div>
            `
        }
    ];

    const qaData = [
        { q: "What is the difference between a library and a framework? Give examples.", a: "A library is a collection of functions you call (e.g., React, jQuery). A framework is a structure that calls your code (e.g., Angular, Django). You control the flow with a library; the framework controls the flow." },
        { q: "Why is React considered a library and not a framework?", a: "React focuses only on the View layer. It doesn't prescribe routing, state management, or build tools. You can integrate it with other libraries freely — you are in control." },
        { q: "What is the difference between props and state in React?", a: "Props are read-only data passed from parent to child. State is mutable data managed inside a component. Changing state triggers re-render; props cannot be changed by the child." },
        { q: "What is JSX and why is it used?", a: "JSX is a syntax extension that lets you write HTML-like code inside JavaScript. It makes component definitions more readable and expressive. It's compiled to React.createElement calls." },
        { q: "What is the useState hook and how do you use it?", a: "useState is a React Hook that lets you add state to functional components. It returns an array: [state, setState]. Example: const [count, setCount] = useState(0);" },
        { q: "What is the significance of the React virtual DOM?", a: "The virtual DOM is a lightweight copy of the actual DOM. React updates the virtual DOM, compares it to the previous version (diffing), and then efficiently updates only the changed parts in the real DOM — improving performance." },
        { q: "How do you pass data from a parent component to a child component?", a: "Via props. Example: <Child name=\"Alice\" /> inside parent; child receives props.name or destructures { name }." },
        { q: "What are keys in React and why are they important?", a: "Keys are special attributes used when rendering lists of elements. They help React identify which items have changed, are added, or removed. Keys should be unique among siblings and stable (prefer using IDs)." },
        { q: "What is the useEffect hook used for?", a: "useEffect handles side effects in functional components: data fetching, DOM updates, timers, subscriptions. It runs after the component renders. Dependencies array controls when it re-runs." },
        { q: "What is prop drilling and how can you avoid it?", a: "Prop drilling is passing props through multiple layers of components. Avoid it by using Context API or state management libraries like Redux." }
    ];

    let currentIndex = 0;
    const totalSlides = slides.length;

    const slideArea = document.getElementById('slideArea');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const counterText = document.getElementById('counterText');
    const dotsContainer = document.getElementById('dotsContainer');

    function renderQA() {
        const container = document.getElementById('qa-container');
        if (!container) return;
        container.innerHTML = '';
        qaData.forEach((item, idx) => {
            const qaDiv = document.createElement('div');
            qaDiv.className = 'qa-item';
            qaDiv.innerHTML = `
                <div class="qa-question" data-idx="${idx}">
                    <span><strong>${idx+1}.</strong> ${item.q}</span>
                    <i class="fas fa-chevron-down"></i>
                </div>
                <div class="qa-answer" id="answer-${idx}">
                    <p>${item.a}</p>
                </div>
            `;
            container.appendChild(qaDiv);
        });
        document.querySelectorAll('.qa-question').forEach(question => {
            question.addEventListener('click', function() {
                const idx = this.getAttribute('data-idx');
                const answerDiv = document.getElementById(`answer-${idx}`);
                const icon = this.querySelector('i');
                answerDiv.classList.toggle('show');
                icon.style.transform = answerDiv.classList.contains('show') ? 'rotate(180deg)' : 'rotate(0deg)';
            });
        });
    }

    function renderSlide(index) {
        const slide = slides[index];
        const html = `
            <div class="slide-card">
                <div class="slide-title">
                    ${slide.title}
                </div>
                <div class="slide-sub"><i class="fas fa-angle-right"></i> ${slide.subtitle}</div>
                <div class="slide-content">
                    ${slide.content}
                </div>
            </div>
        `;
        slideArea.innerHTML = html;
        if (index === 10) renderQA();
        counterText.innerHTML = `<i class="far fa-file-alt"></i> ${index+1} / ${totalSlides}`;
        prevBtn.disabled = (index === 0);
        nextBtn.disabled = (index === totalSlides-1);
        updateDots(index);
    }

    function updateDots(activeIndex) {
        dotsContainer.innerHTML = '';
        for (let i = 0; i < totalSlides; i++) {
            const dot = document.createElement('div');
            dot.classList.add('dot');
            if (i === activeIndex) dot.classList.add('active');
            dotsContainer.appendChild(dot);
        }
    }

    function nextSlide() { if (currentIndex < totalSlides - 1) { currentIndex++; renderSlide(currentIndex); } }
    function prevSlide() { if (currentIndex > 0) { currentIndex--; renderSlide(currentIndex); } }
    function handleKeyDown(e) {
        if (e.key === 'ArrowRight') { e.preventDefault(); nextSlide(); }
        else if (e.key === 'ArrowLeft') { e.preventDefault(); prevSlide(); }
    }

    prevBtn.addEventListener('click', prevSlide);
    nextBtn.addEventListener('click', nextSlide);
    window.addEventListener('keydown', handleKeyDown);
    renderSlide(0);
</script>
</body>
</html>

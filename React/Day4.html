<script>
  const slides = [
    { title: "<i class='fas fa-arrow-up'></i> Lifting State Up", subtitle: "Share state between components",
      content: `
        <div class="two-column-split">
          <div class="col"><h4><i class="fas fa-arrow-up"></i> The Pattern</h4>
            <p>When multiple components need to share state, <span class="highlight">lift the state</span> to their closest common ancestor.</p>
            <pre><code>function Parent() {\n  const [value, setValue] = useState('');\n  return (\n    &lt;&gt;\n      &lt;ChildA value={value} /&gt;\n      &lt;ChildB onChange={setValue} /&gt;\n    &lt;/&gt;\n  );\n}</code></pre>
            <p><strong>Example:</strong> Two inputs sharing a temperature value.</p>
          </div>
          <div class="col"><h4><i class="fas fa-handshake"></i> Real Example</h4>
            <pre><code>function TemperatureConverter() {\n  const [celsius, setCelsius] = useState(0);\n  const fahrenheit = (celsius * 9/5) + 32;\n  \n  return (\n    &lt;&gt;\n      &lt;Input \n        label="Celsius"\n        value={celsius}\n        onChange={setCelsius}\n      /&gt;\n      &lt;Input \n        label="Fahrenheit"\n        value={fahrenheit}\n        onChange={(f) => setCelsius((f-32)*5/9)}\n      /&gt;\n    &lt;/&gt;\n  );\n}</code></pre>
          </div>
        </div>
        <div class="insight-card"><i class="fas fa-lightbulb"></i> <strong>Think:</strong> If two components depend on the same data, that data should live in their closest common parent.</div>
      `
    },
    { title: "<i class='fas fa-reduce'></i> useReducer for Complex State", subtitle: "Managing state with actions and reducers",
      content: `
        <div class="two-column-split">
          <div class="col"><h4><i class="fas fa-cog"></i> Reducer Pattern</h4>
            <pre><code>const initialState = { count: 0 };\n\nfunction reducer(state, action) {\n  switch (action.type) {\n    case 'INCREMENT':\n      return { count: state.count + 1 };\n    case 'DECREMENT':\n      return { count: state.count - 1 };\n    default:\n      return state;\n  }\n}\n\nfunction Counter() {\n  const [state, dispatch] = useReducer(reducer, initialState);\n  return (\n    &lt;&gt;\n      Count: {state.count}\n      &lt;button onClick={() => dispatch({ type: 'INCREMENT' })}&gt;+&lt;/button&gt;\n    &lt;/&gt;\n  );\n}</code></pre>
          </div>
          <div class="col"><h4><i class="fas fa-list"></i> When to Use</h4>
            <ul style="margin-left:1.2rem;">
              <li>✅ Complex state logic with multiple sub-values</li>
              <li>✅ Next state depends on previous state</li>
              <li>✅ Deep updates (nested objects/arrays)</li>
              <li>✅ State transitions are predictable</li>
            </ul>
            <p><strong>Example:</strong> Shopping cart with add, remove, update quantity.</p>
            <pre><code>// Cart reducer\ncase 'ADD_ITEM':\n  return { ...state, items: [...state.items, action.payload] };\ncase 'REMOVE_ITEM':\n  return { ...state, items: state.items.filter(i => i.id !== action.id) };</code></pre>
          </div>
        </div>
        <div class="insight-card"><i class="fas fa-code-branch"></i> <strong>useReducer vs useState:</strong> useReducer is better when state updates are complex and involve multiple actions.</div>
      `
    },
    { title: "<i class='fas fa-share-alt'></i> useContext for Global State", subtitle: "Avoid prop drilling with React Context",
      content: `
        <div class="two-column-split">
          <div class="col"><h4><i class="fas fa-share-alt"></i> Create & Provide Context</h4>
            <pre><code>// 1. Create context\nconst ThemeContext = React.createContext('light');\n\n// 2. Provide value\nfunction App() {\n  return (\n    &lt;ThemeContext.Provider value="dark"&gt;\n      &lt;Main /&gt;\n    &lt;/ThemeContext.Provider&gt;\n  );\n}\n\n// 3. Consume context\nfunction Button() {\n  const theme = useContext(ThemeContext);\n  return &lt;button className={theme}&gt;Click&lt;/button&gt;;\n}</code></pre>
          </div>
          <div class="col"><h4><i class="fas fa-user"></i> Real Examples</h4>
            <ul style="margin-left:1.2rem;">
              <li>🌓 <strong>Theme:</strong> dark/light mode</li>
              <li>👤 <strong>User:</strong> authentication status</li>
              <li>🌍 <strong>Locale:</strong> language preference</li>
              <li>🛒 <strong>Cart:</strong> shopping cart state</li>
            </ul>
            <pre><code>// User context\nconst UserContext = createContext();\n\nfunction Profile() {\n  const { user, setUser } = useContext(UserContext);\n  return &lt;div&gt;Welcome, {user.name}&lt;/div&gt;;\n}</code></pre>
            <p><span class="highlight">⚠️</span> Use Context for global data, not for every prop.</p>
          </div>
        </div>
        <div class="insight-card"><i class="fas fa-gem"></i> <strong>Combine with useReducer:</strong> Create a global state with Context + useReducer for powerful state management.</div>
      `
    },
    { title: "<i class='fas fa-memory'></i> useMemo & useCallback", subtitle: "Memoization for performance",
      content: `
        <div class="two-column-split">
          <div class="col"><h4><i class="fas fa-calculator"></i> useMemo</h4>
            <p>Memoizes <span class="highlight">values</span> to avoid expensive calculations on every render.</p>
            <pre><code>function ExpensiveComponent({ data }) {\n  // Only recalculates when data changes\n  const processedData = useMemo(() => {\n    return data.map(item => heavyComputation(item));\n  }, [data]);\n  \n  return &lt;div&gt;{processedData}&lt;/div&gt;;\n}</code></pre>
            <p><strong>Example:</strong> Filtering a large list, sorting, complex calculations.</p>
          </div>
          <div class="col"><h4><i class="fas fa-arrow-right"></i> useCallback</h4>
            <p>Memoizes <span class="highlight">functions</span> to prevent unnecessary re-renders of child components.</p>
            <pre><code>function Parent() {\n  const [count, setCount] = useState(0);\n  \n  // Only creates new function when count changes\n  const handleClick = useCallback(() => {\n    console.log('Clicked!', count);\n  }, [count]);\n  \n  return &lt;Child onClick={handleClick} /&gt;;\n}</code></pre>
            <p><strong>Example:</strong> Passing callbacks to memoized child components.</p>
          </div>
        </div>
        <div class="insight-card"><i class="fas fa-ruler"></i> <strong>When to use:</strong> Only for expensive computations or when passing callbacks to memoized children. Don't over-optimize!</div>
      `
    },
    { title: "<i class='fas fa-link'></i> useRef: DOM & Mutable Variables", subtitle: "Access DOM elements and store mutable values",
      content: `
        <div class="two-column-split">
          <div class="col"><h4><i class="fas fa-dom"></i> DOM Access</h4>
            <pre><code>function InputFocus() {\n  const inputRef = useRef(null);\n  \n  const focusInput = () => {\n    inputRef.current.focus(); // Direct DOM access\n  };\n  \n  return (\n    &lt;&gt;\n      &lt;input ref={inputRef} /&gt;\n      &lt;button onClick={focusInput}&gt;Focus&lt;/button&gt;\n    &lt;/&gt;\n  );\n}</code></pre>
            <p><strong>Use cases:</strong> Focusing inputs, measuring DOM elements, integrating with 3rd-party libraries.</p>
          </div>
          <div class="col"><h4><i class="fas fa-box"></i> Mutable Values</h4>
            <p>Store values that <span class="highlight">don't trigger re-renders</span> when changed.</p>
            <pre><code>function Timer() {\n  const intervalRef = useRef(null);\n  const [count, setCount] = useState(0);\n  \n  const startTimer = () => {\n    intervalRef.current = setInterval(() => {\n      setCount(c => c + 1);\n    }, 1000);\n  };\n  \n  const stopTimer = () => {\n    clearInterval(intervalRef.current);\n  };\n  \n  return &lt;&gt;Count: {count}&lt;/&gt;;\n}</code></pre>
            <p><strong>Use cases:</strong> Timer IDs, previous values, instance variables.</p>
          </div>
        </div>
        <div class="insight-card"><i class="fas fa-exclamation-circle"></i> <strong>Important:</strong> Changing useRef.current doesn't trigger re-renders. Use useState when you need to update the UI.</div>
      `
    },
    { title: "<i class='fas fa-tools'></i> Custom Hooks", subtitle: "Extract and reuse stateful logic",
      content: `
        <div class="two-column-split">
          <div class="col"><h4><i class="fas fa-code"></i> Creating Custom Hooks</h4>
            <p>Functions that start with <span class="highlight">use</span> and can call other hooks.</p>
            <pre><code>function useFetch(url) {\n  const [data, setData] = useState(null);\n  const [loading, setLoading] = useState(true);\n  const [error, setError] = useState(null);\n  \n  useEffect(() => {\n    async function fetchData() {\n      try {\n        const res = await fetch(url);\n        const json = await res.json();\n        setData(json);\n      } catch (err) {\n        setError(err);\n      } finally {\n        setLoading(false);\n      }\n    }\n    fetchData();\n  }, [url]);\n  \n  return { data, loading, error };\n}</code></pre>
          </div>
          <div class="col"><h4><i class="fas fa-arrow-right"></i> Using Custom Hooks</h4>
            <pre><code>function UserList() {\n  const { data, loading, error } = useFetch('https://api.github.com/users');\n  \n  if (loading) return &lt;p&gt;Loading...&lt;/p&gt;;\n  if (error) return &lt;p&gt;Error: {error.message}&lt;/p&gt;;\n  return (\n    &lt;ul&gt;\n      {data.map(user => (\n        &lt;li key={user.id}&gt;{user.login}&lt;/li&gt;\n      ))}\n    &lt;/ul&gt;\n  );\n}</code></pre>
            <p><strong>Popular custom hooks:</strong></p>
            <ul style="margin-left:1.2rem;">
              <li>📦 <strong>useLocalStorage</strong> — sync with localStorage</li>
              <li>📱 <strong>useWindowSize</strong> — responsive design</li>
              <li>🔄 <strong>useToggle</strong> — boolean state</li>
            </ul>
          </div>
        </div>
        <div class="insight-card"><i class="fas fa-gem"></i> <strong>Benefits:</strong> Reusable logic, cleaner components, easier testing, and better separation of concerns.</div>
      `
    },
    { title: "<i class='fas fa-rocket'></i> React.memo & Performance", subtitle: "Optimize component re-renders",
      content: `
        <div class="two-column-split">
          <div class="col"><h4><i class="fas fa-memory"></i> React.memo</h4>
            <p>Prevents re-rendering when props haven't changed.</p>
            <pre><code>// Without memo - re-renders on every parent change\nconst Child = ({ name }) => &lt;div&gt;{name}&lt;/div&gt;;\n\n// With memo - only re-renders when props change\nconst Child = React.memo(({ name }) => {\n  console.log('Rendering:', name);\n  return &lt;div&gt;{name}&lt;/div&gt;;\n});\n\n// Parent component\nfunction Parent() {\n  const [count, setCount] = useState(0);\n  return (\n    &lt;&gt;\n      &lt;button onClick={() => setCount(c => c+1)}&gt;\n        Count: {count}\n      &lt;/button&gt;\n      &lt;Child name="John" /&gt; {/* Won't re-render */}\n    &lt;/&gt;\n  );\n}</code></pre>
          </div>
          <div class="col"><h4><i class="fas fa-lightbulb"></i> Virtual DOM & Keys</h4>
            <p><strong>Virtual DOM:</strong> A lightweight copy of the real DOM. React compares it with the previous version (diffing) to find changes.</p>
            <pre><code>// Why keys matter\n{todos.map(todo => (\n  // ❌ Bad: using index as key\n  &lt;Todo key={index} {...todo} /&gt;\n  \n  // ✅ Good: using stable unique ID\n  &lt;Todo key={todo.id} {...todo} /&gt;\n))}</code></pre>
            <p><strong>Keys help React:</strong></p>
            <ul style="margin-left:1.2rem;">
              <li>✅ Identify which items changed</li>
              <li>✅ Minimize DOM updates</li>
              <li>✅ Maintain component state</li>
            </ul>
          </div>
        </div>
        <div class="insight-card"><i class="fas fa-stopwatch"></i> <strong>Performance tips:</strong> Use React.memo for expensive components, keys for lists, and avoid inline functions in render.</div>
      `
    },
    { title: "<i class='fas fa-route'></i> React Router v6", subtitle: "Navigation, nested routes, and URL params",
      content: `
        <div class="two-column-split">
          <div class="col"><h4><i class="fas fa-route"></i> Setup & Routes</h4>
            <pre><code>// App.js\nimport { BrowserRouter, Routes, Route, Link } from 'react-router-dom';\n\nfunction App() {\n  return (\n    &lt;BrowserRouter&gt;\n      &lt;nav&gt;\n        &lt;Link to="/"&gt;Home&lt;/Link&gt;\n        &lt;Link to="/about"&gt;About&lt;/Link&gt;\n        &lt;Link to="/products"&gt;Products&lt;/Link&gt;\n      &lt;/nav&gt;\n      \n      &lt;Routes&gt;\n        &lt;Route path="/" element={&lt;Home /&gt;} /&gt;\n        &lt;Route path="/about" element={&lt;About /&gt;} /&gt;\n        &lt;Route path="/products" element={&lt;Products /&gt;} /&gt;\n        &lt;Route path="/products/:id" element={&lt;ProductDetail /&gt;} /&gt;\n      &lt;/Routes&gt;\n    &lt;/BrowserRouter&gt;\n  );\n}</code></pre>
          </div>
          <div class="col"><h4><i class="fas fa-id-card"></i> Nested Routes & Params</h4>
            <pre><code>// ProductDetail.js\nimport { useParams, useNavigate } from 'react-router-dom';\n\nfunction ProductDetail() {\n  const { id } = useParams(); // Get URL parameter\n  const navigate = useNavigate(); // Programmatic navigation\n  \n  return (\n    &lt;&gt;\n      &lt;h1&gt;Product {id}&lt;/h1&gt;\n      &lt;button onClick={() => navigate(-1)}&gt;Go Back&lt;/button&gt;\n      &lt;button onClick={() => navigate('/products')}&gt;All Products&lt;/button&gt;\n    &lt;/&gt;\n  );\n}\n\n// Nested routes\nfunction Products() {\n  return (\n    &lt;&gt;\n      &lt;ProductList /&gt;\n      &lt;Outlet /&gt; {/* Renders nested routes */}\n    &lt;/&gt;\n  );\n}</code></pre>
          </div>
        </div>
        <div class="insight-card"><i class="fas fa-compass"></i> <strong>Key features:</strong> useNavigate, useParams, Outlet for nested routes, and useLocation for state management.</div>
      `
    },
    { title: "<i class='fas fa-paint-brush'></i> Styling Options", subtitle: "CSS Modules vs Styled Components vs Tailwind",

      content: `

    { title: "<i class='fas fa-question-circle'></i> Knowledge Check", subtitle: "Intermediate React concepts",
      content: `
        <div class="qa-section">
          <div class="qa-title"><i class="fas fa-question-circle"></i> Toggle Questions (click to reveal answers)</div>
          <div id="qa-container"></div>
        </div>
        <div class="insight-card"><i class="fas fa-lightbulb"></i> <strong>Tip:</strong> Try answering before clicking to test your React knowledge!</div>
      `
    }
  ];

  const qaData = [
    { q: "What is lifting state up and why is it useful?", a: "Lifting state up means moving shared state to the closest common ancestor. It allows multiple components to share and sync data, avoiding duplication." },
    { q: "When should you use useReducer instead of useState?", a: "useReducer is better when state has complex logic, multiple sub-values, or updates depend on previous state. Example: shopping cart, forms with validation." },
    { q: "What is the difference between useMemo and useCallback?", a: "useMemo memoizes values (expensive calculations), useCallback memoizes functions. Both prevent unnecessary re-computations but for different types of data." },
    { q: "What is React Context and when should you use it?", a: "Context provides a way to pass data through the component tree without prop drilling. Use for global data like theme, user, locale. Avoid for frequent updates." },
    { q: "What is the purpose of useRef?", a: "useRef provides a mutable reference that persists across renders. It can access DOM elements directly and store mutable values without causing re-renders." },
    { q: "What are custom hooks and why are they useful?", a: "Custom hooks are functions that start with 'use' and encapsulate reusable stateful logic. They let you share logic across components without code duplication." },
    { q: "How does React.memo help with performance?", a: "React.memo prevents a component from re-rendering if its props haven't changed. It's useful for expensive components that render frequently." },
    { q: "What is the role of keys in React lists?", a: "Keys help React identify which items have changed, added, or removed. They should be unique, stable, and used on the topmost element in the list." },
    { q: "What are the main features of React Router v6?", a: "React Router v6 provides declarative routing with useNavigate, useParams, Outlet for nested routes, and useLocation for state management." },
    { q: "What are the differences between CSS Modules, Styled Components, and Tailwind?", a: "CSS Modules: scoped styles, no runtime. Styled Components: CSS-in-JS, dynamic styling. Tailwind: utility-first, fast development, no context switching." }
  ];

  let currentIndex = 0;
  const totalSlides = slides.length;
  const slideArea = document.getElementById('slideArea');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const counterText = document.getElementById('counterText');
  const dotsContainer = document.getElementById('dotsContainer');

  function renderQA() {
    const container = document.getElementById('qa-container');
    if (!container) return;
    container.innerHTML = '';
    qaData.forEach((item, idx) => {
      const qaDiv = document.createElement('div');
      qaDiv.className = 'qa-item';
      qaDiv.innerHTML = `
        <div class="qa-question" data-idx="${idx}">
          <span><strong>${idx+1}.</strong> ${item.q}</span>
          <i class="fas fa-chevron-down"></i>
        </div>
        <div class="qa-answer" id="answer-${idx}">
          <p>${item.a}</p>
        </div>
      `;
      container.appendChild(qaDiv);
    });
    document.querySelectorAll('.qa-question').forEach(question => {
      question.addEventListener('click', function() {
        const idx = this.getAttribute('data-idx');
        const answerDiv = document.getElementById(`answer-${idx}`);
        const icon = this.querySelector('i');
        answerDiv.classList.toggle('show');
        icon.style.transform = answerDiv.classList.contains('show') ? 'rotate(180deg)' : 'rotate(0deg)';
      });
    });
  }

  function renderSlide(index) {
    const slide = slides[index];
    const html = `
      <div class="slide-card">
        <div class="slide-title">${slide.title}</div>
        <div class="slide-sub"><i class="fas fa-angle-right"></i> ${slide.subtitle}</div>
        <div class="slide-content">${slide.content}</div>
      </div>
    `;
    slideArea.innerHTML = html;
    if (index === totalSlides - 1) {
      const content = slideArea.querySelector('.slide-content');
      const qaDiv = document.createElement('div');
      qaDiv.className = 'qa-section';
      qaDiv.innerHTML = `<div class="qa-title"><i class="fas fa-question-circle"></i> Knowledge Check · Intermediate React</div><div id="qa-container"></div>`;
      content.appendChild(qaDiv);
      renderQA();
    }
    counterText.innerHTML = `<i class="far fa-file-alt"></i> ${index+1} / ${totalSlides}`;
    prevBtn.disabled = (index === 0);
    nextBtn.disabled = (index === totalSlides-1);
    updateDots(index);
  }

  function updateDots(activeIndex) {
    dotsContainer.innerHTML = '';
    for (let i = 0; i < totalSlides; i++) {
      const dot = document.createElement('div');
      dot.classList.add('dot');
      if (i === activeIndex) dot.classList.add('active');
      dotsContainer.appendChild(dot);
    }
  }

  function nextSlide() { if (currentIndex < totalSlides - 1) { currentIndex++; renderSlide(currentIndex); } }
  function prevSlide() { if (currentIndex > 0) { currentIndex--; renderSlide(currentIndex); } }
  function handleKeyDown(e) {
    if (e.key === 'ArrowRight') { e.preventDefault(); nextSlide(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); prevSlide(); }
  }

  prevBtn.addEventListener('click', prevSlide);
  nextBtn.addEventListener('click', nextSlide);
  window.addEventListener('keydown', handleKeyDown);
  renderSlide(0);
</script>

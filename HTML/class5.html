<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class 5: HTML Forms | Month 1 · Week 2</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #0a0c15 0%, #111827 100%);
            min-height: 100vh;
            padding: 1.5rem;
        }
        .class-nav {
            max-width: 1300px;
            margin: 0 auto 1rem auto;
            background: #0f172a;
            border-radius: 1.5rem;
            padding: 0.8rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            border: 1px solid #334155;
            box-shadow: 0 10px 20px -5px rgba(0,0,0,0.3);
        }
        .nav-buttons-class {
            display: flex;
            gap: 0.8rem;
        }
        .nav-btn {
            background: #1e2a3a;
            border: none;
            padding: 0.5rem 1.2rem;
            border-radius: 2rem;
            color: #e2e8f0;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: 0.2s;
            text-decoration: none;
            border: 1px solid #334155;
        }
        .nav-btn.active {
            background: #3b82f6;
            border-color: #60a5fa;
        }
        .nav-btn:hover:not(.active) {
            background: #2d3a4e;
            transform: translateY(-2px);
        }
        .class-badge {
            background: #3b82f6;
            padding: 0.3rem 1rem;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: bold;
            color: white;
        }
        .presentation-container {
            max-width: 1300px;
            margin: 0 auto;
            background: rgba(255,255,255,0.03);
            border-radius: 2rem;
            backdrop-filter: blur(2px);
            box-shadow: 0 25px 45px rgba(0,0,0,0.4);
            overflow: hidden;
        }
        .slide-area {
            min-height: 580px;
            background: #0f1119;
            padding: 2rem;
        }
        .slide-card {
            background: rgba(22, 26, 38, 0.95);
            backdrop-filter: blur(4px);
            border-radius: 2rem;
            padding: 2rem 2.2rem;
            border: 1px solid rgba(72, 187, 255, 0.25);
        }
        .slide-title {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #E0F2FE, #7AA9FF);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 0.5rem;
            border-left: 5px solid #3b82f6;
            padding-left: 1.2rem;
        }
        .slide-sub {
            color: #8e9bb5;
            margin-bottom: 1.5rem;
            border-left: 5px solid #3b82f6;
            padding-left: 1.2rem;
            font-size: 0.9rem;
        }
        .content-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            margin-top: 1rem;
        }
        .concept-box {
            flex: 1;
            min-width: 240px;
            background: #1a1f2b;
            border-radius: 1.5rem;
            padding: 1.3rem;
            border: 1px solid #2d3748;
        }
        .concept-box h3 {
            color: #60a5fa;
            font-size: 1.25rem;
            margin-bottom: 0.8rem;
            display: flex;
            gap: 0.6rem;
            align-items: center;
        }
        pre {
            background: #0a0e17;
            padding: 1rem;
            border-radius: 1rem;
            overflow-x: auto;
            font-size: 0.75rem;
            color: #cbd5e1;
            margin-top: 0.8rem;
            border: 1px solid #2d3748;
        }
        .highlight {
            color: #facc15;
            font-weight: 500;
        }
        .tag {
            background: #2d3748;
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
            font-size: 0.7rem;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }
        .insight-card {
            margin-top: 1.2rem;
            background: #11161f;
            padding: 0.8rem 1.2rem;
            border-radius: 1rem;
            border-left: 3px solid #3b82f6;
            color: #b9d0ff;
        }
        .nav-bar {
            background: #0b0e16;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #2a2f3f;
        }
        .nav-buttons {
            display: flex;
            gap: 1rem;
        }
        button {
            background: #1e2a3a;
            border: none;
            padding: 0.5rem 1.5rem;
            border-radius: 2rem;
            color: #e2e8f0;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border: 1px solid #334155;
        }
        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .indicator-dots {
            display: flex;
            gap: 0.5rem;
        }
        .dot {
            width: 8px;
            height: 8px;
            background: #334155;
            border-radius: 10px;
        }
        .dot.active {
            background: #3b82f6;
            width: 22px;
        }
        footer {
            font-size: 0.7rem;
            text-align: center;
            padding: 0.7rem;
            background: #07090f;
            color: #5b6e8c;
        }
        @media (max-width: 700px) {
            .slide-area { padding: 1rem; }
            .slide-title { font-size: 1.4rem; }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

<div class="class-nav">
    <div><span class="class-badge"><i class="fas fa-calendar-week"></i> MONTH 1 · WEEK 2</span></div>
    <div class="nav-buttons-class">
        <a href="class-4-html-elements.htm" class="nav-btn"><i class="fas fa-code"></i> Class 4</a>
        <a href="class5.html" class="nav-btn active"><i class="fas fa-file-alt"></i> Class 5</a>
        <a href="class6.html" class="nav-btn"><i class="fas fa-globe"></i> Class 6</a>
    </div>
    <div><i class="fas fa-clock"></i> 3 Hours · HTML Forms & Input Types</div>
</div>

<div class="presentation-container">
    <div class="slide-area" id="slideArea"></div>
    <div class="nav-bar">
        <div class="indicator-dots" id="dotsContainer"></div>
        <div class="nav-buttons">
            <button id="prevBtn"><i class="fas fa-chevron-left"></i> Prev</button>
            <span class="slide-counter" id="counterText">1 / 6</span>
            <button id="nextBtn">Next <i class="fas fa-chevron-right"></i></button>
        </div>
    </div>
    <footer><i class="fas fa-tasks"></i> Assignment: Build a complete Registration Form with all field types + validation attributes</footer>
</div>

<script>
    const slides = [
        {
            title: "📝 Form Basics & Input Types",
            subtitle: "form element · action · method · text, email, password, number, date, tel, url",
            content: `<div class="content-grid"><div class="concept-box"><h3><i class="fas fa-envelope"></i> Basic Form Structure</h3><pre><code>&lt;form action="/submit" method="POST"&gt;
  &lt;label for="name"&gt;Name:&lt;/label&gt;
  &lt;input type="text" id="name" name="name"&gt;
&lt;/form&gt;</code></pre></div><div class="concept-box"><h3><i class="fas fa-keyboard"></i> Input Types</h3><p>text, email, password, number, date, tel, url. <span class="highlight">type="email"</span> validates email format automatically.</p></div><div class="concept-box"><h3><i class="fas fa-tag"></i> Labels & Accessibility</h3><p>Every input MUST have a matching &lt;label&gt; using <strong>for/id</strong>. Clicking label focuses input.</p></div></div>`
        },
        {
            title: "🎛️ Select, Radio, Checkbox, Textarea",
            subtitle: "Dropdowns · Single choice · Multiple choice · Multi-line text",
            content: `<div class="content-grid"><div class="concept-box"><h3><i class="fas fa-caret-down"></i> Select Dropdown</h3><pre><code>&lt;select name="course"&gt;
  &lt;option value="frontend"&gt;Frontend&lt;/option&gt;
  &lt;option value="backend"&gt;Backend&lt;/option&gt;
&lt;/select&gt;</code></pre></div><div class="concept-box"><h3><i class="fas fa-check-square"></i> Radio & Checkbox</h3><pre><code>&lt;input type="radio" name="level" value="beginner"&gt; Beginner
&lt;input type="checkbox" name="days" value="mon"&gt; Monday</code></pre></div><div class="concept-box"><h3><i class="fas fa-align-left"></i> Textarea</h3><pre><code>&lt;textarea rows="5" cols="30"&gt;&lt;/textarea&gt;</code></pre></div></div>`
        },
        {
            title: "🔧 Form Attributes: required, placeholder, disabled",
            subtitle: "Validation attributes · Fieldset & Legend",
            content: `<div class="concept-box"><h3><i class="fas fa-asterisk"></i> Important Attributes</h3><pre><code>&lt;input type="text" required placeholder="Enter name" disabled&gt;
&lt;input type="email" value="user@example.com" readonly&gt;</code></pre><p><span class="highlight">required</span> prevents submission if empty. <span class="highlight">placeholder</span> shows hint. <span class="highlight">disabled</span> makes field uneditable.</p></div><div class="insight-card"><i class="fas fa-layer-group"></i> <strong>fieldset & legend:</strong> Group related fields.<pre><code>&lt;fieldset&gt;&lt;legend&gt;Personal Info&lt;/legend&gt; ... &lt;/fieldset&gt;</code></pre></div>`
        },
        {
            title: "💻 Complete Form Example",
            subtitle: "Registration form with all elements",
            content: `<pre style="font-size:0.7rem;"><code>&lt;form action="/register" method="POST"&gt;
  &lt;fieldset&gt;
    &lt;legend&gt;Personal Information&lt;/legend&gt;
    &lt;label for="fullname"&gt;Full Name *&lt;/label&gt;
    &lt;input type="text" id="fullname" name="fullname" required&gt;
    
    &lt;label for="email"&gt;Email *&lt;/label&gt;
    &lt;input type="email" id="email" name="email" required&gt;
    
    &lt;label for="dob"&gt;Date of Birth&lt;/label&gt;
    &lt;input type="date" id="dob" name="dob"&gt;
  &lt;/fieldset&gt;
  
  &lt;fieldset&gt;
    &lt;legend&gt;Course Selection&lt;/legend&gt;
    &lt;select name="course"&gt;
      &lt;option value=""&gt;-- Select --&lt;/option&gt;
      &lt;option value="frontend"&gt;Frontend&lt;/option&gt;
    &lt;/select&gt;
    
    &lt;p&gt;Class Days:&lt;/p&gt;
    &lt;label&gt;&lt;input type="checkbox" name="days" value="mon"&gt; Mon&lt;/label&gt;
    
    &lt;p&gt;Experience:&lt;/p&gt;
    &lt;label&gt;&lt;input type="radio" name="level" value="beginner"&gt; Beginner&lt;/label&gt;
  &lt;/fieldset&gt;
  
  &lt;label for="message"&gt;Questions:&lt;/label&gt;
  &lt;textarea id="message" rows="4"&gt;&lt;/textarea&gt;
  
  &lt;button type="submit"&gt;Submit&lt;/button&gt;
  &lt;button type="reset"&gt;Clear&lt;/button&gt;
&lt;/form&gt;</code></pre>`
        },
        {
            title: "📝 ASSIGNMENT: Build a Registration Form",
            subtitle: "Course registration form with all field types",
            content: `<div class="insight-card"><i class="fas fa-tasks"></i> <strong>Requirements:</strong><ul style="margin-top:0.5rem; margin-left:1.5rem;"><li>Create registration.html with ALL field types: text, email, password, date, tel, select, radio, checkbox, textarea</li><li>Every input MUST have matching &lt;label&gt; (for/id pattern)</li><li>Mark required fields with * and use <span class="highlight">required</span> attribute</li><li>Group fields using &lt;fieldset&gt; and &lt;legend&gt;</li><li>Add submit button AND reset/clear button</li></ul></div><div class="tag" style="margin-top:0.8rem;"><i class="fas fa-star"></i> BONUS: Add password confirmation field + terms & conditions checkbox</div>`
        },
        {
            title: "✅ Form Submission & Validation",
            subtitle: "How forms send data · GET vs POST",
            content: `<div class="content-grid"><div class="concept-box"><h3><i class="fas fa-upload"></i> GET vs POST</h3><p><strong>GET:</strong> Data in URL (visible, bookmarks, limited size). <strong>POST:</strong> Data in request body (secure, no size limit).</p></div><div class="concept-box"><h3><i class="fas fa-check-circle"></i> Browser Validation</h3><p>required, type="email", type="number" trigger automatic validation. Custom validation possible with JavaScript later.</p></div></div><div class="insight-card"><i class="fas fa-shield-alt"></i> Always use POST for sensitive data (passwords, personal info). GET is for search/filter forms.</div>`
        }
    ];
    let currentIndex = 0;
    const total = slides.length;
    const slideArea = document.getElementById('slideArea');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const counter = document.getElementById('counterText');
    const dots = document.getElementById('dotsContainer');

    function render(idx) {
        const s = slides[idx];
        slideArea.innerHTML = `<div class="slide-card"><div class="slide-title">${s.title}</div><div class="slide-sub"><i class="fas fa-angle-right"></i> ${s.subtitle}</div>${s.content}</div>`;
        counter.innerText = `${idx+1}/${total}`;
        prevBtn.disabled = idx === 0;
        nextBtn.disabled = idx === total-1;
        dots.innerHTML = '';
        for(let i=0;i<total;i++){ let d = document.createElement('div'); d.classList.add('dot'); if(i===idx) d.classList.add('active'); dots.appendChild(d); }
    }
    prevBtn.onclick = () => { if(currentIndex>0) render(--currentIndex); };
    nextBtn.onclick = () => { if(currentIndex<total-1) render(++currentIndex); };
    render(0);
</script>
</body>
</html>

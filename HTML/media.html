<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Embed Fix</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0a0c15, #1a0a2e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', sans-serif;
            padding: 20px;
        }
        .container {
            background: rgba(22, 26, 38, 0.95);
            border-radius: 1.5rem;
            padding: 2rem;
            max-width: 900px;
            width: 100%;
            border: 1px solid #4a2b7a;
        }
        h1 {
            color: #a78bfa;
            margin-bottom: 1.5rem;
            font-size: 1.8rem;
        }
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 0.8rem;
            background: #000;
        }
        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            margin-top: 1.5rem;
        }
        .controls button {
            background: #1e2a3a;
            color: #e2e8f0;
            border: 1px solid #334155;
            padding: 0.6rem 1.2rem;
            border-radius: 2rem;
            cursor: pointer;
            transition: 0.3s;
            font-size: 0.9rem;
        }
        .controls button:hover {
            background: #2d3a4e;
            border-color: #8b5cf6;
            transform: scale(0.97);
        }
        .info {
            color: #94a3b8;
            margin-top: 1rem;
            font-size: 0.9rem;
            padding: 0.8rem;
            background: #0f172a;
            border-radius: 0.5rem;
            border-left: 3px solid #8b5cf6;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 YouTube Embed Test</h1>
        
        <div class="video-wrapper">
            <iframe id="youtubePlayer"
                src="https://www.youtube.com/embed/dQw4w9WgXcQ"
                title="YouTube video player"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                allowfullscreen>
            </iframe>
        </div>

        <div class="controls">
            <button onclick="loadVideo('dQw4w9WgXcQ')">🎵 Rick Astley</button>
            <button onclick="loadVideo('tgbNymZ7vqY')">📺 YouTube Tutorial</button>
            <button onclick="loadVideo('9bZkp7q19f0')">🎤 Gangnam Style</button>
            <button onclick="loadVideo('kJQP7kiw5Fk')">🎵 Despacito</button>
            <button onclick="loadVideo('8d9xURuIs5M')">🎥 Your Video</button>
            <button onclick="loadVideo('dQw4w9WgXcQ', true)">🎯 No-Cookie</button>
        </div>

        <div class="info">
            💡 <strong>Tip:</strong> If a video shows "Error 153", it means the video owner has disabled embedding. Try another video!
        </div>
    </div>

    <script>
        function loadVideo(videoId, useNoCookie = false) {
            const iframe = document.getElementById('youtubePlayer');
            const domain = useNoCookie ? 'www.youtube-nocookie.com' : 'www.youtube.com';
            iframe.src = `https://${domain}/embed/${videoId}`;
        }
    </script>
</body>
</html>

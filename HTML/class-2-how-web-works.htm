                <div class="insight-card"><i class="fas fa-lightbulb"></i> <strong>Tip:</strong> Try answering before clicking! These reinforce environment setup concepts.</div>

    const qaData = [
        { q: "What is the shortcut to open the Command Palette in VS Code?", a: "Ctrl+Shift+P (or Cmd+Shift+P on Mac). This is the most important shortcut — it gives you access to every VS Code command." },
        { q: "What does the Live Server extension do?", a: "Creates a local development server at localhost:5500 and auto-refreshes the browser whenever you save any file (HTML, CSS, JS). This is called 'hot reload'." },
        { q: "Name three essential VS Code extensions and what each does.", a: "Live Server (auto-refresh browser), Prettier (auto-format code), ESLint (catch JS errors), Auto Rename Tag (syncs closing tags), GitLens (Git history)." },
        { q: "What is the correct professional folder structure for a web project?", a: "index.html at root, css/ folder for stylesheets, js/ folder for JavaScript, images/ folder for media, and README.md for documentation." },
        { q: "What Emmet shortcut creates a full HTML5 boilerplate?", a: "Type '!' (exclamation mark) and press Tab. This expands to DOCTYPE, html, head, body, and meta tags." },
        { q: "How do you use multi-cursor editing in VS Code?", a: "Hold Alt (Option on Mac) and click in multiple places to create multiple cursors. Type once and all cursors type simultaneously." },
        { q: "What is the shortcut to open the integrated terminal in VS Code?", a: "Ctrl + Backtick (the key above Tab). This opens a terminal inside VS Code so you can run Git, npm, or other commands without leaving the editor." },
        { q: "What is the purpose of the .prettierrc file?", a: "It configures Prettier formatting rules: single vs double quotes, tab width, semicolons, etc. Ensures consistent code style across a team." },
        { q: "What does 'format on save' do in VS Code settings?", a: "Automatically runs Prettier (or your default formatter) every time you save a file — keeping code clean without manual formatting." },
        { q: "What is the difference between index.html and other HTML files?", a: "index.html is the default entry point — when a browser visits a folder, it automatically looks for and loads index.html first." }
    ];

    let currentIndex = 0;
    const totalSlides = slides.length;

    const slideArea = document.getElementById('slideArea');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const counterText = document.getElementById('counterText');
    const dotsContainer = document.getElementById('dotsContainer');

    function renderQA() {
        const container = document.getElementById('qa-container');
        if (!container) return;
        container.innerHTML = '';
        qaData.forEach((item, idx) => {
            const qaDiv = document.createElement('div');
            qaDiv.className = 'qa-item';
            qaDiv.innerHTML = `
                <div class="qa-question" data-idx="${idx}">
                    <span><strong>${idx+1}.</strong> ${item.q}</span>
                    <i class="fas fa-chevron-down"></i>
                </div>
                <div class="qa-answer" id="answer-${idx}">
                    <p>${item.a}</p>
                </div>
            `;
            container.appendChild(qaDiv);
        });
        document.querySelectorAll('.qa-question').forEach(question => {
            question.addEventListener('click', function() {
                const idx = this.getAttribute('data-idx');
                const answerDiv = document.getElementById(`answer-${idx}`);
                const icon = this.querySelector('i');
                answerDiv.classList.toggle('show');
                icon.style.transform = answerDiv.classList.contains('show') ? 'rotate(180deg)' : 'rotate(0deg)';
            });
        });
    }

    function renderSlide(index) {
        const slide = slides[index];
        const html = `
            <div class="slide-card">
                <div class="slide-title">
                    ${slide.title}
                </div>
                <div class="slide-sub"><i class="fas fa-angle-right"></i> ${slide.subtitle}</div>
                <div class="slide-content">
                    ${slide.content}
                </div>
            </div>
        `;
        slideArea.innerHTML = html;
        if (index === 11) renderQA();
        counterText.innerHTML = `<i class="far fa-file-alt"></i> ${index+1} / ${totalSlides}`;
        prevBtn.disabled = (index === 0);
        nextBtn.disabled = (index === totalSlides-1);
        updateDots(index);
    }

    function updateDots(activeIndex) {
        dotsContainer.innerHTML = '';
        for (let i = 0; i < totalSlides; i++) {
            const dot = document.createElement('div');
            dot.classList.add('dot');
            if (i === activeIndex) dot.classList.add('active');
            dotsContainer.appendChild(dot);
        }
    }

    function nextSlide() { if (currentIndex < totalSlides - 1) { currentIndex++; renderSlide(currentIndex); } }
    function prevSlide() { if (currentIndex > 0) { currentIndex--; renderSlide(currentIndex); } }
    function handleKeyDown(e) {
        if (e.key === 'ArrowRight') { e.preventDefault(); nextSlide(); }
        else if (e.key === 'ArrowLeft') { e.preventDefault(); prevSlide(); }
    }

    prevBtn.addEventListener('click', prevSlide);
    nextBtn.addEventListener('click', nextSlide);
    window.addEventListener('keydown', handleKeyDown);
    renderSlide(0);
</script>

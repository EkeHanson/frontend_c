                <div class="content-grid">
                    <div class="concept-box"><h3><i class="fab fa-chrome"></i> What Browsers Do</h3><p>Request, download, interpret HTML/CSS, execute JS, display pages.</p></div>
                    <div class="concept-box"><h3><i class="fas fa-cogs"></i> Rendering Engines</h3><p>Chrome/Edge: Blink &nbsp;|&nbsp; Safari: WebKit &nbsp;|&nbsp; Firefox: Gecko</p></div>
                </div>
                <div class="engine-grid">
                    <div class="engine-card"><i class="fab fa-chrome"></i> <strong>Google Chrome</strong><br>JS Engine: <span class="highlight">V8</span><br>Node.js is built on V8!</div>
                    <div class="engine-card"><i class="fab fa-safari"></i> <strong>Apple Safari</strong><br>JS Engine: <span class="highlight">JavaScriptCore</span> (Nitro)</div>
                    <div class="engine-card"><i class="fab fa-firefox"></i> <strong>Mozilla Firefox</strong><br>JS Engine: <span class="highlight">SpiderMonkey</span></div>
                </div>
                <div class="concept-box" style="margin-top:0.5rem;">
                    <h3><i class="fab fa-node-js"></i> What is Node.js?</h3>
                    <p><span class="highlight">Node.js is NOT a separate JavaScript engine.</span> It is a <strong>runtime environment</strong> that extracts Chrome's <strong>V8 engine</strong> out of the browser, allowing you to run JavaScript on your computer or server — outside of any browser.</p>
                    <p style="margin-top:0.5rem;"><i class="fas fa-link"></i> <strong>Summary:</strong> V8 powers Chrome AND Node.js. JavaScriptCore powers Safari. SpiderMonkey powers Firefox.</p>
                </div>
                <div class="insight-card"><i class="fas fa-tools"></i> <strong>Why DevTools matters:</strong> Chrome DevTools uses V8 under the hood for powerful debugging.</div>
            `
        },
        {
            title: "<i class='fas fa-tools'></i> Developer Tools",
            subtitle: "Elements · Console · Network — your daily toolkit",
            content: `
                <div class="content-grid">
                    <div class="concept-box"><h3><i class="fas fa-code"></i> Elements Panel</h3><p>Inspect/edit HTML/CSS live.</p></div>
                    <div class="concept-box"><h3><i class="fas fa-terminal"></i> Console Tab</h3><p>Run JS, see errors/logs.</p></div>
                    <div class="concept-box"><h3><i class="fas fa-chart-line"></i> Network Tab</h3><p>Monitor HTTP requests, timing, status codes.</p></div>
                </div>
                <div class="insight-card"><i class="fas fa-lightbulb"></i> <span>Use Network tab → "Timing" panel to see DNS, TCP, TLS handshake times.</span></div>
            `
        },
        {
            title: "<i class='fas fa-chart-line'></i> The Complete Web Journey",
            subtitle: "From URL to visible page — unified flow",
            content: `
                <div class="journey-box" style="font-size:0.9rem;">
                    <i class="fas fa-arrow-right"></i> User → Browser → Domain Name → DNS → IP Address → Web Server → Backend → Database<br>
                    <i class="fas fa-arrow-down" style="margin-left:2rem;"></i> <span style="color:#fbbf24;">↓</span><br>
                    <i class="fas fa-arrow-right"></i> Response: HTML + CSS + JavaScript <span style="color:#60a5fa;">(executed by V8/JavaScriptCore/SpiderMonkey)</span><br>
                    <i class="fas fa-arrow-down" style="margin-left:2rem;"></i> <span style="color:#fbbf24;">↓</span><br>
                    <i class="fas fa-arrow-right"></i> Browser Rendering Engine (DOM + CSSOM + JS execution)<br>
                    <i class="fas fa-arrow-down" style="margin-left:2rem;"></i> <span style="color:#fbbf24;">↓</span><br>
                    <i class="fas fa-arrow-right"></i> <span class="highlight">Visible Web Page</span>
                </div>
                <div class="insight-card"><i class="fas fa-graduation-cap"></i> <strong>Why this matters:</strong> Before writing code, every web developer must understand this complete journey — from URL to rendered webpage, including which JS engine runs their code.</div>
            `
        },
        {
            title: "<i class='fas fa-question-circle'></i> Knowledge Check",
            subtitle: "10 questions — click to toggle answers",
            content: `
                <div class="qa-section">
                    <div class="qa-title"><i class="fas fa-question-circle"></i> Toggle Questions (click to show/hide answer)</div>
                    <div id="qa-container"></div>
                </div>
                <div class="insight-card"><i class="fas fa-lightbulb"></i> <strong>Tip:</strong> Try answering before clicking! These reinforce key concepts.</div>
            `
        }
    ];

    const qaData = [
        { q: "What is the main difference between a static and dynamic website?", a: "Static websites show the same content to every visitor (pre-built files). Dynamic websites generate content on the fly based on user, database, or actions — each user may see different content." },
        { q: "Is Gmail a website or a web application? Why?", a: "Gmail is a web application because users can perform complex tasks (send, receive, delete, search emails), requires login, and has high interactivity." },
        { q: "What does frontend development handle vs backend development?", a: "Frontend handles UI (buttons, forms, animations). Backend handles logic (databases, authentication, APIs, payments)." },
        { q: "What is DNS and why is it important?", a: "DNS translates domain names (google.com) into IP addresses. Important because humans remember names, not numbers." },
        { q: "What JavaScript engine does Google Chrome use? What about Safari and Firefox?", a: "Chrome uses V8, Safari uses JavaScriptCore (Nitro), Firefox uses SpiderMonkey." },
        { q: "What is Node.js and how is it related to V8?", a: "Node.js is a runtime that extracts Chrome's V8 engine, allowing JavaScript to run on servers. Node.js uses V8 — it is not a separate engine." },
        { q: "What's the difference between HTTP and HTTPS?", a: "HTTP is unencrypted. HTTPS adds SSL/TLS encryption to secure data (passwords, credit cards)." },
        { q: "What are the 3 main panels in Chrome DevTools?", a: "Elements (inspect HTML/CSS), Console (run JS, see errors), Network (monitor HTTP requests)." },
        { q: "What are the four main hosting types?", a: "Shared, VPS, Cloud (AWS/Google Cloud), Static (Netlify/Vercel)." },
        { q: "What does a browser's rendering engine do?", a: "Converts HTML/CSS code into visual pixels. Examples: Blink (Chrome), WebKit (Safari), Gecko (Firefox). Different from JS engine." }
    ];

    let currentIndex = 0;
    const totalSlides = slides.length;

    const slideArea = document.getElementById('slideArea');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const counterText = document.getElementById('counterText');
    const dotsContainer = document.getElementById('dotsContainer');

    function renderQA() {
        const container = document.getElementById('qa-container');
        if (!container) return;
        container.innerHTML = '';
        qaData.forEach((item, idx) => {
            const qaDiv = document.createElement('div');
            qaDiv.className = 'qa-item';
            qaDiv.innerHTML = `
                <div class="qa-question" data-idx="${idx}">
                    <span><strong>${idx+1}.</strong> ${item.q}</span>
                    <i class="fas fa-chevron-down"></i>
                </div>
                <div class="qa-answer" id="answer-${idx}">
                    <p>${item.a}</p>
                </div>
            `;
            container.appendChild(qaDiv);
        });
        document.querySelectorAll('.qa-question').forEach(question => {
            question.addEventListener('click', function() {
                const idx = this.getAttribute('data-idx');
                const answerDiv = document.getElementById(`answer-${idx}`);
                const icon = this.querySelector('i');
                answerDiv.classList.toggle('show');
                icon.style.transform = answerDiv.classList.contains('show') ? 'rotate(180deg)' : 'rotate(0deg)';
            });
        });
    }

    function renderSlide(index) {
        const slide = slides[index];
        const html = `
            <div class="slide-card">
                <div class="slide-title">
                    ${slide.title}
                </div>
                <div class="slide-sub"><i class="fas fa-angle-right"></i> ${slide.subtitle}</div>
                <div class="slide-content">
                    ${slide.content}
                </div>
            </div>
        `;
        slideArea.innerHTML = html;
        if (index === 12) renderQA();
        counterText.innerHTML = `<i class="far fa-file-alt"></i> ${index+1} / ${totalSlides}`;
        prevBtn.disabled = (index === 0);
        nextBtn.disabled = (index === totalSlides-1);
        updateDots(index);
    }

    function updateDots(activeIndex) {
        dotsContainer.innerHTML = '';
        for (let i = 0; i < totalSlides; i++) {
            const dot = document.createElement('div');
            dot.classList.add('dot');
            if (i === activeIndex) dot.classList.add('active');
            dotsContainer.appendChild(dot);
        }
    }

    function nextSlide() { if (currentIndex < totalSlides - 1) { currentIndex++; renderSlide(currentIndex); } }
    function prevSlide() { if (currentIndex > 0) { currentIndex--; renderSlide(currentIndex); } }
    function handleKeyDown(e) {
        if (e.key === 'ArrowRight') { e.preventDefault(); nextSlide(); }
        else if (e.key === 'ArrowLeft') { e.preventDefault(); prevSlide(); }
    }

    prevBtn.addEventListener('click', prevSlide);
    nextBtn.addEventListener('click', nextSlide);
    window.addEventListener('keydown', handleKeyDown);
    renderSlide(0);
</script>
</body>
</html>

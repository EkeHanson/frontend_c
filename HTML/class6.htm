<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>HTML Mastery Course | Days 6-7 Interactive Lessons</title>
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #0a0c15 0%, #1a0a2e 100%);
            min-height: 100vh;
            padding: 1.5rem;
        }

        .curriculum-header {
            max-width: 1300px;
            margin: 0 auto 1rem auto;
            background: linear-gradient(95deg, #0f172a 0%, #2d1b4e 100%);
            border-radius: 1.5rem;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            border: 1px solid #4a2b7a;
            box-shadow: 0 10px 20px -5px rgba(0,0,0,0.3);
        }
        .badge {
            background: #8b5cf6;
            padding: 0.3rem 1rem;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: bold;
            color: white;
        }
        .class-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: #e2e8f0;
        }
        .duration {
            color: #94a3b8;
            font-size: 0.85rem;
        }

        .presentation-container {
            max-width: 1300px;
            margin: 0 auto;
            background: rgba(255,255,255,0.03);
            border-radius: 2rem;
            backdrop-filter: blur(2px);
            box-shadow: 0 25px 45px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.05);
            overflow: hidden;
        }

        .slide-area {
            min-height: 600px;
            background: #0f1119;
            padding: 2rem;
        }

        .slide-card {
            background: rgba(22, 26, 38, 0.98);
            backdrop-filter: blur(4px);
            border-radius: 2rem;
            padding: 2rem 2.2rem;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.5);
            border: 1px solid rgba(139, 92, 246, 0.3);
            animation: fadeSlide 0.4s ease;
        }

        @keyframes fadeSlide {
            from {
                opacity: 0;
                transform: translateX(20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .slide-title {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #E0F2FE, #a78bfa);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            border-left: 5px solid #8b5cf6;
            padding-left: 1.2rem;
        }

        .slide-title i {
            background: none;
            -webkit-background-clip: unset;
            color: #a78bfa;
            font-size: 1.8rem;
        }

        .slide-sub {
            color: #a0afc9;
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
            border-left: 5px solid #8b5cf6;
            padding-left: 1.2rem;
        }

        .content-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            margin-top: 1rem;
        }

        .concept-box {
            flex: 1;
            min-width: 240px;
            background: #1a1f2e;
            border-radius: 1.5rem;
            padding: 1.3rem;
            border: 1px solid #334155;
            transition: all 0.2s;
        }
        .concept-box:hover {
            border-color: #8b5cf6;
            transform: translateY(-2px);
        }
        .concept-box h3 {
            color: #a78bfa;
            font-size: 1.3rem;
            margin-bottom: 0.8rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }
        .concept-box p, .concept-list, .concept-box li {
            color: #e2e8f0;
            line-height: 1.55;
            font-size: 0.95rem;
        }
        .highlight {
            color: #fbbf24;
            font-weight: 600;
        }
        .tag {
            background: #1e293b;
            padding: 0.25rem 0.9rem;
            border-radius: 30px;
            font-size: 0.75rem;
            font-family: monospace;
            color: #c4b5fd;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }
        .insight-card {
            margin-top: 1.2rem;
            background: #0f172a;
            padding: 0.9rem 1.2rem;
            border-radius: 1rem;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.6rem;
            color: #e2e8f0;
            border-left: 3px solid #8b5cf6;
        }
        .two-column-split {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            margin: 1rem 0;
        }
        .col {
            flex: 1;
            background: #131a2a;
            border-radius: 1.2rem;
            padding: 1.2rem;
            border: 1px solid #2d3a5e;
        }
        .col h4 {
            color: #fbbf24;
            margin-bottom: 0.8rem;
            font-size: 1.2rem;
        }
        pre {
            background: #0a0e18;
            padding: 1rem;
            border-radius: 1rem;
            overflow-x: auto;
            font-size: 0.8rem;
            color: #e2e8f0;
            margin: 0.8rem 0;
            border: 1px solid #334155;
            font-family: 'Fira Code', monospace;
            position: relative;
        }
        code {
            font-family: 'Fira Code', monospace;
            color: #cbd5e6;
        }
        
        .copy-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 4px 8px;
            color: #94a3b8;
            cursor: pointer;
            font-size: 0.7rem;
            transition: 0.2s;
        }
        .copy-btn:hover {
            background: #2d3a4e;
            color: #e2e8f0;
        }

        .iframe-demo {
            background: #0a0e18;
            border-radius: 1rem;
            padding: 1rem;
            margin: 0.8rem 0;
            border: 1px solid #334155;
        }
        .iframe-demo iframe {
            width: 100%;
            border-radius: 0.5rem;
            background: white;
        }

        .live-iframe-container {
            background: #0a0e18;
            border-radius: 1rem;
            padding: 1rem;
            border: 1px solid #334155;
            margin: 0.8rem 0;
        }
        .live-iframe-container iframe {
            width: 100%;
            height: 350px;
            border: none;
            border-radius: 0.5rem;
            background: white;
        }

        .iframe-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            margin-top: 0.8rem;
        }
        .iframe-controls input {
            flex: 1;
            min-width: 200px;
            padding: 0.5rem 1rem;
            border-radius: 2rem;
            border: 1px solid #334155;
            background: #1a1f2e;
            color: #e2e8f0;
            font-family: inherit;
        }
        .iframe-controls input:focus {
            outline: none;
            border-color: #8b5cf6;
        }

        /* Block & Inline Styles */
        .block-demo {
            background: #1a2a3a;
            padding: 0.8rem;
            margin: 0.5rem 0;
            border-radius: 0.5rem;
            border-left: 3px solid #22c55e;
        }
        .inline-demo {
            background: #1a2a3a;
            padding: 0.3rem 0.8rem;
            margin: 0.2rem;
            border-radius: 0.3rem;
            border: 1px solid #4ade80;
            display: inline-block;
        }
        .element-tag {
            display: inline-block;
            background: #1e293b;
            padding: 0.15rem 0.6rem;
            border-radius: 0.3rem;
            font-family: 'Fira Code', monospace;
            font-size: 0.75rem;
            color: #86efac;
            margin: 0.1rem;
        }
        .element-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            margin: 0.5rem 0;
        }
        .badge-block {
            background: #22c55e;
            color: white;
            padding: 0.15rem 0.6rem;
            border-radius: 0.3rem;
            font-size: 0.65rem;
            font-weight: bold;
            text-transform: uppercase;
        }
        .badge-inline {
            background: #3b82f6;
            color: white;
            padding: 0.15rem 0.6rem;
            border-radius: 0.3rem;
            font-size: 0.65rem;
            font-weight: bold;
            text-transform: uppercase;
        }
        .badge-table {
            background: #8b5cf6;
            color: white;
            padding: 0.15rem 0.6rem;
            border-radius: 0.3rem;
            font-size: 0.65rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        /* Table Styles */
        .table-preview {
            background: #0a0e18;
            border-radius: 0.5rem;
            padding: 0.5rem;
            margin: 0.5rem 0;
            overflow-x: auto;
        }
        .table-preview table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }
        .table-preview th, .table-preview td {
            border: 1px solid #334155;
            padding: 0.4rem 0.8rem;
            text-align: left;
            color: #e2e8f0;
        }
        .table-preview th {
            background: #1e293b;
            color: #4ade80;
        }
        .table-preview tr:nth-child(even) {
            background: #1a2a3a;
        }

        .comparison-table {
            width: 100%;
            border-collapse: collapse;
            margin: 0.5rem 0;
            font-size: 0.85rem;
        }
        .comparison-table th, .comparison-table td {
            border: 1px solid #334155;
            padding: 0.7rem;
            text-align: left;
            color: #e2e8f0;
        }
        .comparison-table th {
            background: #1e293b;
            color: #fbbf24;
        }
        .comparison-table .block-row {
            background: rgba(34, 197, 94, 0.1);
        }
        .comparison-table .inline-row {
            background: rgba(59, 130, 246, 0.1);
        }

        .interactive-toggle {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin: 0.8rem 0;
        }
        .interactive-toggle button {
            flex: 1;
            min-width: 120px;
            justify-content: center;
        }
        .interactive-toggle button.active-toggle {
            border-color: #22c55e;
            background: #22c55e20;
        }

        button {
            background: #1e2a3a;
            border: none;
            font-size: 1rem;
            font-weight: 600;
            padding: 0.5rem 1.5rem;
            border-radius: 2rem;
            color: #e2e8f0;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-family: inherit;
            border: 1px solid #334155;
        }
        button:hover:not(:disabled) {
            background: #2d3a4e;
            transform: scale(0.97);
            border-color: #8b5cf6;
        }
        .nav-bar {
            background: #0b0e16;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #2a2f3f;
            flex-wrap: wrap;
        }
        .nav-buttons {
            display: flex;
            gap: 1rem;
        }
        .slide-counter {
            font-size: 0.9rem;
            background: #1a1f2c;
            padding: 0.4rem 1rem;
            border-radius: 2rem;
            color: #c4b5fd;
        }
        .indicator-dots {
            display: flex;
            gap: 0.5rem;
        }
        .dot {
            width: 8px;
            height: 8px;
            background: #334155;
            border-radius: 10px;
            transition: 0.2s;
        }
        .dot.active {
            background: #8b5cf6;
            width: 22px;
        }
        
        .progress-bar {
            width: 100%;
            height: 4px;
            background: #1a1f2c;
            border-radius: 2px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #8b5cf6, #a78bfa);
            transition: width 0.3s ease;
            width: 0%;
        }

        .qa-item {
            margin-bottom: 0.8rem;
            background: #131b2e;
            border-radius: 1rem;
            overflow: hidden;
        }
        .qa-question {
            background: #1a2338;
            cursor: pointer;
            padding: 0.8rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.2s;
        }
        .qa-question:hover {
            background: #232f4a;
        }
        .qa-question i {
            transition: transform 0.3s;
        }
        .qa-answer {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease, padding 0.3s ease;
            padding: 0 1rem;
            background: #0f172a;
        }
        .qa-answer.show {
            max-height: 500px;
            padding: 0.5rem 1rem;
        }

        .visual-demo {
            background: #0a0e18;
            border-radius: 1rem;
            padding: 1.5rem;
            border: 2px dashed #334155;
            margin: 0.8rem 0;
        }
        .visual-demo .block-element {
            background: #22c55e33;
            border: 2px solid #22c55e;
            padding: 0.5rem;
            margin: 0.3rem 0;
            border-radius: 0.3rem;
            color: #e2e8f0;
        }
        .visual-demo .inline-element {
            background: #3b82f633;
            border: 2px solid #3b82f6;
            padding: 0.3rem 0.8rem;
            margin: 0.2rem;
            border-radius: 0.3rem;
            color: #e2e8f0;
            display: inline-block;
        }

        footer {
            font-size: 0.7rem;
            text-align: center;
            padding: 0.7rem;
            background: #07090f;
            color: #8ca3c7;
        }
        @media (max-width: 700px) {
            .slide-area { padding: 1rem; }
            .slide-title { font-size: 1.4rem; }
            .slide-card { padding: 1rem; }
        }
    </style>
</head>
<body>

<div class="curriculum-header">
    <div><span class="badge"><i class="fas fa-code"></i> DAYS 6-7 • HTML MODULE</span></div>
    <div class="class-title"><i class="fas fa-layer-group"></i> Iframes + Block/Inline + Tables</div>
    <div class="duration"><i class="far fa-clock"></i> Complete Reference + Interactive Demos</div>
</div>

<div class="presentation-container">
    <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="slide-area" id="slideArea"></div>
    <div class="nav-bar">
        <div class="indicator-dots" id="dotsContainer"></div>
        <div class="nav-buttons">
            <button id="prevBtn"><i class="fas fa-chevron-left"></i> Prev</button>
            <span class="slide-counter" id="counterText"><i class="far fa-file-alt"></i> 1 / 30</span>
            <button id="nextBtn">Next <i class="fas fa-chevron-right"></i></button>
        </div>
    </div>
    <footer><i class="fas fa-graduation-cap"></i> HTML Iframes | Block & Inline Elements | HTML Tables | Complete Reference</footer>
</div>

<script>
    // Complete combined slides array - Day 6 Iframes + Day 7 Block/Inline + Tables
    const slides = [
        // ==================== DAY 6: IFRAMES (Slides 0-11) ====================
        {
            title: "<i class='fas fa-window-restore'></i> What is an Iframe?",
            subtitle: "Display a web page within a web page",
            content: `
                <div class="concept-box">
                    <h3><i class="fas fa-question-circle"></i> Understanding Iframes</h3>
                    <p>An HTML <span class="highlight">iframe</span> (inline frame) is used to embed another document within the current HTML document.</p>
                    <div class="iframe-demo">
                        <iframe src="https://example.com" height="200" style="width:100%;" title="Example Demo"></iframe>
                        <p style="color:#94a3b8; font-size:0.8rem; margin-top:0.5rem;">⬆️ Live iframe displaying example.com</p>
                    </div>
                    <div class="insight-card">
                        <i class="fas fa-lightbulb"></i>
                        <span>Iframes are commonly used for embedding videos, maps, social media posts, and external content.</span>
                    </div>
                </div>
            `
        },
        {
            title: "<i class='fas fa-code'></i> Iframe Syntax",
            subtitle: "The basic structure of an iframe element",
            content: `
                <div class="two-column-split">
                    <div class="col">
                        <h4><i class="fas fa-terminal"></i> Basic Syntax</h4>
                        <pre><code>&lt;iframe src="url" title="description"&gt;&lt;/iframe&gt;</code></pre>
                        <div class="insight-card" style="margin-top:0.5rem;">
                            <i class="fas fa-universal-access"></i>
                            <span><strong>Important:</strong> Always include a <code>title</code> attribute for screen readers!</span>
                        </div>
                    </div>
                    <div class="col">
                        <h4><i class="fas fa-example"></i> Example</h4>
                        <pre><code>&lt;iframe 
    src="https://example.com" 
    title="Example Website"
    height="300"
    width="100%"
&gt;&lt;/iframe&gt;</code></pre>
                        <div style="background:#0a0e18; border-radius:0.5rem; padding:0.5rem; margin-top:0.5rem;">
                            <iframe src="https://example.com" title="Example Website" height="200" style="width:100%; border:none; border-radius:0.3rem;"></iframe>
                        </div>
                    </div>
                </div>
            `
        },
        {
            title: "<i class='fas fa-arrows-alt-v'></i> Setting Height & Width",
            subtitle: "Controlling iframe dimensions",
            content: `
                <div class="two-column-split">
                    <div class="col">
                        <h4><i class="fas fa-ruler-combined"></i> HTML Attributes</h4>
                        <pre><code>&lt;iframe src="demo.htm" 
    height="200" 
    width="300" 
    title="Iframe Example"&gt;
&lt;/iframe&gt;</code></pre>
                        <div style="background:#0a0e18; border-radius:0.5rem; padding:0.5rem;">
                            <iframe src="https://example.com" height="200" width="300" title="200x300 iframe" style="border:none; border-radius:0.3rem;"></iframe>
                            <p style="color:#94a3b8; font-size:0.7rem;">⬆️ 200px × 300px</p>
                        </div>
                    </div>
                    <div class="col">
                        <h4><i class="fab fa-css3-alt"></i> CSS Properties</h4>
                        <pre><code>&lt;iframe src="demo.htm" 
    style="height:200px; width:300px;" 
    title="Iframe Example"&gt;
&lt;/iframe&gt;</code></pre>
                        <div class="insight-card" style="margin-top:0.5rem;">
                            <i class="fas fa-info-circle"></i>
                            <span>CSS is more flexible — you can use <code>%</code>, <code>vw</code>, <code>vh</code>, etc.</span>
                        </div>
                    </div>
                </div>
            `
        },
        {
            title: "<i class='fas fa-border-none'></i> Removing the Border",
            subtitle: "Customizing iframe borders with CSS",
            content: `
                <div class="two-column-split">
                    <div class="col">
                        <h4><i class="fas fa-ban"></i> No Border</h4>
                        <pre><code>&lt;iframe src="demo.htm" 
    style="border:none;" 
    title="No Border"&gt;
&lt;/iframe&gt;</code></pre>
                        <div style="background:#0a0e18; border-radius:0.5rem; padding:0.5rem;">
                            <iframe src="https://example.com" style="border:none; width:100%; height:150px; border-radius:0.3rem;" title="No border iframe"></iframe>
                            <p style="color:#94a3b8; font-size:0.7rem;">⬆️ No border (clean)</p>
                        </div>
                    </div>
                    <div class="col">
                        <h4><i class="fas fa-paint-brush"></i> Custom Border</h4>
                        <pre><code>&lt;iframe src="demo.htm" 
    style="border:3px solid #8b5cf6; border-radius:12px;" 
    title="Styled Border"&gt;
&lt;/iframe&gt;</code></pre>
                        <div style="background:#0a0e18; border-radius:0.5rem; padding:0.5rem;">
                            <iframe src="https://example.com" style="border:3px solid #8b5cf6; border-radius:12px; width:100%; height:150px;" title="Styled border iframe"></iframe>
                            <p style="color:#94a3b8; font-size:0.7rem;">⬆️ Purple border with rounded corners</p>
                        </div>
                    </div>
                </div>
                <div class="insight-card">
                    <i class="fas fa-magic"></i>
                    <span>Use <code>border: none</code> or set custom borders to match your design!</span>
                </div>
            `
        },
        {
            title: "<i class='fas fa-crosshairs'></i> Iframe as Link Target",
            subtitle: "Loading content into an iframe via links",
            content: `
                <div class="concept-box">
                    <h3><i class="fas fa-link"></i> Target Attribute</h3>
                    <p>Use the <code>target</code> attribute of a link to load content into a named iframe.</p>
                    <div class="iframe-demo">
                        <iframe name="demo-iframe" src="https://example.com" title="Link Target Demo" style="width:100%; height:250px; border:1px solid #334155; border-radius:0.5rem; background:white;"></iframe>
                        <div style="display:flex; flex-wrap:wrap; gap:0.8rem; margin-top:0.8rem;">
                            <a href="https://example.com" target="demo-iframe" style="color:#a78bfa; padding:0.4rem 1rem; background:#1a1f2e; border-radius:2rem; text-decoration:none; border:1px solid #334155; transition:0.2s;" onmouseover="this.style.borderColor='#8b5cf6'" onmouseout="this.style.borderColor='#334155'">Example.com</a>
                            <a href="https://www.wikipedia.org" target="demo-iframe" style="color:#a78bfa; padding:0.4rem 1rem; background:#1a1f2e; border-radius:2rem; text-decoration:none; border:1px solid #334155; transition:0.2s;" onmouseover="this.style.borderColor='#8b5cf6'" onmouseout="this.style.borderColor='#334155'">Wikipedia</a>
                            <a href="https://github.com" target="demo-iframe" style="color:#a78bfa; padding:0.4rem 1rem; background:#1a1f2e; border-radius:2rem; text-decoration:none; border:1px solid #334155; transition:0.2s;" onmouseover="this.style.borderColor='#8b5cf6'" onmouseout="this.style.borderColor='#334155'">GitHub</a>
                            <a href="https://www.youtube.com/embed/dQw4w9WgXcQ" target="demo-iframe" style="color:#a78bfa; padding:0.4rem 1rem; background:#1a1f2e; border-radius:2rem; text-decoration:none; border:1px solid #334155; transition:0.2s;" onmouseover="this.style.borderColor='#8b5cf6'" onmouseout="this.style.borderColor='#334155'">YouTube</a>
                        </div>
                        <pre style="margin-top:0.8rem;"><code>&lt;iframe name="demo-iframe" src="https://example.com"&gt;&lt;/iframe&gt;

        {

            `
        },
        {
            title: "<i class='fas fa-graduation-cap'></i> Complete Summary",
            subtitle: "Everything you learned in Days 6-7",
            content: `
                <div class="two-column-split">
                    <div class="col">

                        <ul style="color:#e2e8f0; margin-left:1.2rem;">

                                <li><span class="badge-block">BLOCK</span> starts new line, takes full width</li>
                                <li><span class="badge-inline">INLINE</span> flows with text, takes needed width</li>
                                <li><code>&lt;div&gt;</code> = block container, <code>&lt;span&gt;</code> = inline container</li>
                            </ul>
                        </div>
                    </div>
                    <div class="col">
                        <h4><i class="fas fa-table"></i> Tables Summary</h4>
                        <ul style="color:#e2e8f0; margin-left:1.2rem;">
                            <li><code>&lt;table&gt;</code> - defines the table</li>
                            <li><code>&lt;tr&gt;</code> - table row</li>
                            <li><code>&lt;td&gt;</code> - table data cell</li>
                            <li><code>&lt;th&gt;</code> - table header cell</li>
                            <li><code>colspan</code> - merge columns</li>
                            <li><code>rowspan</code> - merge rows</li>
                        </ul>
                        <div style="margin-top:1rem;">
                            <h4 style="color:#fbbf24; font-size:1rem;">Table Styling</h4>
                            <ul style="color:#e2e8f0; margin-left:1.2rem;">

                                <li><code>:nth-child(even)</code> for zebra stripes</li>
                                <li><code>:hover</code> for interactive rows</li>

                        </div>
                    </div>
                </div>
                <div class="insight-card">
                    <i class="fas fa-lightbulb"></i>
                    <span><strong>Practice Challenge:</strong> Create a student grade table with zebra stripes, hover effects, and a caption!</span>
                </div>
            `
        }
    ];

    // Knowledge check questions - Iframes
    const qaChecklistIframe = [
        { q: "What does iframe stand for and what is its purpose?", a: "Inline Frame — it displays another HTML document within the current page." },
        { q: "Which attribute is required for accessibility in an iframe?", a: "The <code>title</code> attribute, which describes the content for screen readers." },
        { q: "How do you remove the default border from an iframe?", a: "Use <code>style='border:none;'</code> or <code>style='border:0;'</code>." },
        { q: "What attribute makes an iframe load content from a link?", a: "The <code>target</code> attribute on the link, referring to the iframe's <code>name</code> attribute." },
        { q: "Which attribute restricts what an iframe can do for security?", a: "The <code>sandbox</code> attribute applies restrictions to the embedded content." }
    ];

    // Knowledge check questions - Block & Inline
    const qaChecklistBlock = [
        { q: "What is the main difference between block and inline elements?", a: "Block elements start on new lines and take full width. Inline elements stay in the same line and only take needed width." },
        { q: "Which HTML element is the standard block-level container?", a: "<code>&lt;div&gt;</code> - it's a block-level element used as a container." },
        { q: "Which HTML element is the standard inline container?", a: "<code>&lt;span&gt;</code> - it's an inline element used to style parts of text." },
        { q: "Can an inline element contain a block-level element?", a: "No! An inline element <span class='highlight'>cannot</span> contain a block-level element." },
        { q: "What CSS property controls the display behavior of an element?", a: "The <code>display</code> property (e.g., <code>display: block</code>, <code>display: inline</code>)." }
    ];

    // Knowledge check questions - Tables
    const qaChecklistTables = [
        { q: "What does <code>&lt;tr&gt;</code> stand for in HTML tables?", a: "Table Row - it defines a row in an HTML table." },
        { q: "What is the difference between <code>&lt;th&gt;</code> and <code>&lt;td&gt;</code>?", a: "<code>&lt;th&gt;</code> is a table header cell (bold, centered), <code>&lt;td&gt;</code> is a regular table data cell." },
        { q: "Which attribute merges cells across multiple columns?", a: "<code>colspan</code> - e.g., <code>&lt;td colspan='2'&gt;</code> merges two columns." },
        { q: "Which attribute merges cells across multiple rows?", a: "<code>rowspan</code> - e.g., <code>&lt;td rowspan='3'&gt;</code> merges three rows." },
        { q: "How do you add zebra stripes to a table?", a: "Use CSS <code>:nth-child(even)</code> on <code>&lt;tr&gt;</code> elements." },
        { q: "What CSS property collapses double borders into one?", a: "<code>border-collapse: collapse;</code> on the table element." }
    ];

    let currentIndex = 0;
    const totalSlides = slides.length;
    const slideArea = document.getElementById('slideArea');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const counterText = document.getElementById('counterText');
    const dotsContainer = document.getElementById('dotsContainer');
    const progressFill = document.getElementById('progressFill');

    // Functions for the live iframe playground
    window.loadIframe = function() {
        const url = document.getElementById('iframeUrlInput').value;
        if (url) {
            document.getElementById('liveIframe').src = url;
        }
    };

    window.resetIframe = function() {
        const input = document.getElementById('iframeUrlInput');
        input.value = 'https://example.com';
        document.getElementById('liveIframe').src = 'https://example.com';
    };

    window.loadIframePreset = function(url) {
        document.getElementById('iframeUrlInput').value = url;
        document.getElementById('liveIframe').src = url;
    };

    function renderKnowledgeCheck(containerId, questions) {
        const container = document.getElementById(containerId);
        if (!container) return;
        container.innerHTML = '';
        questions.forEach((item, idx) => {
            const qaDiv = document.createElement('div');
            qaDiv.className = 'qa-item';
            qaDiv.innerHTML = `
                <div class="qa-question" data-idx="${idx}">
                    <span><strong>${idx+1}.</strong> ${item.q}</span>
                    <i class="fas fa-chevron-down"></i>
                </div>
                <div class="qa-answer" id="${containerId}-ans-${idx}">
                    <p style="padding:0.6rem 0;">✅ <span class="highlight">Answer:</span> ${item.a}</p>
                </div>
            `;
            container.appendChild(qaDiv);
        });
        document.querySelectorAll(`#${containerId} .qa-question`).forEach(q => {
            q.addEventListener('click', function() {
                const idx = this.getAttribute('data-idx');
                const ansDiv = document.getElementById(`${containerId}-ans-${idx}`);
                const icon = this.querySelector('i');
                if (ansDiv.classList.contains('show')) {
                    ansDiv.classList.remove('show');
                    icon.style.transform = 'rotate(0deg)';
                } else {
                    ansDiv.classList.add('show');
                    icon.style.transform = 'rotate(180deg)';
                }
            });
        });
    }

    function renderSlide(index) {
        const slide = slides[index];
        const html = `
            <div class="slide-card">
                <div class="slide-title">${slide.title}</div>
                <div class="slide-sub"><i class="fas fa-angle-right"></i> ${slide.subtitle}</div>
                <div class="slide-content">${slide.content}</div>
            </div>
        `;
        slideArea.innerHTML = html;
        
        // Render knowledge checks
        if (index === 10) {
            renderKnowledgeCheck('checkContainerIframe', qaChecklistIframe);
        }
        if (index === 18) {
            renderKnowledgeCheck('checkContainerBlock', qaChecklistBlock);
        }
        if (index === 28) {
            renderKnowledgeCheck('checkContainerTables', qaChecklistTables);
        }
        
        // Update navigation
        counterText.innerHTML = `<i class="far fa-file-alt"></i> ${index+1} / ${totalSlides}`;
        prevBtn.disabled = (index === 0);
        nextBtn.disabled = (index === totalSlides-1);
        
        // Update dots
        updateDots(index);
        
        // Update progress
        progressFill.style.width = `${((index+1) / totalSlides) * 100}%`;
        
        // Scroll to top of slide
        slideArea.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function updateDots(activeIndex) {
        dotsContainer.innerHTML = '';
        for (let i = 0; i < totalSlides; i++) {
            const dot = document.createElement('div');
            dot.classList.add('dot');
            if (i === activeIndex) dot.classList.add('active');
            dotsContainer.appendChild(dot);
        }
    }

    function nextSlide() {
        if (currentIndex < totalSlides - 1) {
            currentIndex++;
            renderSlide(currentIndex);
        }
    }

    function prevSlide() {
        if (currentIndex > 0) {
            currentIndex--;
            renderSlide(currentIndex);
        }
    }

    // Keyboard navigation
    window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight') nextSlide();
        if (e.key === 'ArrowLeft') prevSlide();
        if (e.key === 'Home') { 
            currentIndex = 0; 
            renderSlide(0); 
        }
        if (e.key === 'End') { 
            currentIndex = totalSlides - 1; 
            renderSlide(currentIndex); 
        }
    });

    // Button event listeners
    prevBtn.addEventListener('click', prevSlide);
    nextBtn.addEventListener('click', nextSlide);

    // Load saved progress
    const savedSlide = localStorage.getItem('combinedDays67Slide');
    if (savedSlide !== null) {
        const parsed = parseInt(savedSlide);
        if (parsed >= 0 && parsed < totalSlides) {
            currentIndex = parsed;
        }
    }

    // Save progress on slide change
    const originalRender = renderSlide;
    renderSlide = function(index) {
        originalRender(index);
        localStorage.setItem('combinedDays67Slide', index);
    };

    // Initial render
    renderSlide(currentIndex);
</script>
